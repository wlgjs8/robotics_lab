# head(D435 RGB) + 손목 D405 2개(color+depth, raw 클라우드/정책용). USB3.
# head는 rb_gui head view(색상) 전용 — IR 스테레오 페어는 Fast-FoundationStereo
# 입력이었고 2026-08-16 제거됐다. 손목 D405는 raw depth -> 모델 없이 backproject.
server:
  name: camera_server
  mode: capture_only
  clock: monotonic_raw
  simulate_cameras: false

shared_memory:
  name: "/camera_server_frames"
  size_mb: 1536
  ring_slots: 4
  unlink_on_start: true

metadata:
  transport: zmq_pub
  pub_bind: "tcp://127.0.0.1:5600"
  health_topic: "camera.health"
  bundle_topic: "camera.bundle"

sync:
  mode: software
  master_camera: head
  bundle_policy: nearest_timestamp
  # head(D435) vs 손목(D405) 소프트웨어 타임스탬프 skew ~15ms -> 1프레임(33ms) 윈도우로 완화
  max_bundle_time_diff_ms: 33.0
  publish_incomplete_bundles: false

cameras:
  head:
    serial: "313522072863"
    required: true
    streams:
      color: { enabled: true,  width: 1280, height: 720, fps: 30, format: rgb8 }
      depth: { enabled: false, width: 640,  height: 480, fps: 30, format: z16 }
  left_realsense:
    # 2026-07-23: wrist cameras physically swapped between arms; serial follows the unit.
    serial: "412622272078"
    required: true
    streams:
      color: { enabled: true, width: 640, height: 480, fps: 30, format: rgb8 }
      depth: { enabled: true, width: 640, height: 480, fps: 30, format: z16 }
  right_realsense:
    serial: "260322278348"
    required: true
    streams:
      color: { enabled: true, width: 640, height: 480, fps: 30, format: rgb8 }
      depth: { enabled: true, width: 640, height: 480, fps: 30, format: z16 }

recording:
  enabled: false
  output_dir: "/data/episodes"
  queue_capacity_frames: 300
  writer_threads: 4
  drop_policy: drop_oldest
  raw_format: true

health:
  publish_rate_hz: 1
  warn_if_frame_age_ms_gt: 100
  warn_if_drop_count_increases: true
  warn_if_bundle_skew_ms_gt: 10

reconnect:
  enabled: true
  max_attempts: 0
  retry_interval_ms: 1000
  frame_timeout_ms: 2000
