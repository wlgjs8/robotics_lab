# 90 fps variant of quad_realsense_fisheye.yaml for the observation-age experiment
# (2026-08-16). All four color cameras + both depths raised 30 -> 90 fps:
#   - D405 640x480 rgb8/z16 @90 verified native (rs-enumerate + dual-cam probe, 0 drops).
#   - DECXIN fisheye 640x480 MJPG @90 verified via v4l2-ctl (MJPG lists 120/90/60/30).
# Known cost at 90 fps (measured on the D405s): AE exposure 32 -> 10 ms, brightness
# -24%/-41%, temporal noise up ~20-30%. Run the paired 30-vs-90 policy A/B before
# trusting a rollout on this config.
#
# Device paths REWRITTEN from the stale quad_realsense_fisheye.yaml (old pci-0000:09:00.3
# topology): the rig now lives on pci-0000:13:00.0. Verified 2026-08-16 via
# /dev/v4l/by-path + rs-enumerate physical ports:
#   hub 1: left_realsense 412622272078 (usb 1.2) + left_fisheye  (usb 1.1.1 = video18)
#   hub 2: right_realsense 260322278348 (usb 2.2) + right_fisheye (usb 2.1.1 = video20)
# Pairing rule (gripper + RealSense + fisheye share one USB-C cable per arm) inherited
# from quad_realsense_fisheye.yaml. Left/right lens-cover re-verification still advised
# before a live rollout (same caveat as the base config).
server:
  name: camera_server
  mode: capture_only
  clock: monotonic_raw
  simulate_cameras: false

shared_memory:
  # Distinct name: /camera_server_frames is a root-owned leftover from a 08-14 Docker
  # run and cannot be unlinked from this user. Consumers follow the shm_name embedded
  # in bundle metadata, so the name is free to differ.
  name: "/camera_server_frames_30exp"
  size_mb: 1024
  # 90 Hz wraps a 4-slot ring in 44 ms; 8 slots keeps ~89 ms of history for consumers.
  ring_slots: 4
  unlink_on_start: true

metadata:
  transport: zmq_pub
  pub_bind: "tcp://127.0.0.1:5600"
  health_topic: "camera.health"
  bundle_topic: "camera.bundle"

sync:
  mode: software
  master_camera: left_realsense
  bundle_policy: nearest_timestamp
  # Measured 2026-08-16: fisheye-vs-realsense host stamps carry a CONSTANT ~10.5 ms
  # offset (MJPG decode + UVC path), so an 11 ms window sat exactly at the limit
  # (skew p50 9.9 / max 11.0 with complete bundles). 15 ms gives margin over that
  # constant offset while still rejecting a genuinely stale (>1 frame) pairing.
  max_bundle_time_diff_ms: 25.0
  publish_incomplete_bundles: false

# Same consumer-group layout as dual_realsense_d405.yaml — REQUIRED by the live
# consumers: flow-infer subscribes camera.bundle.policy (stale_timeout 1.0 s -> a
# missing group aborts the rollout with camera_stale_timeout) and the rb_gui
# camera-quality monitor subscribes camera.bundle.wrist_left/right (missing ->
# blur N/A). The policy group stays wrist RGB-D only (realsense pair, tight
# window: measured RS<->RS skew 0.03 ms at 90 fps); fisheyes ride the legacy
# full-rig bundle with the wider window for their constant ~10.5 ms stamp offset.
bundle_groups:
  legacy:
    topic: "camera.bundle"
    master_stream: "left_realsense.color"
    required_streams:
      - "left_realsense.color"
      - "left_realsense.depth"
      - "right_realsense.color"
      - "right_realsense.depth"
      - "left_fisheye.color"
      - "right_fisheye.color"
    max_bundle_time_diff_ms: 25.0
    publish_incomplete_bundles: false
  policy:
    topic: "camera.bundle.policy"
    master_stream: "left_realsense.color"
    required_streams:
      - "left_realsense.color"
      - "left_realsense.depth"
      - "right_realsense.color"
      - "right_realsense.depth"
    max_bundle_time_diff_ms: 17.0
    publish_incomplete_bundles: false
  wrist_left:
    topic: "camera.bundle.wrist_left"
    master_stream: "left_realsense.color"
    required_streams:
      - "left_realsense.color"
      - "left_realsense.depth"
    max_bundle_time_diff_ms: 17.0
    publish_incomplete_bundles: false
  wrist_right:
    topic: "camera.bundle.wrist_right"
    master_stream: "right_realsense.color"
    required_streams:
      - "right_realsense.color"
      - "right_realsense.depth"
    max_bundle_time_diff_ms: 17.0
    publish_incomplete_bundles: false

cameras:
  left_realsense:
    backend: realsense
    serial: "412622272078"
    required: true
    streams:
      color:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: rgb8
      depth:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: z16
  right_realsense:
    backend: realsense
    serial: "260322278348"
    required: true
    streams:
      color:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: rgb8
      depth:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: z16
  left_fisheye:
    backend: uvc
    # Same hub as left_realsense 412622272078 (pci-0000:13:00.0 usb hub 1).
    device: "/dev/v4l/by-path/pci-0000:13:00.0-usb-0:1.1.1:1.0-video-index0"
    required: true
    streams:
      color:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: rgb8
  right_fisheye:
    backend: uvc
    # Same hub as right_realsense 260322278348 (pci-0000:13:00.0 usb hub 2).
    device: "/dev/v4l/by-path/pci-0000:13:00.0-usb-0:2.1.1:1.0-video-index0"
    required: true
    streams:
      color:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: rgb8

recording:
  enabled: false
  output_dir: "/data/episodes"
  queue_capacity_frames: 300
  writer_threads: 4
  drop_policy: drop_oldest
  raw_format: true

health:
  publish_rate_hz: 1
  warn_if_frame_age_ms_gt: 100
  warn_if_drop_count_increases: true
  warn_if_bundle_skew_ms_gt: 25

reconnect:
  enabled: true
  max_attempts: 0
  retry_interval_ms: 1000
  frame_timeout_ms: 2000
