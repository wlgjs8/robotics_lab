# Dual D405 wrist-camera profile for flow-infer rollout on the local PC.
# Camera names pair with the policy checkpoint camera_names
# (left_realsense_color / right_realsense_color): bundle keys are
# '<camera>.<stream>' (left_realsense.color), and policy_runner's
# resolve_frame() maps dataset name 'X_color' -> bundle key 'X.color'.
#
# Serials are the librealsense-reported serials of the D405 units physically
# attached to this PC (USB3, bus 4): 412622272078, 260322278348.
# (Note: these differ from the USB iSerial values 243323070989/313123070562.)
# Left/right assignment verified physically 2026-06-12 (right lens covered):
#   left arm  = 260322278348, right arm = 412622272078.
server:
  name: camera_server
  mode: capture_only
  clock: monotonic_raw
  simulate_cameras: false

shared_memory:
  name: "/camera_server_frames"
  size_mb: 1024
  ring_slots: 4
  unlink_on_start: true

metadata:
  transport: zmq_pub
  pub_bind: "tcp://127.0.0.1:5600"
  health_topic: "camera.health"
  bundle_topic: "camera.bundle"

sync:
  mode: software
  master_camera: left_realsense
  bundle_policy: nearest_timestamp
  # Two free-running 30 fps cameras can sit up to half a frame period
  # (16.7 ms) apart; 10 ms left most bundles incomplete (measured skew
  # ~11.3 ms on this host).
  max_bundle_time_diff_ms: 17.0
  publish_incomplete_bundles: false

cameras:
  left_realsense:
    serial: "260322278348"
    required: true
    streams:
      color:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: rgb8
      depth:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: z16
  right_realsense:
    serial: "412622272078"
    required: true
    streams:
      color:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: rgb8
      depth:
        enabled: true
        width: 640
        height: 480
        fps: 30
        format: z16

recording:
  enabled: false
  output_dir: "/data/episodes"
  queue_capacity_frames: 300
  writer_threads: 4
  drop_policy: drop_oldest
  raw_format: true

health:
  publish_rate_hz: 1
  warn_if_frame_age_ms_gt: 100
  warn_if_drop_count_increases: true
  warn_if_bundle_skew_ms_gt: 17

reconnect:
  enabled: false  # not implemented; enabled=true is rejected at config load
  max_attempts: 0
  retry_interval_ms: 1000
