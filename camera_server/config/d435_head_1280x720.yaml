# D435 head(RGB 1280x720) + 손목 D405 2개(color+depth). USB3.
#
# head는 rb_gui `카메라 품질` 탭의 head view(색상)만 담당한다. head IR 스테레오 페어는
# Fast-FoundationStereo disparity 입력 전용이었고 2026-08-16 그 파이프라인과 함께
# 제거됐다(docs/archive/head_stereo/README.md). 모델 추론 입력은 손목 전용이다.
server:
  name: camera_server
  mode: capture_only
  clock: monotonic_raw
  simulate_cameras: false
shared_memory:
  name: "/camera_server_frames"
  size_mb: 1536
  ring_slots: 4
  unlink_on_start: true

metadata:
  transport: zmq_pub
  pub_bind: "tcp://127.0.0.1:5600"
  health_topic: "camera.health"
  bundle_topic: "camera.bundle"

sync:
  mode: software
  master_camera: head
  bundle_policy: nearest_timestamp
  max_bundle_time_diff_ms: 33.0
  publish_incomplete_bundles: false

# Publish independent consumer groups so a delayed head/stereo frame cannot
# suppress the wrist RGB-D cadence used by the real policy. Keep the legacy
# full-rig topic during migration for existing diagnostics and recorders.
bundle_groups:
  legacy:
    topic: "camera.bundle"
    master_stream: "head.color"
    required_streams:
      - "head.color"
      - "left_realsense.color"
      - "left_realsense.depth"
      - "right_realsense.color"
      - "right_realsense.depth"
    max_bundle_time_diff_ms: 33.0
    publish_incomplete_bundles: false
  policy:
    topic: "camera.bundle.policy"
    master_stream: "left_realsense.color"
    required_streams:
      - "left_realsense.color"
      - "left_realsense.depth"
      - "right_realsense.color"
      - "right_realsense.depth"
    max_bundle_time_diff_ms: 33.0
    publish_incomplete_bundles: false
  # Per-side wrist groups: one dead wrist camera must not suppress the healthy
  # side's RGB-D flow (stereo_worker wrist clouds / rb_gui). The joint `policy`
  # group above stays all-or-nothing on purpose — the real_policy runtime gate
  # requires both wrists and fail-closes on an incomplete pair.
  wrist_left:
    topic: "camera.bundle.wrist_left"
    master_stream: "left_realsense.color"
    required_streams:
      - "left_realsense.color"
      - "left_realsense.depth"
    max_bundle_time_diff_ms: 33.0
    publish_incomplete_bundles: false
  wrist_right:
    topic: "camera.bundle.wrist_right"
    master_stream: "right_realsense.color"
    required_streams:
      - "right_realsense.color"
      - "right_realsense.depth"
    max_bundle_time_diff_ms: 33.0
    publish_incomplete_bundles: false
  stereo:
    topic: "camera.bundle.stereo"
    master_stream: "head.color"
    required_streams:
      - "head.color"
    max_bundle_time_diff_ms: 33.0
    publish_incomplete_bundles: false

cameras:
  head:
    serial: "313522072863"
    required: true
    streams:
      color: { enabled: true,  width: 1280, height: 720, fps: 30, format: rgb8 }
      depth: { enabled: false, width: 640,  height: 480, fps: 30, format: z16 }
    controls:
      # 색상만 쓰므로 emitter/IR 노출은 드라이버 기본값에 맡긴다(-1 = 미설정).
      auto_exposure: 1
  left_realsense:
    # 2026-07-23: wrist cameras physically swapped between arms; serial follows the unit.
    serial: "412622272078"
    required: true
    streams:
      color: { enabled: true, width: 640, height: 480, fps: 30, format: rgb8 }
      depth: { enabled: true, width: 640, height: 480, fps: 30, format: z16 }
  right_realsense:
    serial: "260322278348"
    required: true
    streams:
      color: { enabled: true, width: 640, height: 480, fps: 30, format: rgb8 }
      depth: { enabled: true, width: 640, height: 480, fps: 30, format: z16 }

recording:
  enabled: false
  output_dir: "/data/episodes"
  queue_capacity_frames: 300
  writer_threads: 4
  drop_policy: drop_oldest
  raw_format: true

health:
  publish_rate_hz: 1
  fps_window_sec: 5
  warn_if_fps_below: 29
  warn_if_frame_age_ms_gt: 100
  warn_if_drop_count_increases: true
  warn_if_bundle_skew_ms_gt: 10

reconnect:
  # Native librealsense multi-pipeline restart is disabled in this active
  # high-bandwidth profile until simultaneous stall recovery no longer causes
  # a process-level allocator abort. The reconnect implementation remains
  # available for mock/controller acceptance and isolated-camera testing.
  enabled: false
  max_attempts: 0
  retry_interval_ms: 1000
  frame_timeout_ms: 5000
