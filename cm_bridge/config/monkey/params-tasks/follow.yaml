# follow.yaml — cm_bridge 네이티브 플랫폼 디렉터리의 FollowUnit 튜닝.
#
# 출처: submodules/controller-manager/platforms/monkey/params-tasks/follow_100mm.yaml
#       (핀 c42f0ec) 를 그대로 인용. 업스트림이 스스로 유도한 100 mm/s 프리셋이다.
#
# 이 파일이 읽히는 이유 — 업스트림 헤더의 "THIS FILE IS NOT LOADED / install 트리가
# 소스 트리를 이긴다"는 경고는 2026-08-15 이전 동작이고, 여기에는 적용되지 않는다:
# TaskConfig.cpp:44-50 이 <active.yaml 이 있는 디렉터리>/params-tasks 를 1순위로 열고
# (Arm.cpp:438 이 boot_config_path_ 의 부모를 넘긴다), 우리는 CONTROL_MANAGER_ACTIVE_YAML
# 로 이 디렉터리의 active.yaml 을 지정한다. 즉 서브모듈을 수정하지 않고, 도커 bind-mount
# 도 없이(= 그 인노드 함정도 없이) 이 파일이 그대로 라이브가 된다.
#
# 업스트림 프리셋에서 바꾼 것 — 딱 하나:
#   input_period_ms  20.0 -> 33.4
#     튜닝이 아니라 소스 케이던스다. 프리셋의 20.0 은 SpaceMouse(62.5 Hz)에 맞춘 값이고,
#     우리 소스는 flow-infer 정책 청크의 policy_dt(30 Hz, 1/29.94 = 33.4 ms)다.
#     silence 창 = 2 x 33.4 = 66.8 ms (채택 청크가 소진된 뒤부터 카운트).
#
# 확인 방법: 기동 후 [TASKCFG] 배너에 vmax=100mm/s wmax=20dps a=707.1 commit=1 이 찍혀야 한다.
# 안 찍히면 읽히는 파일이 이 파일이 아니다.
#
# 2026-08-19 속도 envelope 이력: 100 (프리셋 인용) -> 50 (오퍼레이터, 속도 상한) -> 100 (오퍼레이터,
# 그리퍼 조기 닫힘의 원인이 속도가 아니라 close-snap 매핑으로 확인된 뒤 원복). 업스트림 100 mm/s 행
# 그대로: v 100 / a 707.1 (= sqrt(v*j)) / rot 20 (시간척도 비율 20/100). force law(10 N, zeta 1.0)는 v 에
# 의존하지 않으므로 그대로. K_gate = 1.5*v/d_max = 6.0/s. 브릿지는 이 값을 읽어 서브델타 캡을 정한다
# (3.34 mm / 0.67 deg): 정책 스텝은 잘리지 않고 필요한 만큼 주기를 더 쓴다.
#
# 관측 대상 (2026-08-18, "현재 follow 그대로 → 실측 → 튜닝" 순서의 실측 항목):
#   * max_rot_dps 20.0 — 프리셋의 trans<->rot 시간척도 규칙(20/100 == 10/50)이 정한 값.
#     우리 과제의 yaw 기동은 ~64 deg/s 로 측정돼 있어 상시 컷될 수 있다. FollowUnit 의
#     OVERSIZED 경고는 에피소드당 1회뿐이므로(Tasks.cpp cap_warned_) 브릿지 쪽 계수로
#     본다.
#   * force gate — gate_force_n / gate_torque_nm 는 이 파일에도 없어서 컴파일 기본값
#     (25 N / 3.5 Nm, TaskConfig.h:411-418)이 armed 상태다. 접촉 시 스트림이 감쇠한다.
#
# 이하 업스트림 원문(헤더의 "NOT LOADED" 블록만 제거).
# =============================================================================================
#
# WHAT DIFFERS FROM THE 50 mm/s SET, AND WHAT DOES NOT:
#
#   CHANGED - the speed envelope only:
#     max_vel_mms   50 -> 100
#     cart_acc_mms2 500 -> 707.1   because a = sqrt(v*j) EXACTLY (the braking-distance optimum
#                                  this file's own note derives); sqrt(100*5000) = 707.106...
#     max_rot_dps   10 -> 20       the trans<->rot TIME-SCALE conversion, held constant: the
#                                  rotation channel's alpha/jerk are DERIVED as
#                                  cart_*(max_rot_dps/max_vel_mms), so 141.4 deg/s^2 and
#                                  1000 deg/s^3 - and sqrt(20*1000) = 141.4 = alpha, still EXACT.
#
#   UNCHANGED - the force law. k, b, k_r, b_r do NOT depend on v_max: they come from
#     (F_max, d_max, m, zeta, k_env) alone. The same row of the same table is valid at either speed.
#
#   WHAT THE SPEED CHANGE COSTS YOU, and both are real:
#     1. THE IMPACT PEAK DOUBLES. It is v_max*sqrt(k_env*m), so at m=15 against hard plastic it
#        goes 43.3 N -> 86.6 N. The gate CANNOT catch it (the impact resolves in 30-50 ms, the
#        gate needs ~70 ms). Approach slowly on first contact; the convergence is still 25 N.
#     2. THE GATE LOOP GAIN DOUBLES. K = 1.5*v_max/d_max = 6.0/s here against 3.0/s at 50 mm/s,
#        i.e. K*T_d = 0.42 against the ~0.07 s loop lag (was 0.21). Still stable, less margin.
#        IF YOU WANT THE 50 mm/s MARGIN BACK, use d_max = 50 mm instead of 25: regenerate with
#        `--d-max 50`, which halves every k (and doubles tau_ret). The table for that is in
#        docs/follow-force-parameters.md.
# =============================================================================================

#
# Edit + `reset` = live retune (TaskConfig reload). Missing file/key -> compiled-in defaults
# (TaskConfig.h), never fatal. The TASKCFG summary line confirms what is live.
#
# ONE PIPE (owner 2026-08-02): teleop and the policy's Delta Action Chunking share this channel.
# MESSAGE = CHUNK (geometry_msgs/PoseArray; teleop sends chunks of 1). DELTAS ARE FLANGE-FRAME
# (owner: tool axes eliminated - same arm always compatible; the unit conjugates by the mounted
# tool's rotation, identity for every shipped tool). One delta is consumed per
# input period T and executed at CONSTANT RATE ||delta||/T - the delta magnitude IS that period's
# velocity limit ("다음 커맨드가 들어오기 전에 로봇이 도착하면 안되잖아"). A new chunk REPLACES
# the unconsumed tail at the next period boundary (receding horizon).

# T - the input cadence, SHARED by teleop and chunk playback (the internal chunk-consumption
# period; owner: "가능하면 teleop과 같은"). The silence rule counts in units of T.
#
# 20 ms = 50 Hz, MATCHED TO THE MEASURED SOURCE (2026-08-02). The SpaceMouse emits a new
# sample every 16.00 ms (62.5 Hz) - measured two independent ways that agree exactly: our own
# raw hidraw read (med 15.99 ms) and the stock spacenavd -> libspnav -> spacenav_node path
# (med 16.00 ms). USB is not the limit (endpoint bInterval = 1, i.e. the host polls at 1 kHz);
# it is the puck's own firmware period. Anything faster than the source is pure repetition:
# the previous T = 4 ms published each sample four times. The device node now publishes 50 Hz
# and the bridge runs --period-ms 20 to match. Silence window = 2 * 20 = 40 ms.
input_period_ms:   33.4

# Quiet INPUT PERIODS (units of T) with the adopted chunk exhausted before the unit publishes
# rest, reports Done and FALLS BACK TO IDLE (owner: past 2 periods with no data, leave the mode;
# a resuming stream re-enters on its first message).
silence_periods: 2

# Playback margin epsilon (fraction of T): a per-period stream (teleop) starts playing epsilon*T
# late, so send jitter up to epsilon*T never starves the pacer mid-period. Chunk tails self-buffer
# and are unaffected. Size from MEASURED send jitter; data collection trains under the same plant.
playback_margin: 0.2

# Longest chunk accepted whole (deltas per message). An over-length message is refused WHOLE -
# never truncated (a cut chunk is a different plan than the one sent). Hard ceiling
# FollowChunk::kMaxChunk (64).
max_chunk: 50

# ---- COMMIT STEPS (robotics_lab 2026-08-19; upstream patch cm_bridge/upstream/0002-*.patch) ------
# The unit adopts a fresh chunk ONLY at a commit boundary: none held / exhausted / a multiple of
# commit_steps deltas played since adoption. 1 = the original REPLACE-at-every-boundary rule.
# 4 = the policy runner's execute window (FLOW_INFER_CHUNK_EXECUTE_STEPS=4): every chunk is played
# exactly 4 steps to the letter before the NEWEST chunk takes over, so a re-plan can never cut a
# committed step short, and the step count between chunks is deterministic - the bridge slices the
# next chunk from the step the unit reports on act/follow_step, so consecutive chunks continue from
# EXACTLY where the arm is (no more one-step gaps/overlaps from the runner and controller clocks
# disagreeing on how many steps were consumed). Per-delta aux (the policy's per-step gripper
# target) rides the chunk (cmd/follow_aux) and is echoed at the step boundary it belongs to.
# Reaction latency to a re-plan is bounded by commit_steps * T = 134 ms - unchanged from the
# runner-side window it mirrors. Keep this EQUAL to the runner's execute steps.
# 2026-08-19 (later the same day): 4 -> 1. The bridge now TIME-STRETCHES over-envelope steps by
# subdividing them into sub-deltas (no step is ever cut) and hands over only at policy-step ends
# that complete its own N-policy-step commit; a controller commit counted in SUB-deltas would fight
# that, so the unit adopts whenever the bridge publishes (= at those hand-over points only). The
# feature stays in the controller for publishers that do not subdivide.
commit_steps: 1

# THE CARTESIAN ENVELOPE, at the REDUCED speeds the owner set for the first 6-DOF test
# (2026-08-03): 50 mm/s and 10 deg/s. Both channels are Ruckig in CARTESIAN - translation in mm,
# rotation in DEGREES - so these numbers are SPHERE limits: 50 mm/s is 50 mm/s in every direction,
# diagonals included (the per-axis box is derived by dividing a and j by sqrt(3), in CartChannel).
#
# max_vel_mms / max_rot_dps also cap one input period's delta (||delta|| <= max_vel*T), the safety
# backstop a compliant source never touches. That cap is no longer LOAD-BEARING the way it was
# under the s-tracker (where it was the only thing keeping the arrival velocity a legal Ruckig
# input); the target-distance law has no arrival velocity at all. It stays as a backstop.
#
# *** DO NOT RAISE cart_acc_mms2 WITHOUT RE-DERIVING THE SPEED BOUND. ***
# The braking distance v^2/2a + v*a/2j is MINIMISED at a = sqrt(v*j); above that it grows again,
# the target sits further ahead, and the reference settles FASTER than commanded. At this envelope
#     translation  sqrt(50 * 5000) = 500 = cart_acc_mms2   EXACTLY
#     rotation     sqrt(10 * 1000) = 100 = derived alpha   EXACTLY
# so there is ZERO margin. These accelerations are the largest values that still hold the speed
# bound, not an arbitrary choice.
max_vel_mms:    100.0   # [mm/s]  100 mm/s preset (2026-08-19 operator: back up from 50 after the gripper analysis)
cart_acc_mms2:  707.1   # = sqrt(100*5000) EXACTLY - the sqrt(v*j) optimum
cart_jerk_mms3: 5000.0    # [mm/s^3]
# [deg/s] rotation sphere limit, AND the trans<->rot time-scale conversion: the rotation channel's
# acceleration and jerk are DERIVED as cart_acc/cart_jerk * (max_rot_dps/max_vel_mms), i.e.
# 100 deg/s^2 and 1000 deg/s^3 here, so both halves share their run-up and braking times exactly.
max_rot_dps:    20.0   # trans<->rot time scale held: 20/100 (the upstream 100 mm/s row)
# (robot-config/arms/<side>-arm.yaml, 180 deg/s), read directly in FollowUnit::start.
# It is NOT JOINT_STEP_LIMIT_DPS (250) - that is the last-line RT error guard, set
# deliberately ABOVE the arm's limit. Restating either one here is how they got
# confused in the first place (owner, 2026-08-03).

# THE FOLLOW PATH'S OWN JOINT ENVELOPE IS GONE (owner 2026-08-03: *"관절 속도를 깎는 행위는 다시
# 되돌려줘"*). joint_max_dps / joint_max_dps2 / joint_max_dps3 are DELETED KEYS - leaving them here
# would silently do nothing. 20 deg/s turned out to be tighter than the CARTESIAN envelope at
# ordinary poses (pure 10 deg/s rotation at the home pose needs ~24 deg/s of joint motion, so the
# tool was held to 9.279 in normal work), and a single uniform scalar cannot enforce a jerk bound
# anyway. Joint rates near a singularity are the DLS's job.

# ---- THE SINGULARITY GUARD: one threshold, one action - `task stop` --------------------------
# HARDWARE 2026-08-03: near a singularity the tool lurched - the DLS axis kill redistributed the
# refused direction's demand onto the remaining five, and a first "slow down, then stop" design
# made it WORSE (the ramp left the arm crawling and the brake handover reversed all six joints).
# The shipped rule is the owner's sentence: *"task stop으로 종료하면 될 일이잖아."* The guard fires
# at sigma_fade (DERIVED in DlsClik: 2*sigma_cut = 4*lambda_max = 0.036755 - exactly where axis
# attenuation would begin, and only 1.24x under the test home pose's 0.0457, so there is little
# room between "working" and "attenuating" at this envelope) and does exactly what an operator
# `task stop` does, at full speed: unified joint brake -> Enabled, stream off. SYSTEM origin -
# `task resume` cannot cancel it and a still-running teleop cannot re-enter (Enabled has no task
# machine; chunks deposit and expire unseen). Re-entry is deliberate: task on -> task idle.
sing_guard:       true
# VESTIGIAL, parsed but read by nothing since the single-threshold design (kept so an existing
# deployment file does not warn):
sing_slow_sigma:  0.0735
sing_stop_sigma:  0.008
sing_stop_scale:  0.10

# ---- NO FORCE-CEILING LEASH: TRIED 2026-08-04, REVERTED THE SAME DAY ON HARDWARE ------------
# `leash_fmax_n` / `leash_mmax_nm` are DELETED KEYS - writing them here does nothing.
# The idea was to project `ref_` (the channel output the IK tracks) onto a ball of radius
# L = F_max/k about the EMITTED pose, which pins the overlay spring's stretch and therefore the
# contact force. Against a modelled wall it worked perfectly: 10.00 N, flat, for 12 s.
# ON THE ROBOT IT FAILED, AND THE WALL RIG STRUCTURALLY COULD NOT HAVE SHOWN IT:
#   holding F = k*L requires the leash CENTRE to follow the contact, and that centre carries the
#   overlay's own deviation - so an external push moves the centre, the leash drags `ref_` after
#   it, and THE FOLLOWED POSE WALKS. With the operator's stream idle nothing opposes the drag: a
#   bare hand on the tool walks the arm, and the force decays instead of holding. The ceiling
#   mechanism and the origin walk are the same equation, so this cannot be tuned out.
#   (owner: *"힘의 유지가 되질 않고 있어... 외부 힘을 가할 때, 원점이 옮겨지는 치명적인 문제"*)
# Centring on the NOMINAL instead does not rescue it - that gap is only the CLIK residual, so the
# leash would never engage and would bound nothing.
# CONSEQUENCE, STATED PLAINLY: the contact force is UNBOUNDED again. A sustained push winds it up
# without limit. Any future bound must come from somewhere other than feeding the achieved pose
# back into the reference chain.



# WHICH FRAME THE TELEMETRY REPORTS THE STREAM'S INPUT IN: flange | tcp | base | root.
# The wire is FLANGE-frame and the unit conjugates every delta to the TCP, so those two are the
# unit's own internal view. `base` is this arm's base. `root` is the CELL base - the frame both
# arms and the `func write` recorder share, and therefore the only one in which the two arms'
# numbers can be compared against each other or against a recording.
telemetry_frame: root

# The CLIK correction time constant: kcorr = 1/(2*clik_tau_s) [1/s]. Spelled `leash_tau_s` until
# 2026-08-03, when the translation leash was removed and the name stopped being true.
clik_tau_s:    0.02

# ---- the WAIST lane's Pi_B leash (aux/JointChunkPacer ONLY) -----------------------------------
# THE TRANSLATION LEASH IS GONE (owner 2026-08-03: *"리쉬는 애초에 필요한게 아니었어"*). It existed
# to bound a carrot against a tracker that could stall; the target-distance law cannot stall, so
# there is nothing to bound - and the leash's own designed side effect, a sustained push WALKING
# the followed pose, went with it. `leash_min_mm` / `leash_max_mm` are DELETED keys: leaving them
# here would silently do nothing.
# What remains is the WAIST's own projection on the aux lane, which is a different mechanism on a
# different lane and still wants a geodesic radius.
leash_tau_s:   0.02
leash_min_deg: 1.0
leash_max_deg: 15.0

# The shared admittance force overlay (0025 force section; arm/motions/AdmittanceOverlay.h) on
# this unit's emitted command. Parameters = admittance.yaml (the ONE admittance surface).
# Force control's wrench->command correction bypasses Ruckig/pacing INSIDE the same 2 ms tick -
# the overlay is composed after the pacer, never behind it.
# ENABLED 2026-08-03 (owner). The overlay makes the arm YIELD to a measured wrench instead of
# pushing through it - but read the next paragraph before trusting a force number.
admittance_overlay: true

# ---- FORCE CONTROL: PER-AXIS mass / damper / stiffness (owner 2026-08-05) ---------------------
# *"follow 기능의 force control을 translation/rotation을 각 축마다의 mass, damper, stiffness를
# 입력할 수 있는 구조로 바꿔줘"*
#
# THIS BLOCK IS THE FOLLOW UNIT'S FORCE LAW - not an option layered over a scalar default. The
# isotropic (mass_kg / inertia_kgm2 / zeta / fn_hz) surface that used to live here is GONE FROM
# THIS PATH: those keys are now REFUSED WITH AN ERROR under `admittance:` below, because writing
# them asks for a compliance change and gets none. Edit + `reset` = live retune with no restart,
# and the TASKCFG banner prints every axis at boot and after every reset, so what is live is
# visible without opening this file.
#
# THE MODEL, PER AXIS:   m*d'' + b*d' + k*d = wrench     (d = deviation from the followed pose)
#   translation [x  y  z ]   m [kg]        b [N*s/m]       k [N/m]
#   rotation    [rx ry rz]   m [kg*m^2]    b [N*m*s/rad]   k [N*m/rad]
# Axes are the ARM BASE frame (the deviation has always integrated there; the follow wire's own
# flange frame is the unit's internal view and is deliberately not a second frame to tune in).
# A steady force deflects F/k and b decides how it gets there: b = 2*zeta*sqrt(k*m) is the
# critical-damping reference, zeta > 1 = overdamped, no overshoot (the owner's 2026-08-03 setting).
#
# AS SHIPPED the six rows reproduce the surface this path ran until 2026-08-05 (10 kg / 1 kg*m^2,
# zeta 2.0, fn 1.5 Hz) digit for digit - the STRUCTURE changed and the feel did not:
#     k_t = 888.3 N/m      ->  10 N deflects 11.26 mm
#     k_r =  88.8 N*m/rad  ->  1 N*m deflects 0.65 deg
# THESE ARE ALSO THE COMPILED DEFAULTS (TaskConfig.h). Keep the two in step when you retune: task
# config is never fatal, so a params/ directory that fails to resolve runs the compiled values
# silently, and a default that disagrees with what ships is a silent retune.
#
# OPTIONAL PER ROW, both defaulting to plain compliance:
#   mode: force  + ref_force: <N | N*m>   that axis WALKS until the measured wrench matches
#          ref_force (k unused). *** WITH THE DEVIATION FENCE REMOVED (next block) A FORCE AXIS IN
#          FREE SPACE NEVER STOPS WALKING *** - the fence used to be its designed stop. Arm a FORCE
#          axis only in a direction that actually meets contact.
#   mode: rigid                           that axis does not deviate at all (same as m: 0).
# ALL SIX ROWS OR NONE: a malformed block is reported and DISCARDED WHOLE, leaving the compiled
# defaults live - a half-declared law is a different law than the one you think you wrote.
# It acts only while `admittance_overlay: true` covers the unit; that flag is the switch.
# =============================================================================================
# robotics_lab 2026-08-18: THE LIVE ROW CONVERGES TO 10 N, NOT 25 N (operator decision), WITH
# CONTACT DAMPING RATIO zeta = 1.0 (operator constraint: zeta must not go below 1.0). m = 15 kg is
# KEPT. Derived with the upstream generator, ONE design constant changed (ZETA 0.25 -> 1.0), the
# rest shipped (d_max 25 mm, k_env 5e4, L 0.140 m) — a WHOLE row, per
# platforms/chimpanzee/docs/follow-force-parameters.md ("USE A WHOLE ROW"). Regenerate with the
# tool imported and ffp.ZETA = 1.0 (the CLI has no --zeta flag; zeta is a module constant):
#   .venv/bin/python -c "import importlib.util as u,math; s=u.spec_from_file_location('f',
#     'submodules/controller-manager/platforms/chimpanzee/tools/follow_force_params.py');
#     f=u.module_from_spec(s); s.loader.exec_module(f); f.ZETA=1.0; print(f.row(100,10,15,25))"
#
#  --- converge to 10 N -> k = 400 N/m,  rotation: M_thr 1.40 Nm, k_r 8.0 Nm/rad (m_r 1) ---
#  zeta(contact) |    b      b_r   | zeta(free) | ceiling  tau_ret  b/b_lim  b_r/lim | K_gate K*Td
#      1.0       |  1739.0  62.87 |   11.2     |  869083   4.35s   23.2%   12.6%  | 6.00/s 0.42  <- LIVE
#      1.2       |  2086.8  75.44 |   13.5     | 1042979   5.22s   27.8%   15.1%  | 6.00/s 0.42
#      1.5       |  2608.4  94.30 |   16.8     | 1303824   6.52s   34.8%   18.9%  | 6.00/s 0.42
#      2.0       |  3477.9 125.73 |   22.4     | 1738565   8.69s   46.4%   25.1%  | 6.00/s 0.42
#  (for the record, the upstream design point zeta 0.25 at this F/m: b 434.7, tau_ret 1.09 s)
#
# WHICH zeta THIS IS. The generator's zeta is the CONTACT ratio b/(2*sqrt(m*(k+k_env))) — the one
# the doc says to design against, because in contact the environment stiffness adds to the spring.
# The FREE-SPACE ratio b/(2*sqrt(m*k)) is far larger (11.2 here): with k this soft, ANY b that is
# critically damped in contact is heavily overdamped in free space, so the deviation returns to the
# followed pose as a slow first-order lag with tau_ret = b/k = 4.35 s (~13 s to fully settle after
# a contact is released). That is the direct cost of zeta >= 1.0 at F_max = 10 N and is why upstream
# chose 0.25 (0028 SS5). Not a defect — the operator's constraint, recorded with its consequence.
#
# READ BEFORE TRUSTING "10 N":
#  * THE IMPACT PEAK IS NOT 10 N. The formula v_max*sqrt(k_env*m) = 86.6 N at 100 mm/s does not
#    depend on F_max, k or b — only m and APPROACH SPEED; with m kept at 15 the only lever is speed.
#    And upstream MEASURED that a large b resists the offset's retreat at impact and RAISES the
#    real peak above the formula (65.4 N at zeta 1.0 vs 47.2 N at zeta 0.25, m 15, 50 mm/s — 0028
#    SS5). Expect this row's real first-contact peak to sit above 86.6 N at full speed. Approach
#    slowly on first contact.
#  * The 40 mm deviation fence (max_deviation_mm) now corresponds to 40 mm * 400 N/m = 16 N on the
#    sensor-independent backstop (was 40 N with k = 1000). Design equilibrium F_max/k = 25 mm < 40.
#    Raising d_max to 50 mm (k 200) would put the fence INSIDE the equilibrium — raise the fence
#    past 50 mm first if that is ever done.
#  * Discrete budget: b/b_lim 23.2 % of the semi-implicit-Euler no-oscillation limit m/dt = 7500
#    (2m/dt = 15000 diverges). Comfortable, and zeta 2.0 (46 %) still is.
# The upstream 25 N block that follows is kept verbatim as the derivation record.
# =============================================================================================
# THE FORCE LAW, SOLVED FOR A 25 N CONVERGED CONTACT FORCE (owner, 2026-08-06)
# =============================================================================================
# The three numbers are NOT independent. With k = 0 the converged contact force is b*v_max - a
# BY-PRODUCT OF HOW FAST THE OPERATOR HAPPENS TO BE STREAMING, not a designed amount (measured:
# 6.16 N at 50 mm/s, 4.01 at 25, 1.87 at 10, all with the same declared threshold). A spring is
# what makes the declared force the actual force:
#
#     k > 0  +  force_gate   ->  F converges to force_gate.max_force_n EXACTLY,
#                                and the deviation to max_force_n / k.
#
# *** NEITHER HALF MAY SHIP ALONE. *** k > 0 with no gate ramps the force at k_series*v_n forever
# (MEASURED 961 N in 40 s); the loader refuses that combination at INIT. The gate with k = 0
# bounds the force but not the deviation (measured 9.5 m of offset in 300 s).
#
# DESIGN EQUATIONS - re-derive from these, do not hand-tune one number:
#     k = max_force_n / d_max                       25 N / 25 mm  = 1000 N/m
#     b = 2*zeta*sqrt(m*(k + k_env))                zeta = 0.25, k_env = 5e4 (hard plastic)
#     m  is the OWNER'S CONSTRAINT: 10..15 kg. Lower m gives a lower impact peak and a higher
#        continuous damping ratio, but LOWERS the discrete stability ceiling (below) and lets the
#        robot's instantaneous force outrun the spring. Do not go under 10.
#
# WHY zeta = 0.25 AND NOT 1.0. Critical damping is WORSE here, measured: the gate already
# stabilises the loop (residual ringing is <= 0.65 N at EVERY b, because once F reaches the
# threshold the trajectory stops and nothing drives an oscillation), while a large b physically
# RESISTS the offset's retreat at the moment of impact and raises the peak - 65.4 N at zeta = 1.0
# against 47.2 N at zeta = 0.25 (m = 15, k_env = 5e4). zeta = 0.25 is better on impact, on return
# time and on the discrete budget, and gives up nothing that matters.
#
# ---- THE TABLE. Pick a row, copy BOTH numbers. Every row converges to 25 N. ------------------
#   m [kg]   b [N.s/m]   impact peak @5e4   discrete-stability ceiling   offset return tau
#   ------   ---------   ----------------   --------------------------   -----------------
#     10        357            39.4 N              178,000 N/m                0.36 s
#     11        375            41.1 N              186,000 N/m                0.37 s
#     12        391            42.8 N              195,000 N/m                0.39 s
#     13        407            44.3 N              203,000 N/m                0.41 s
#     14        423            45.8 N              210,000 N/m                0.42 s
#     15        437            47.2 N              218,000 N/m                0.44 s   <- LIVE
#
# TWO THINGS THE TABLE IS TELLING YOU, both measured and neither obvious:
#  1. THE IMPACT PEAK IS NOT 25 N. First contact at the full 50 mm/s spikes to ~47 N against hard
#     plastic (~66 N against aluminium) because the impact resolves in 30-50 ms while the gate
#     needs ~70 ms to arrive (20 ms period boundary + the Ruckig rate ramp). The gate regulates the
#     SUSTAINED force; it cannot catch the transient. The only lever is approach speed:
#     50 mm/s -> 47.2 N,  30 mm/s -> 28.2 N,  20 mm/s -> 24.4 N.  (For reference the PREVIOUS
#     shipped law peaked at 45.5 N here and converged to 9.7 N, so the peak is unchanged and only
#     the convergence became a designed number.)
#  2. THE DISCRETE-STABILITY CEILING IS REAL AND THE OLD VALUES WERE UNDER IT. `step_axes` is
#     semi-implicit Euler, so b < m/dt = 500*m is the no-per-tick-oscillation limit (b < 2m/dt
#     diverges outright) - every row above uses only 6-7 % of that budget. The binding limit is the
#     other one: the CLOSED loop with one tick of measurement delay. The PREVIOUS m=15,b=195 went
#     |eig| >= 1 at k_env = 97,000 N/m, i.e. it was DISCRETELY DIVERGENT against an aluminium jig.
#     Every row above clears 178,000+.
# =============================================================================================
force_control:
  translation:
    - {m: 15.0, b: 1739.0, k: 400.0}     # x
    - {m: 15.0, b: 1739.0, k: 400.0}     # y
    - {m: 15.0, b: 1739.0, k: 400.0}     # z
  rotation:
    - {m:  1.0, b:   62.9, k:   8.0}     # rx
    - {m:  1.0, b:   62.9, k:   8.0}     # ry
    - {m:  1.0, b:   62.9, k:   8.0}     # rz
# ROTATION IS DERIVED UNDER A STATED ASSUMPTION AND NEEDS HARDWARE TUNING. It cannot be solved
# from first principles without the contact geometry: the rotational environment stiffness is
# k_env * L^2 for a contact at lever L, and L is not known. These use L = 140 mm (the measured
# SRO->TCP distance), giving M_thr = 25 N * 0.14 = 3.5 N.m at e_max = 10 deg -> k_r = 20.1, and
# b_r = 2*0.25*sqrt(m_r*(k_r + 5e4*0.14^2)) = 15.8. Treat them as a starting point, not a result.

# THE FORCE GATE - the delta's reflection ratio falls as the contact force rises.
# `max_force_n` IS the force the sustained contact converges to (that is what k > 0 buys).
# A `knee` or a `g_min` here is REFUSED at load: a knee doubles the gate's loop gain, and any
# floor above zero leaves the trajectory creeping, which with k > 0 ramps the force forever
# (measured 367 N after 300 s at g_min = 0.05). See wiki/decisions/0028.
force_gate:
  max_force_n:    10.0     # [N]   converged contact force
  max_torque_nm:   1.4     # [Nm]  = max_force_n * 0.140 m, same assumption as k_r above
  close_tau_s:     0.10    # [s]   fast to close - protective
  open_tau_s:      0.40    # [s]   slow to open  - a fast re-open makes the gate a relay

# ---- THE DEVIATION REGION IS UNBOUNDED (owner 2026-08-05) -------------------------------------
# *"force control에 의해 벗어나는 영역의 제한은 없애"*. 0 = NO LIMIT on that part, and 0 is what
# ships: force control may walk this unit's command away from the followed pose as far as the
# wrench takes it. The 50 mm / 15 deg fence that used to clamp the deviation (and publish a
# SATURATED warning while pinned) is no longer applied on this path. The batch kinds - movl, movh,
# movf, movhf, movlf - keep theirs; this removal is scoped to the follow unit.
#
# WHAT STILL BOUNDS IT, so "no limit" is not read as "nothing left": the deviation RATE caps in
# `admittance:` below, the per-joint velocity clamp inside the overlay's IK recomposition, whether
# the deviated pose is solvable at all (unsolvable -> the nominal holds for that tick, counted and
# logged), and the last-line JointStepLimit guard. Set either key non-zero to fence this path again.
# THE DEVIATION FENCE IS A DEAD BACKSTOP, NOT AN OPERATING LIMIT (owner 2026-08-05 removed the
# operating limit: *"force control에 의해 벗어나는 영역의 제한은 없애"*, and that stands - this is
# not it). The design converges the deviation to max_force_n/k = 25 mm, so 40 mm is never reached
# in normal operation and the arm never feels it. It exists because the 25 mm bound is created by
# the GATE reaching zero, and the gate depends on the wrench being right - which this tree does
# NOT yet guarantee (the tool identification has not run; see 0012's FT trust status). A
# sensor-independent backstop is cheap and this is the one place it earns its keep.
# Adversarially verified 2026-08-06: |d| <= F/k holds ONLY at a true static equilibrium; while the
# trajectory is still advancing there is no equilibrium at all, so k alone bounds nothing.
max_deviation_mm:  40.0
max_deviation_deg: 15.0

# ---- DEVIATION-DYNAMICS RATE CAPS - all that is left in this block ---------------------------
# They bound how FAST the deviation may grow, which is what keeps the recomposed pose solvable and
# the emitted step under the RT guard. They are NOT the region limit above, and deleting them
# would not be "no limit" - it would be an unbounded per-tick jump.
# REFUSED HERE, loudly, rather than silently ignored: mass_kg / inertia_kgm2 / zeta / fn_hz (moved
# to force_control above), and max_jerk_t/_r, kcorr, smin, dls_lambda, tare_sec (they belong to the
# Admittance TASK's resolved-rate stage in admittance.yaml and were never read by the overlay).
admittance:
  max_vel_t:     0.50     # translation [m/s]
  max_acc_t:     5.0      #             [m/s^2]
  max_vel_r:     2.00     # rotation    [rad/s]
  max_acc_r:    20.0      #             [rad/s^2]

