# cm_bridge overlay for controller-manager's docker-compose.yaml.
# Why: the submodule compose's chimp-sils seeding block predates the 0032 §6b
# platform-device-file layout (it copies a retired robot-config/ tree), so a
# fresh SILS container cannot resolve active.yaml on its own. Rather than edit
# the READ-ONLY submodule, point the binary's #1 resolution rule
# ($CHIMP_ACTIVE_YAML, src/main.cpp:33-43) at the seeded platform device file
# on the bind mount. Seed it on the host first (SILS loopback shell):
#   cd submodules/controller-manager
#   sed -e '0,/ip: ""/s//ip: "127.0.0.1"/' -e '0,/ip: ""/s//ip: "127.0.0.2"/' \
#       platforms/chimpanzee/params-presets/dual-arm-body-nominal.yaml \
#       > platforms/chimpanzee/active.yaml
# Run:
#   docker compose -f submodules/controller-manager/docker-compose.yaml \
#                  -f cm_bridge/config/cm-compose.override.yaml up -d chimp-sils
services:
  chimp-sils:
    environment:
      CHIMP_ACTIVE_YAML: /cm-ws/src/controller-manager/platforms/chimpanzee/active.yaml

  # Our rig's platform: monkey = dual RB3-730ES cell, no body — matches the
  # robotics_lab dual RB3-730 rig. Same image/binary; the device file selects
  # the platform. Seed platforms/monkey/active.yaml first (loopback shell):
  #   sed -e '0,/ip: ""/s//ip: "127.0.0.1"/' -e '0,/ip: ""/s//ip: "127.0.0.2"/' \
  #       platforms/monkey/params-presets/dual-arm.yaml > platforms/monkey/active.yaml
  # Run:
  #   docker compose -f submodules/controller-manager/docker-compose.yaml \
  #                  -f cm_bridge/config/cm-compose.override.yaml up -d monkey-sils
  monkey-sils:
    image: chimpanzee-ros:humble
    container_name: monkey-sils
    network_mode: host
    ipc: host
    cap_add: [SYS_NICE]
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CONTROL_MANAGER_SILS: "1"
      CONTROL_MANAGER_ACTIVE_YAML: /cm-ws/src/controller-manager/platforms/monkey/active.yaml
    volumes:
      - chimp_ws:/cm-ws
      - ../../submodules/controller-manager:/cm-ws/src/controller-manager
      # Tuned follow profile shadows the TRACKED submodule file (read-only rule):
      # input_period 33.4ms / rot 90 dps / vel 150 mm/s / admittance off.
      - ../../cm_bridge/config/follow.monkey.yaml:/cm-ws/src/controller-manager/platforms/monkey/params-tasks/follow.yaml:ro
      # Bridge sources (run separately via `docker exec` or a bridge service).
      - ../../cm_bridge/src:/cm-bridge-src:ro
    working_dir: /cm-ws
    command: ["bash", "-lc", "exec ros2 run controller_manager plaif_chimpanzee"]
