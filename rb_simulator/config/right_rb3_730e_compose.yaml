# Docker Compose right-arm simulator profile.
#
# This profile is intentionally container-only. It exposes controller-like
# endpoints on the container network and requires
# RB_SIMULATOR_ALLOW_NON_LOOPBACK=1.

simulator:
  schema: robotics_lab.simulator.v1
  arm: right
  control_bind: "tcp://0.0.0.0:50200"
  admin_bind: "tcp://0.0.0.0:50201"
  update_rate_hz: 200
  motion_time_constant_sec: 0.04
  max_joint_velocity_deg_s: 360
  model: "RB3_730E"

arm:
  name: "right_simulator"
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  mount: [-0.1601, -0.1725, 0.5825, 0.785, -2.35619, 0.0]

fault_defaults:
  connected: true
  initialized: false
  servo_enabled: false
  has_valid_joint_state: true
  has_error: false
  error_code: 0
