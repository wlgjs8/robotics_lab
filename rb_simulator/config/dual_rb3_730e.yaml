# HISTORICAL ONLY - NOT RUNNABLE FOR THE CURRENT PER-ARM TOPOLOGY.
#
# This file is kept only as a deprecated fixture for the old single-process
# dual-arm simulator schema. The supported runtime uses one process per arm:
# - left_rb3_730e.yaml
# - right_rb3_730e.yaml
# Do not use this file for operator runs, smoke evidence, or compose startup.

simulator:
  deprecated: true
  control_bind: "tcp://127.0.0.1:50200"
  admin_bind: "tcp://127.0.0.1:50201"
  update_rate_hz: 200
  motion_time_constant_sec: 0.04
  max_joint_velocity_deg_s: 360
  model: "RB3_730E"

left_arm:
  name: "left_simulator"
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  mount: [0.1601, -0.1725, 0.5825, 0.785, 2.35619, 0.0]

right_arm:
  name: "right_simulator"
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  mount: [-0.1601, -0.1725, 0.5825, 0.785, -2.35619, 0.0]

fault_defaults:
  connected: true
  initialized: false
  servo_enabled: false
  has_valid_joint_state: true
  has_error: false
  error_code: 0
