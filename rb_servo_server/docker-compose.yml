services:
  rb_servo_server:
    build:
      context: .
      dockerfile: docker/rb_servo_server.Dockerfile
      target: build
    image: rb_servo_server:dev
    command: ["./build/rb_servo_server", "--config", "config/dual_mock_compose.yaml"]
    init: true
    networks: [rb_servo_net]
    depends_on:
      rb_servo_gui:
        condition: service_started
    ports:
      - "127.0.0.1:50010:50010/udp"
    volumes:
      - ./logs:/workspace/logs

  rb_servo_gui:
    build:
      context: ..
      dockerfile: rb_gui/docker/rb_servo_gui.Dockerfile
    image: robotics_lab/rb_gui:dev
    init: true
    networks: [rb_servo_net]
    environment:
      RB_GUI_HOST: "0.0.0.0"
      RB_GUI_PORT: "8080"
      RB_GUI_STATE_BIND: "0.0.0.0"
      RB_GUI_STATE_PORT: "50110"
      RB_GUI_COMMAND_HOST: "rb_servo_server"
      RB_GUI_COMMAND_PORT: "50010"
      RB_GUI_OBSERVED_MODE: "mock"
      RB_GUI_OPS_AVAILABLE: "0"
    ports:
      - "127.0.0.1:8080:8080/tcp"
      - "127.0.0.1:50110:50110/udp"

  rb_simulator:
    profiles: ["sim"]
    build:
      context: ..
      dockerfile: rb_simulator/docker/rb_simulator.Dockerfile
    image: rb_simulator:dev
    init: true
    networks: [rb_servo_net]
    labels:
      rb-servo.role: "hardware-free-rb-simulator"
      rb-servo.hardware: "none"
      rb-servo.ova: "not-used"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 50200), 1.0); s.close()",
        ]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 1s

  rb_servo_rbsim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: docker/rb_servo_server.Dockerfile
      target: build
    image: rb_servo_server:dev
    command: ["./build/rb_servo_server", "--config", "config/dual_rb_simulator_compose.yaml"]
    init: true
    network_mode: "service:rb_simulator"
    depends_on:
      rb_simulator:
        condition: service_healthy
    volumes:
      - ./logs:/workspace/logs
    labels:
      rb-servo.role: "hardware-free-rbsim-servo-server"
      rb-servo.hardware: "none"
      rb-servo.ova: "not-used"

networks:
  rb_servo_net:
    driver: bridge
