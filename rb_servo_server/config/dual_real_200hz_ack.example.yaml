schema: robotics_lab.rb_servo_server.v1

# RBPODO-SERVO-PARAM-01 / RBPODO-ACCEPT-01 example only. Not a site-specific runnable config.
# Copy to rb_servo_server/config/local/ only after read-only acceptance and
# supervised motion approval. Motion remains disabled here by default.
# 200 Hz ACK-on profile:
# - servo.rate_hz: 200
# - move_servo_j t1 / servo_t1_sec: 0.005 s
# - move_servo_j t2 / servo_t2_sec: 0.05 s
# - move_servo_j alpha / servo_alpha: 0.5
# - command_timeout_sec: 0.02 s
# - disable_waiting_ack: false
# New configs must not use deprecated aliases servo_acc or
# servo_lookahead_sec; use servo_alpha and servo_t2_sec.

left_robot:
  backend_type: rbpodo
  run_mode: real
  name: left_rb3_200hz_ack
  ip: "172.28.60.200"
  operation_mode: real
  command_timeout_sec: 0.02
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  speed_bar: 0.1
  servo_t1_sec: 0.005
  servo_t2_sec: 0.05
  servo_gain: 1.0
  servo_alpha: 0.5
  disable_waiting_ack: false

right_robot:
  backend_type: rbpodo
  run_mode: real
  name: right_rb3_200hz_ack
  ip: "172.28.60.201"
  operation_mode: real
  command_timeout_sec: 0.02
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  speed_bar: 0.1
  servo_t1_sec: 0.005
  servo_t2_sec: 0.05
  servo_gain: 1.0
  servo_alpha: 0.5
  disable_waiting_ack: false

left_mount:
  base_pose_in_stand: [0.1601, -0.1725, 0.5825, 2.186649, 0.523831, 2.526296]

right_mount:
  base_pose_in_stand: [-0.1601, -0.1725, 0.5825, 2.186649, -0.523831, -2.526296]

servo:
  rate_hz: 200
  command_timeout_sec: 0.2
  io_model: direct
  startup_mode: Hold
  send_servo_commands: false
  enable_realtime_priority: true
  realtime_priority: 80
  cpu_core: 2
  filter_dt_min_ratio: 0.5
  filter_dt_max_ratio: 1.5
  servo_t1_rate_match_tolerance_ratio: 0.2
  allow_servo_t1_rate_mismatch: false

safety:
  q_min_deg: [-170, -120, -170, -190, -120, -360]
  q_max_deg: [170, 120, 170, 190, 120, 360]
  dq_max_deg_s: [60, 60, 60, 90, 90, 120]
  ddq_max_deg_s2: [300, 300, 300, 500, 500, 700]
  command_timeout_sec: 0.2
  max_tracking_error_deg: 10.0
  tracking_error_policy: fault_latch
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true

network:
  command_bind: "udp://127.0.0.1:50010"
  state_pub_endpoint: "udp://127.0.0.1:50110"
  state_pub_rate_hz: 20
  command_source_allowlist: ["127.0.0.1/32"]

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

force_control:
  provider: null
  enable: false
