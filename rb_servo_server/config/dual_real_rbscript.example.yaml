# Experimental rbscript_tcp raw Rainbow script backend template.
# This file is a tracked example only, not a runnable real-motion config.
# It uses TCP command port 5000 and data port 5001; no UDP direct-to-controller
# path is used. Motion remains disabled by default.
# rbscript_tcp is for rbpodo-overhead comparison and read-only/no-motion
# acceptance first. It is not a replacement for rbpodo, does not enable
# rt_script, and must not rely on undocumented controller settings.
schema: robotics_lab.rb_servo_server.v1

left_robot:
  name: left_rbscript_tcp
  backend_type: rbscript_tcp
  run_mode: real
  ip: "172.28.60.200"
  command_port: 5000
  data_port: 5001
  command_timeout_sec: 0.2
  read_timeout_sec: 0.2
  connect_timeout_sec: 1.0
  disable_waiting_ack: false
  script_t1_sec: 0.008
  script_t2_sec: 0.05
  script_gain: 1.0
  script_alpha: 0.5
  initial_q_deg: [0, -30, 80, 0, 60, 0]

right_robot:
  name: right_rbscript_tcp
  backend_type: rbscript_tcp
  run_mode: real
  ip: "172.28.60.201"
  command_port: 5000
  data_port: 5001
  command_timeout_sec: 0.2
  read_timeout_sec: 0.2
  connect_timeout_sec: 1.0
  disable_waiting_ack: false
  script_t1_sec: 0.008
  script_t2_sec: 0.05
  script_gain: 1.0
  script_alpha: 0.5
  initial_q_deg: [0, -30, 80, 0, 60, 0]

servo:
  rate_hz: 200
  io_model: direct
  startup_mode: hold
  send_servo_commands: false
  enable_realtime_priority: true
  realtime_priority: 80

safety:
  q_min_deg: [-170, -120, -170, -190, -120, -360]
  q_max_deg: [170, 120, 170, 190, 120, 360]
  dq_max_deg_s: [30, 30, 30, 45, 45, 60]
  ddq_max_deg_s2: [150, 150, 150, 250, 250, 350]
  command_timeout_sec: 0.2
  max_tracking_error_deg: 5.0
  tracking_error_policy: fault_latch
  stop_both_arms_on_single_arm_error: true
  latch_fault_on_robot_state_error: true

network:
  command_bind: "udp://127.0.0.1:50010"
  state_pub_endpoint: "udp://127.0.0.1:50110"
  state_pub_rate_hz: 20
  command_source_allowlist: ["127.0.0.1/32"]

command_source:
  enforce_lease: true
  lease_timeout_sec: 1.0

cartesian_control:
  enable: false
  allow_in_simulation: false
  allow_in_real: false

force_control:
  provider: null
  enable: false
