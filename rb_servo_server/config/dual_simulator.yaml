schema: robotics_lab.rb_servo_server.v1

# Canonical hardware-free per-arm simulator backend profile for host runs.
# Pair with one left simulator process on 127.0.0.1:50200 and one right
# simulator process on 127.0.0.1:50210. This profile is not real robot evidence.

left_robot:
  backend_type: simulator
  run_mode: simulation
  name: left_simulator
  simulator_control_endpoint: "tcp://127.0.0.1:50200"
  simulator_request_timeout_sec: 0.2
  simulator_connect_timeout_sec: 0.2
  simulator_read_timeout_sec: 0.2
  simulator_send_timeout_sec: 0.2
  simulator_stop_timeout_sec: 0.2
  simulator_reset_timeout_sec: 0.2
  initial_q_deg: [0, -30, 80, 0, 60, 0]

right_robot:
  backend_type: simulator
  run_mode: simulation
  name: right_simulator
  simulator_control_endpoint: "tcp://127.0.0.1:50210"
  simulator_request_timeout_sec: 0.2
  simulator_connect_timeout_sec: 0.2
  simulator_read_timeout_sec: 0.2
  simulator_send_timeout_sec: 0.2
  simulator_stop_timeout_sec: 0.2
  simulator_reset_timeout_sec: 0.2
  initial_q_deg: [0, -30, 80, 0, 60, 0]

left_mount:
  # Rotation is canonical URDF/ROS RPY converted from MJCF euler xyz.
  base_pose_in_stand: [0.1601, -0.1725, 0.5825, 2.186649, 0.523831, 2.526296]

right_mount:
  # Rotation is canonical URDF/ROS RPY converted from MJCF euler xyz.
  base_pose_in_stand: [-0.1601, -0.1725, 0.5825, 2.186649, -0.523831, -2.526296]

servo:
  rate_hz: 100
  command_timeout_sec: 0.2
  io_model: direct
  startup_mode: Hold
  enable_realtime_priority: false
  realtime_priority: 80
  cpu_core: -1
  filter_dt_min_ratio: 0.5
  filter_dt_max_ratio: 1.5

safety:
  q_min_deg: [-170, -120, -170, -190, -120, -360]
  q_max_deg: [170, 120, 170, 190, 120, 360]
  dq_max_deg_s: [60, 60, 60, 90, 90, 120]
  ddq_max_deg_s2: [300, 300, 300, 500, 500, 700]
  command_timeout_sec: 0.2
  max_tracking_error_deg: 10.0
  tracking_error_policy: snap_to_actual
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true
  # Stand-frame floor plane: neither TCP may go below z_min_m, for any motion
  # primitive. Runtime-adjustable via the leaseless SetSafetyFloorZ command,
  # bounded to [runtime_min_z_m, runtime_max_z_m]. Requires kinematics.enable.
  floor_constraint:
    enable: true
    z_min_m: 0.010
    runtime_min_z_m: 0.0
    runtime_max_z_m: 0.5
    fail_policy: clamp_hold
    monitor_only: false

network:
  command_bind: "udp://127.0.0.1:50010"
  state_pub_endpoint: "udp://127.0.0.1:50110"
  state_pub_rate_hz: 20
  command_source_allowlist: ["127.0.0.1/32"]

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

force_control:
  provider: null
  enable: false

kinematics:
  enable: true
  provider: pinocchio
  urdf: "../descriptions/urdf/rb3_730e.urdf"
  base_link: "world"
  tip_link: "tcp"
  joint_names:
    - base_joint
    - shoulder_joint
    - elbow_joint
    - wrist1_joint
    - wrist2_joint
    - wrist3_joint
  q_units: deg
  publish_tcp: true
  ik:
    enable: true
    max_iterations: 50
    timeout_ms: 20.0
    damping: 0.001
    position_tolerance_m: 0.002
    orientation_tolerance_rad: 0.005
    max_step_deg: [2, 2, 2, 3, 3, 4]

cartesian_control:
  enable: true
  allow_in_simulation: true
  allow_in_real: false
  warn_ik_duration_us: 3000
  fail_ik_duration_us: 5000
  path_kp_pos: 6.0
  path_kp_ori: 6.0
  twist_orientation_hold_kp: 6.0
  twist_angular_deadband_rad_s: 0.0001
  velocity_damping: 0.01
  max_twist_linear_m_s: 0.03
  max_twist_angular_rad_s: 0.2
  max_linear_move_speed_m_s: 0.05
  max_angular_move_speed_rad_s: 0.3
  max_cartesian_step_m: 0.002
  max_cartesian_step_rad: 0.02
  exceed_limit_policy: clamp
  linear_move:
    min_duration_sec: 0.05
    max_duration_sec: 10.0
    default_linear_speed_m_s: 0.03
    default_angular_speed_rad_s: 0.2
    constant_orientation_tolerance_rad: 0.005
    default_orientation_mode: constant
