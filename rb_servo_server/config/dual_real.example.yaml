schema: robotics_lab.rb_servo_server.v1

# Template only. Do not run this file as a site-specific real robot config.
# Copy to one of these user-owned local paths before hardware use:
# - rb_servo_server/config/local/dual_real_readonly.yaml
# - rb_servo_server/config/local/dual_real_motion.yaml
# Read-only real connection requires RB_ALLOW_REAL_ROBOT=1.
# Real servo_j motion additionally requires RB_ALLOW_REAL_MOTION=1 and
# servo.send_servo_commands=true.
# ACK-off rbpodo motion additionally requires
# RB_ALLOW_RBPODO_ACK_DISABLED_MOTION=1 and supervised acceptance evidence.
# Real Cartesian/TCP motion additionally requires RB_ALLOW_REAL_CARTESIAN=1.
# Use canonical Servo J fields only in new configs:
# servo_t1_sec, servo_t2_sec, servo_gain, servo_alpha.
# Do not use deprecated aliases servo_time_sec, servo_lookahead_sec, or
# servo_acc in new real configs.

left_robot:
  backend_type: rbpodo
  run_mode: real
  name: left_rb3
  ip: "172.28.60.200"
  operation_mode: real
  command_timeout_sec: 0.02
  speed_bar: 0.1
  # Rainbow move_servo_j(jnt, t1, t2, gain, alpha). At 500 Hz, t1 matches
  # the 0.002 s server command period. t2 is hold time, not UR lookahead.
  servo_t1_sec: 0.002
  servo_t2_sec: 0.05
  servo_gain: 1.0
  servo_alpha: 0.5
  # Keep controller ACK waiting enabled by default. Set true only in a local
  # motion config after supervised acceptance of the rbpodo command path.
  disable_waiting_ack: false

right_robot:
  backend_type: rbpodo
  run_mode: real
  name: right_rb3
  ip: "172.28.60.201"
  operation_mode: real
  command_timeout_sec: 0.02
  speed_bar: 0.1
  # Rainbow move_servo_j(jnt, t1, t2, gain, alpha). At 500 Hz, t1 matches
  # the 0.002 s server command period. t2 is hold time, not UR lookahead.
  servo_t1_sec: 0.002
  servo_t2_sec: 0.05
  servo_gain: 1.0
  servo_alpha: 0.5
  # Keep controller ACK waiting enabled by default. Set true only in a local
  # motion config after supervised acceptance of the rbpodo command path.
  disable_waiting_ack: false

left_mount:
  # Rotation is canonical URDF/ROS RPY converted from MJCF euler xyz.
  base_pose_in_stand: [0.15707, -0.17036, 0.58036, 2.186649, 0.523831, 2.526296]

right_mount:
  # Rotation is canonical URDF/ROS RPY converted from MJCF euler xyz.
  base_pose_in_stand: [-0.15707, -0.17036, 0.58036, 2.186649, -0.523831, -2.526296]

servo:
  rate_hz: 500
  command_timeout_sec: 0.2
  io_model: direct
  startup_mode: Hold
  send_servo_commands: false
  enable_realtime_priority: true
  realtime_priority: 80
  cpu_core: 2
  filter_dt_min_ratio: 0.5
  filter_dt_max_ratio: 1.5
  servo_t1_rate_match_tolerance_ratio: 0.2
  allow_servo_t1_rate_mismatch: false

safety:
  q_min_deg: [-360, -360, -360, -360, -360, -360]
  q_max_deg: [360, 360, 360, 360, 360, 360]
  dq_max_deg_s: [60, 60, 60, 90, 90, 120]
  ddq_max_deg_s2: [300, 300, 300, 500, 500, 700]
  # Startup diagnostics may normalize wrap-capable controller reports for range
  # checks only. Raw q_actual remains published and motion wrapping stays off.
  joint_wrap_period_deg: [0, 0, 0, 360, 0, 360]
  joint_wrap_for_startup_validation: true
  joint_wrap_for_motion_safety: false
  command_timeout_sec: 0.2
  max_tracking_error_deg: 10.0
  tracking_error_policy: fault_latch
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true
  # Stand-frame floor plane (TCP z keep-out, all primitives, all run modes).
  # Enabling requires kinematics.enable=true (TCP FK source). Uncomment together
  # with a kinematics block; fault_latch is the conservative real-mode policy.
  # floor_constraint:
  #   enable: true
  #   z_min_m: 0.010
  #   runtime_min_z_m: -0.2
  #   runtime_max_z_m: 0.5
  #   fail_policy: fault_latch
  #   monitor_only: false

  # Stand-frame axis-aligned ROI box (workspace limit): the TCP of either arm
  # must stay inside [min_m, max_m] (stand frame). Independent of
  # floor_constraint (both apply when enabled). Same velocity-damper enforcement
  # (slides along a face) + Tier-2 Cartesian clamp. Bounds are runtime-adjustable
  # from viser ("Safety ROI box") within [runtime_min_m, runtime_max_m] per axis.
  # Requires kinematics.enable=true. clamp_hold slides at the faces (recommended);
  # fault_latch hard-latches when a candidate pushes outside (PTP/jog only).
  # roi_box:
  #   enable: true
  #   min_m: [-0.5, -1.0, 0.0]
  #   max_m: [0.5, 0.0, 1.0]
  #   runtime_min_m: [-1.0, -1.5, -0.2]
  #   runtime_max_m: [1.0, 0.5, 1.5]
  #   fail_policy: clamp_hold
  #   monitor_only: false
  #   a_brake_m_s2: 4.0
  #   d_slow_m: 0.05
  #   # Optional extra check points in the TCP frame (e.g. gripper fingertips);
  #   # every face binds on the most-exposed point.
  #   # tcp_offset_points:
  #   #   - { name: tip_a, offset_m: [0.054, 0.0, 0.0] }
  #   #   - { name: tip_b, offset_m: [-0.054, 0.0, 0.0] }

  # Reachable-workspace shell (reach limit): the TCP of either arm must stay in
  # the spherical shell r_min_m <= ||tcp - arm_base|| <= r_max_m (base = the
  # mount origin, *_mount.base_pose_in_stand). Bounds how far a Cartesian command
  # can drive the TCP from the shoulder so it never asks for a pose past the arm's
  # reach (where IK fails and the arm used to silently stop); the outer shell also
  # keeps it off the full-extension singularity. Same velocity-damper enforcement
  # as floor/roi (brakes to zero radial speed AT the shell, slides tangentially /
  # returns inward). Requires kinematics.enable=true. MEASURE r_min/r_max with
  # `python3 tools/reach_envelope.py` (FK Monte-Carlo of this URDF's tip frame);
  # the values below are the measured RB3-730E `tcp`-frame envelope minus a 0.03 m
  # margin. r_min_m <= 0 disables the inner shell. clamp_hold slides at the shell
  # (recommended); fault_latch hard-latches on a PTP/jog push outside.
  # reach_constraint:
  #   enable: true
  #   r_min_m: 0.13
  #   r_max_m: 1.05
  #   fail_policy: clamp_hold
  #   monitor_only: false
  #   a_brake_m_s2: 4.0
  #   d_slow_m: 0.05
  #   # tcp_offset_points:
  #   #   - { name: tip_a, offset_m: [0.054, 0.0, 0.0] }
  #   #   - { name: tip_b, offset_m: [-0.054, 0.0, 0.0] }

network:
  command_bind: "udp://127.0.0.1:50010"
  state_pub_endpoint: "udp://127.0.0.1:50110"
  state_pub_rate_hz: 20
  command_source_allowlist: ["127.0.0.1/32"]

# Gripper bridge to the out-of-process gripper_server (docs/plans/gripper_server_design.md).
# Forwards arbitrated per-arm gripper setpoints (left/right.gripper) and stamps
# gripper_state.v1 feedback into the published state JSON. Disabled by default.
# gripper:
#   enable: true
#   command_endpoint: "udp://127.0.0.1:50410"   # -> gripper_server command bind
#   feedback_bind: "udp://127.0.0.1:50420"       # <- gripper_server state publish
#   forward_rate_hz: 50

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

force_control:
  provider: null
  enable: false
