schema: robotics_lab.rb_servo_server.v1

# Template only. Do not run this file as a site-specific real robot config.
# Copy to one of these user-owned local paths before hardware use:
# - rb_servo_server/config/local/dual_real_readonly.yaml
# - rb_servo_server/config/local/dual_real_motion.yaml
# Read-only real connection requires RB_ALLOW_REAL_ROBOT=1.
# Real servo_j motion additionally requires RB_ALLOW_REAL_MOTION=1 and
# servo.send_servo_commands=true.
# Real Cartesian/TCP motion additionally requires RB_ALLOW_REAL_CARTESIAN=1.

left_robot:
  backend_type: rbpodo
  run_mode: real
  name: left_rb3
  ip: "172.28.60.200"
  operation_mode: real
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  speed_bar: 0.1
  servo_time_sec: 0.01
  servo_lookahead_sec: 0.1
  servo_gain: 1.0
  servo_acc: 1.0
  # Keep controller ACK waiting enabled by default. Set true only in a local
  # motion config after supervised acceptance of the rbpodo command path.
  disable_waiting_ack: false

right_robot:
  backend_type: rbpodo
  run_mode: real
  name: right_rb3
  ip: "172.28.60.201"
  operation_mode: real
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  speed_bar: 0.1
  servo_time_sec: 0.01
  servo_lookahead_sec: 0.1
  servo_gain: 1.0
  servo_acc: 1.0
  # Keep controller ACK waiting enabled by default. Set true only in a local
  # motion config after supervised acceptance of the rbpodo command path.
  disable_waiting_ack: false

left_mount:
  base_pose_in_stand: [0.1601, -0.1725, 0.5825, 0.785, 2.35619, 0.0]

right_mount:
  base_pose_in_stand: [-0.1601, -0.1725, 0.5825, 0.785, -2.35619, 0.0]

servo:
  rate_hz: 200
  command_timeout_sec: 0.2
  io_model: direct
  startup_mode: Hold
  send_servo_commands: false
  enable_realtime_priority: true
  realtime_priority: 80
  cpu_core: 2
  filter_dt_min_ratio: 0.5
  filter_dt_max_ratio: 1.5

safety:
  q_min_deg: [-170, -120, -170, -190, -120, -360]
  q_max_deg: [170, 120, 170, 190, 120, 360]
  dq_max_deg_s: [60, 60, 60, 90, 90, 120]
  ddq_max_deg_s2: [300, 300, 300, 500, 500, 700]
  command_timeout_sec: 0.2
  max_tracking_error_deg: 10.0
  tracking_error_policy: fault_latch
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true

network:
  command_bind: "udp://127.0.0.1:50010"
  state_pub_endpoint: "udp://127.0.0.1:50110"
  state_pub_rate_hz: 20
  command_source_allowlist: ["127.0.0.1/32"]

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

force_control:
  provider: null
  enable: false
