schema: robotics_lab.rb_servo_server.v1

# P0-PARITY-REPAIR-01 read-only rbpodo measurement template.
# Connects to real Rainbow controller boxes for state diagnostics only.
# This config must not send Servo J commands, set pgmode, reset faults, or run
# circle-control paths. Copy to rb_servo_server/config/local/ for site use.

left_robot:
  backend_type: rbpodo
  run_mode: real
  name: left_rbpodo_readonly_measurement
  ip: "172.28.60.200"
  operation_mode: simulation
  command_timeout_sec: 0.05
  speed_bar: 0.1
  servo_t1_sec: 0.002
  servo_t2_sec: 0.05
  servo_gain: 1.0
  servo_alpha: 0.5
  disable_waiting_ack: false

right_robot:
  backend_type: rbpodo
  run_mode: real
  name: right_rbpodo_readonly_measurement
  ip: "172.28.60.201"
  operation_mode: simulation
  command_timeout_sec: 0.05
  speed_bar: 0.1
  servo_t1_sec: 0.002
  servo_t2_sec: 0.05
  servo_gain: 1.0
  servo_alpha: 0.5
  disable_waiting_ack: false

left_mount:
  base_pose_in_stand: [0.1601, -0.1725, 0.5825, 2.186649, 0.523831, 2.526296]

right_mount:
  base_pose_in_stand: [-0.1601, -0.1725, 0.5825, 2.186649, -0.523831, -2.526296]

servo:
  rate_hz: 500
  command_timeout_sec: 0.2
  io_model: direct
  startup_mode: Hold
  send_servo_commands: false
  allow_readonly_faulted_startup: true
  allow_readonly_q_range_violation_startup: true
  allow_readonly_wrong_mode_startup: true
  enable_realtime_priority: true
  realtime_priority: 80
  cpu_core: 2
  filter_dt_min_ratio: 0.5
  filter_dt_max_ratio: 1.5
  servo_t1_rate_match_tolerance_ratio: 0.2
  allow_servo_t1_rate_mismatch: false

safety:
  q_min_deg: [-360, -360, -360, -360, -360, -360]
  q_max_deg: [360, 360, 360, 360, 360, 360]
  dq_max_deg_s: [60, 60, 60, 90, 90, 120]
  ddq_max_deg_s2: [300, 300, 300, 500, 500, 700]
  joint_wrap_period_deg: [0, 0, 0, 360, 0, 360]
  joint_wrap_for_startup_validation: true
  joint_wrap_for_motion_safety: false
  command_timeout_sec: 0.2
  max_tracking_error_deg: 10.0
  tracking_error_policy: fault_latch
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true

network:
  command_bind: "udp://127.0.0.1:50071"
  state_pub_endpoints:
    - "udp://127.0.0.1:50171"
  state_pub_rate_hz: 20
  command_source_allowlist: ["127.0.0.1/32"]

command_source:
  enforce_lease: true
  lease_timeout_sec: 1.0

cartesian_control:
  enable: false
  allow_in_simulation: false
  allow_in_real: false

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

force_control:
  provider: null
  enable: false
