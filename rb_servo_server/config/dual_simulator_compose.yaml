schema: robotics_lab.rb_servo_server.v1

# Canonical Docker Compose hardware-free per-arm simulator backend profile.
# Pair with rb_simulator_left and rb_simulator_right service DNS names.
# This profile is not real robot evidence.

left_robot:
  backend_type: simulator
  run_mode: simulation
  name: left_simulator
  simulator_control_endpoint: "tcp://rb_simulator_left:50200"
  simulator_request_timeout_sec: 0.2
  simulator_connect_timeout_sec: 0.2
  simulator_read_timeout_sec: 0.2
  simulator_send_timeout_sec: 0.2
  simulator_stop_timeout_sec: 0.2
  simulator_reset_timeout_sec: 0.2
  initial_q_deg: [0, -30, 80, 0, 60, 0]

right_robot:
  backend_type: simulator
  run_mode: simulation
  name: right_simulator
  simulator_control_endpoint: "tcp://rb_simulator_right:50200"
  simulator_request_timeout_sec: 0.2
  simulator_connect_timeout_sec: 0.2
  simulator_read_timeout_sec: 0.2
  simulator_send_timeout_sec: 0.2
  simulator_stop_timeout_sec: 0.2
  simulator_reset_timeout_sec: 0.2
  initial_q_deg: [0, -30, 80, 0, 60, 0]

left_mount:
  base_pose_in_stand: [0.1601, -0.1725, 0.5825, 0.785, 2.35619, 0.0]

right_mount:
  base_pose_in_stand: [-0.1601, -0.1725, 0.5825, 0.785, -2.35619, 0.0]

servo:
  rate_hz: 100
  command_timeout_sec: 0.2
  startup_mode: Hold
  enable_realtime_priority: false
  realtime_priority: 80
  cpu_core: -1
  filter_dt_min_ratio: 0.5
  filter_dt_max_ratio: 1.5

safety:
  q_min_deg: [-170, -120, -170, -190, -120, -360]
  q_max_deg: [170, 120, 170, 190, 120, 360]
  dq_max_deg_s: [60, 60, 60, 90, 90, 120]
  ddq_max_deg_s2: [300, 300, 300, 500, 500, 700]
  command_timeout_sec: 0.2
  max_tracking_error_deg: 10.0
  tracking_error_policy: snap_to_actual
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true

network:
  command_bind: "udp://0.0.0.0:50010"
  state_pub_endpoint: "udp://rb_gui:50110"
  state_pub_rate_hz: 20
  command_source_allowlist: ["127.0.0.1/32", "172.16.0.0/12"]

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

force_control:
  provider: null
  enable: false
