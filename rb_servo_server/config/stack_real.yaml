schema: robotics_lab.rb_servo_server.v1

# =====================================================================================
# STACK CONFIG (REAL) — single source of truth for `make run MODE=real`.
# pgmode real: run_mode=real, operation_mode=real.
# Real/sim env gates are retired; no RB_ALLOW_* envs are needed.
# =====================================================================================
left_robot:
  backend_type: rbpodo
  run_mode: real
  name: left_stack_real
  ip: "172.28.60.200"
  operation_mode: real            # PHYSICAL MOTION
  command_timeout_sec: 0.05
  speed_bar: 1.0                  # applied at backend initialize via set_speed_bar()
  servo_t1_sec: 0.002
  servo_t2_sec: 0.021
  servo_gain: 1.0           # reverted: 0.5 caused excessive servo lag (5deg) + right servo deactivation
  # Vendor scales gain/alpha by 0.1 inside the controller, so script-level 10.0 =
  # effective 1.0 = LPF OFF. Measured on fw v8.6.1: script 1.0 gave exactly the
  # first-order pole 0.900/tick (tau 9.5 ticks / 19 ms) that this turns off.
  # An earlier LPF-off attempt produced jerk/jitter on hardware; being retried now
  # that the box queue is regulated (queue_sync below) instead of free-running.
  # 2026-09-02: back to 10.0 (LPF OFF) for the RB5-850E bring-up, on the operator's
  # call. It had been dropped to 1.0 in a8bb854 to chase jerk, which reverses the
  # LPF-off decision that was reached after untangling four confounded variables --
  # and that decision was taken on RB3 inertia and fw v8.7.3, both of which have now
  # changed (RB5 is 2x the mass; the boxes are on v8.9.1). Neither value is carried
  # over on evidence, so start from the documented one and re-measure.
  servo_alpha: 10.0
  # Wire text precision for streamed move_servo_j joint values. The vendor SDK
  # formats with default stream precision (6 SIGNIFICANT digits): at J1's
  # working range (209-278 deg) that is a 0.001 deg staircase on the wire,
  # which the box's t2 lookahead amplifies into jnt_ref jerk (measured by
  # controller-manager, which pins %.7f — RobotLink.cpp). 7 = seven fixed
  # decimals via Cobot::eval() on the same channel; 0 = legacy SDK formatting
  # (flip back to 0 for on-robot A/B).
  servo_j_text_precision: 7
  disable_waiting_ack: true    # ACK-off 500Hz streaming; config-driven, no RB_ALLOW_* env gate
  # Non-blocking pipelined state read: tick N requests, tick N+1 consumes. Same
  # design controller-manager uses to keep box I/O on its RT thread. Validated in
  # MODE=sim against these same boxes (12,425 ticks, 0 held reads). Removes the
  # blocking request_data() (measured median 126 us, max 3.8 ms) from the worker.
  # NOTE: state_age_us stamps at frame-consume time, so it does NOT include the
  # request->response transit. Judge added latency with `sent->ref` minus RBACK
  # fill instead (see docs/runbooks/box_latency_offline.md), not with state age.
  state_read_pipelined: true

right_robot:
  backend_type: rbpodo
  run_mode: real
  name: right_stack_real
  ip: "172.28.60.201"
  operation_mode: real            # PHYSICAL MOTION
  command_timeout_sec: 0.05
  speed_bar: 1.0               # applied at backend initialize via set_speed_bar()
  servo_t1_sec: 0.002
  servo_t2_sec: 0.021
  servo_gain: 1.0                 # reverted: 0.5 caused excessive servo lag (5deg) + right servo deactivation
  # Vendor scales gain/alpha by 0.1 inside the controller, so script-level 10.0 =
  # effective 1.0 = LPF OFF. Measured on fw v8.6.1: script 1.0 gave exactly the
  # first-order pole 0.900/tick (tau 9.5 ticks / 19 ms) that this turns off.
  # An earlier LPF-off attempt produced jerk/jitter on hardware; being retried now
  # that the box queue is regulated (queue_sync below) instead of free-running.
  # 2026-09-02: back to 10.0 (LPF OFF) for the RB5-850E bring-up, on the operator's
  # call. It had been dropped to 1.0 in a8bb854 to chase jerk, which reverses the
  # LPF-off decision that was reached after untangling four confounded variables --
  # and that decision was taken on RB3 inertia and fw v8.7.3, both of which have now
  # changed (RB5 is 2x the mass; the boxes are on v8.9.1). Neither value is carried
  # over on evidence, so start from the documented one and re-measure.
  servo_alpha: 10.0
  # See left_robot.servo_j_text_precision (same rationale; 0 = legacy SDK A/B).
  servo_j_text_precision: 7
  disable_waiting_ack: true    # ACK-off 500Hz streaming; config-driven, no RB_ALLOW_* env gate
  # Non-blocking pipelined state read: tick N requests, tick N+1 consumes. Same
  # design controller-manager uses to keep box I/O on its RT thread. Validated in
  # MODE=sim against these same boxes (12,425 ticks, 0 held reads). Removes the
  # blocking request_data() (measured median 126 us, max 3.8 ms) from the worker.
  # NOTE: state_age_us stamps at frame-consume time, so it does NOT include the
  # request->response transit. Judge added latency with `sent->ref` minus RBACK
  # fill instead (see docs/runbooks/box_latency_offline.md), not with state age.
  state_read_pipelined: true

# 2026-09-02, RB3-730E -> RB5-850E. Derived from the tracked
# descriptions/urdf/dual_rb5_850e_ver3.urdf stand->stand_<side>_arm_base transform,
# in the [x y z rx ry rz] convention math::rotationFromPose uses (R = Rz*Ry*Rx, i.e.
# URDF rpy). The derivation was validated by reproducing the RB3 pair it replaces
# from dual_rb3_730e_ver5.urdf to 0.0000 mm / 0.000027 deg before being applied here.
#
# The frame convention CHANGED with the robot -- RB3 mirrored the arms in X and put
# the stand frame 90 deg round; RB5 mirrors in Y. Do not pattern-match the old values.
#
# VERIFIED ON HARDWARE, not just derived: with both arms hand-parked in two contact
# poses (TCPs on the stand, and the two TCPs touching each other) these mounts put
# the left and right TCPs within 0.95 mm of a common tool length. See
# tools/make_rb5_850e_urdfs.py for the poses and the joint angles.
left_mount:
  base_pose_in_stand: [0.17036, 0.19707, 0.57036, 2.185914, 0.523132, -2.186649]

right_mount:
  base_pose_in_stand: [0.17036, -0.19707, 0.57036, 2.185914, -0.523132, -0.954944]

servo:
  rate_hz: 500
  command_timeout_sec: 0.2
  # Per-arm worker I/O. Required for queue_sync: each arm's worker owns its own
  # send cadence so the period trim can lock that arm's stream to ITS box clock.
  # A single loop has one period for two boxes running two different clocks
  # (measured drift: left +0.665, right +0.670 ticks/s -- they diverge).
  io_model: worker
  # Worker-side setpoint RATE CONVERSION. The loop produces at ~500.006 Hz (host
  # clock) while the worker sends at the box-locked ~499.35 Hz; the ~0.65/s
  # difference was silently overwritten in the latest-wins mailbox and the box
  # FIFO played a DOUBLE reference step per skip
  # (review_request_2026-08-26/README.md §3, confirmed real by the
  # position-conservation test). true = the worker linearly interpolates the
  # setpoint stream at its own cadence: the mismatch becomes a uniform 0.13 %
  # time dilation, doubled steps vanish, cost +1 setpoint (~2 ms) latency.
  #
  # ON since 2026-08-27. Once the wire-precision staircase and the plan-gate
  # chunk-rate ripple were gone this was the ONLY residual "phase mismatch"
  # sound left, and the operator still heard it on both arms.
  # MEASURED (servo_log_20260827_222006.csv, 252 s, both arms):
  #   - The loop is exact (500.000 Hz, ONE tick >2.5 ms in the whole run) and
  #     queue sync is locked (fill p05=p50=p95=5, track 98.6 %, trim 2.65 us,
  #     zero underrun/stall/highwater/redrain). The defect is between them.
  #   - Worker dispatched 499.33 Hz against the loop's 500.000: a 0.67-0.69/s
  #     surplus, absorbed one setpoint at a time as 1.6 overwrites/s (dropped ->
  #     next wire step covers 2 ticks = DOUBLE velocity) and 0.9 repeats/s
  #     (mailbox empty -> wire holds one tick = ZERO velocity).
  #   - Every observed cadence gap was exactly 2x the period (4005-4016 us) with
  #     no catch-up (zero periods <1900 us), and gaps recurred at p50 1490 ms --
  #     the 1/0.67 Hz beat, to within measurement noise.
  #   - Per event, one tick of velocity discontinuity on the wire: 18,400 deg/s^2
  #     at the left arm's p90 command speed (36.9 deg/s), 13,200 at the right's.
  #   - Per-arm and independent (only 23 of 228 left-arm gaps fell within 2 ms of
  #     a right-arm gap), which is why it is audible on both arms separately.
  # Judge with worker_interp_* columns + scripts/analyze_smoothness.py:
  # worker_repeated_sends_total -> ~0 (with a setpoint always available the
  # repeat-last branch is unreachable), interp_active = 1, delay_setpoints ~= 1,
  # and hold/rebase ~0 (nonzero = the producer really stalled or burst).
  # worker_pending_overwrites_total does NOT go to zero and should not: the
  # mailbox is still overwritten at each beat crossing, but the interpolator
  # walks through every pushed setpoint, so an overwrite no longer loses wire
  # content. Revert by flipping this one line.
  worker_setpoint_interpolation: true
  worker_read_period_sec: 0.002
  # A worker-cached read crosses a thread boundary: measured MEDIAN age 1567 us
  # at a 2 ms period (direct I/O is 25-125 us). The former hardcoded 2-period
  # budget left under one period of margin, and a single tick over it returned a
  # jointless state that latched an unrecoverable fault
  # (2026-08-25). 4 periods = 8 ms gives real margin against that phase offset.
  worker_state_max_age_periods: 4.0
  startup_mode: Hold
  send_servo_commands: true
  enable_realtime_priority: true
  realtime_priority: 80
  cpu_core: 3
  # The ARM WORKERS' scheduling. With queue_sync on, each worker owns its arm's
  # 500 Hz send cadence, so it is an RT thread by role -- but until 2026-08-26 it
  # was a plain SCHED_OTHER thread with no affinity while only the loop above got
  # FIFO + an isolated core. Measured symptom: worker-cached state age ~1 ms
  # median (the healthy half-period phase offset) with a tail to 7.6 ms against
  # the 8 ms budget, uncorrelated with reqdata duration or send period.
  # cpu1/cpu2 are isolated (isolcpus=domain,managed_irq,1-3) and carry only
  # kernel threads; the loop keeps cpu3. NOTE: controller-manager hard-pins its
  # own arms to cpu1/cpu2 -- do not run both stacks against these cores at once.
  # To bisect a regression, comment out all THREE lines together: config
  # validation refuses cores pinned without a FIFO priority, because a dedicated
  # core that still yields to any CFS thread is the trap this setting removes.
  worker_realtime_priority: 80
  worker_cpu_core_left: 1
  worker_cpu_core_right: 2
  # Hybrid sleep-then-spin tail (us). 0 = plain sleep_until (default). Set e.g.
  # 50 to busy-spin the last 50us of each 2ms tick and remove C-state/scheduler
  # wake jitter on the dedicated isolated cpu_core. REQUIRES RT throttling off
  # (`sudo sysctl kernel.sched_rt_runtime_us=-1`); otherwise the server logs a
  # warning and falls back to sleep_until (a busy RT spin would be throttled
  # ~50ms/s). Must be < the tick period.
  spin_slack_us: 0
  filter_dt_min_ratio: 0.5
  # Final-stage joint MA: 40 ticks @500Hz = 80ms boxcar (~40ms delay).
  output_moving_average_window: 1
  filter_dt_max_ratio: 1.5
  servo_t1_rate_match_tolerance_ratio: 0.2
  allow_servo_t1_rate_mismatch: true   # servo param experiment: t1 != 2ms period accepted (was false)
  # REAL physical-motion opt-in: accept the vendor -2001 (op_stat_self_collision/robot_time
  # field-layout garbage) as unavailable instead of latching diagnostics_suspect. ONLY
  # these two fields are suppressed; everything else still faults. Fail-closed (needs
  # operation_mode==real + this config opt-in; no env gate).
  allow_real_motion_with_suspect_diagnostics: true
  # Per-arm direct teaching (free-drive) opt-in. Fail-closed: without this the server
  # rejects every Freedrive command (servo.allow_freedrive=false). Direct teaching is a
  # physical gravity-compensation function and only runs with operation_mode: real (in
  # operation_mode: simulation the controller refuses with pendant error M151 "Direct
  # Teaching: Cannot run this function"). Operator-supervised + E-stop required.
  allow_freedrive: true
  # Controller-sim advisory carve-outs are intentionally OMITTED here: they are inert in
  # real mode and must not be relied on for physical motion.
  # Async streaming (sdk_ack_worker) is a controller-simulation-only feature and is
  # rejected in real mode by config validation. Real motion uses the synchronous direct
  # send path (io_model: direct above); per-command ACK was ~176us in pgmode, well within
  # the 2ms 500Hz budget. A real send failure latches SendFailure (no advisory in real).
  rbpodo_async_streaming:
    enable: false

safety:
  # J3 (elbow) physical range on RB3-730E is +/-150 deg (catalog); the joint cannot
  # reach +/-360. It is clamped here so JointTarget/InitMotion PTP (which bypass IK and
  # only pass this final safety clamp) and shortest-path goal selection never command an
  # unreachable J3 the controller would reject/clamp. J3 also mirrors the IK URDF limit
  # (rb3_730e.urdf: elbow +/-2.618 rad); see docs/joint_range_policy.md.
  # 2026-08-26: J3 back to the catalog +/-150 (was a +/-160 site margin). The extra
  # 10 deg was not usable range -- it was a TRAP. IK is model-limited to +/-150
  # (dual_rb3_730e_ver5.urdf elbow_joint, +/-2.618 rad) and the URDF says explicitly not
  # to widen it, because a solver that picks an elbow branch the controller would
  # reject/clamp is exactly what surfaces as a TCP branch-flip / lurch. So +/-160 here
  # only let JointTarget/InitMotion PTP (which bypass IK and pass ONLY this clamp) park
  # the elbow in a 10 deg band that Cartesian control can then never command out of:
  # the next TcpPoseTarget tick is refused on the spot.
  # Measured on real rollouts: the left elbow sat pinned at exactly 150.000 deg for 7 s
  # (servo_log_20260826_063359.csv) and 4.5 s (servo_log_20260826_075010.csv). Narrowing
  # is the safe direction -- the clamp now agrees with the IK model, and the startup WARN
  # about the safety-vs-URDF mismatch goes away.
  # safety.joint_limit_barrier below already braced against +/-150, so its behaviour is
  # unchanged; this only removes the band PTP could still reach.
  # 2026-09-02, RB3-730E -> RB5-850E: J3 is +/-165 on this arm (Rainbow RB Series
  # catalog p7), not +/-150. This MUST equal the elbow bound in kinematics.urdf and
  # in the unified collision URDF -- both are generated at +/-165 by
  # rb_servo_server/tools/make_rb5_850e_urdfs.py. A clamp WIDER than the URDF is the
  # trap described above (PTP parks the elbow where IK will not command it out of);
  # a clamp NARROWER wastes 15 deg of the reach the swap was made to get.
  q_min_deg: [-360, -360, -165, -360, -360, -360]
  q_max_deg: [360, 360, 165, 360, 360, 360]
  # The bounds above are a POLICY about what we COMMAND. The MEASURED pose is a
  # separate question ("is the robot somewhere physically plausible"), and judging
  # it with the command bound makes driving to the limit self-defeating: a servo
  # that lands on a target clamped exactly to the bound always overshoots a little.
  # MEASURED 2026-08-27 (servo_log_20260827_121630.csv, t=55.290 s): left elbow
  # commanded to exactly 150.000 deg -- the clamp doing its job -- and measured at
  # 150.008 deg. That 8/1000 of a degree (~0.05 mm at the TCP) failed
  # isValidJointState and latched RobotStateError, ending a policy rollout mid-run.
  # Worst overshoot in that run: 0.045 deg. The conflict appeared on 2026-08-26,
  # when J3's command bound was narrowed 160 -> 150 and the two limits collapsed
  # onto the same number.
  # 2.0 deg swallows servo overshoot, encoder noise and gravity sag while leaving a
  # genuinely wrong pose (bad encoder, wrong frame) latching as before -- the
  # tracking-error latch next door is 30 deg for scale.
  joint_state_validity_margin_deg: 2.0
  # 2026-06-28: raised for UMI teleop responsiveness. The global outer clamp was
  # the binding limit on UMI Cartesian tracking (left arm velocity-clamped 34%,
  # accel-clamped 47% -> "robot follows too slowly"). Accel raised more (it was the
  # dominant limiter). Does NOT speed up init/jog (joint_target_smd profile caps them
  # at [22..42]) nor spacemouse (rarely hits this clamp). SAFETY: robot is ~1.3x
  # faster / ~1.6x snappier -> supervised, E-stop ready; dial back if too aggressive.
  # 2026-06-28 (2nd raise): user wants ~2x faster UMI + much lower follow latency.
  # Accel pushed >2x (it was the dominant 47% limiter and drives the snappy catch-up
  # that fixes "robot follows AFTER I move"). dq[0..2]=140 is ~1.75x (slightly under 2x:
  # the proximal joints are likeliest to hit the controller's own hardware speed cap,
  # which would reject/clamp). SAFETY: noticeably fast/aggressive — test in clear space,
  # E-stop ready; if a move faults or the tracking-error latch trips, lower ddq then dq.
  # 2026-09-02, RB3-730E -> RB5-850E. The RB3 pair [170,170,170,240,240,320] was
  # tuned against RB3's rating, where J5/J6 are +/-360 deg/s. RB5-850 is +/-180 deg/s
  # on ALL SIX joints (Rainbow RB Series catalog p7), so J4/J5/J6 were above the
  # rating of the arm now attached. Capped at 170 across the board -- the same ~94%
  # of rating J1-J3 already ran at.
  # This costs nothing on this task: across the last RB3 rollouts J5/J6 peaked at
  # 109 and 104 deg/s with p99 of 38-45, i.e. never within 2x of even the new cap.
  dq_max_deg_s: [170, 170, 170, 170, 170, 170]
  # ddq is a BACKSTOP, not a target -- the Cartesian accel/jerk limits in the chunk
  # follower set the real demand, and this clamp binding is itself a known source of
  # roughness (see the accel-clamp measurements in the follower notes). It is left at
  # the RB3 values deliberately rather than scaled by the 2x mass, because lowering a
  # rarely-binding backstop trades a speculative gain for a measured failure mode.
  # RE-MEASURE on RB5 before trusting it: watch the accel-clamp percentage in the
  # servo log, and lower ddq before dq if the tracking-error latch trips.
  ddq_max_deg_s2: [1500, 1500, 1500, 2300, 2300, 3000]  # was [1100,1100,1100,1700,1700,2300]
  # dq_max_deg_s: [80, 80, 80, 110, 110, 140]        # prior (1st raise)
  # ddq_max_deg_s2: [500, 500, 500, 800, 800, 1100]   # prior (1st raise)
  # dq_max_deg_s: [60, 60, 60, 90, 90, 120]          # post-first-run
  # ddq_max_deg_s2: [300, 300, 300, 500, 500, 700]    # post-first-run
  # dq_max_deg_s: [30, 30, 30, 45, 45, 60]         # first-run halved
  # ddq_max_deg_s2: [150, 150, 150, 250, 250, 350]  # first-run halved
  # 2026-08-26 SHAKE FIX (servo_log_20260826_042818.csv, 04:29:31 / 04:29:37 KST).
  # The joint acceleration limiter bounded acceleration only: its anti-overshoot guard
  # clipped the accel-limited output straight back to the target whenever the target
  # decelerated, so a target that stopped hard reached the arm at unbounded jerk.
  # Measured: right J6 ramped up ON the 3000 deg/s^2 ceiling to 196 deg/s and then fell
  # to 60 deg/s in ONE 2 ms tick = -68,000 deg/s^2 (23x the ceiling), repeating at
  # 4-6 Hz for ~0.7 s. ratio 4.0 caps deceleration at 4x ddq_max (6,000-12,000 deg/s^2),
  # a 5.7x cut in that jerk spike.
  # COST, sized deliberately: bounding deceleration means the command leads the target
  # while the ramp runs. Worst-case coast past a dead-stopped target is
  # v^2 / (2*ratio*ddq) = 196^2 / (2*4*3000) = 1.6 deg on J6 at the speed measured
  # above; the per-tick lead against a still-moving target is capped at
  # decel_overshoot_budget_deg. Raise the ratio to trade smoothness back for lead.
  ddq_max_decel_ratio: 4.0
  decel_overshoot_budget_deg: 0.5
  # A tick where the joint clamps removed more than this much velocity counts as a
  # COMMAND THROTTLE: it stamps the same "command was refused" window as a safety
  # projection or a blocked Cartesian solve, so the chunk follower freezes its plan and
  # a divergence the safety layer itself caused RE-ANCHORS instead of latching
  # ChunkFollowerFault. 50 deg/s was chosen from the same rollout: >50 deg/s of removed
  # velocity occurred on 0.32% (left) / 0.98% (right) of running ticks, while >2 deg/s
  # occurred on ~2.1% -- a threshold near zero would pin the window open and freeze the
  # plan permanently.
  throttle_intervention_deg_s: 50.0
  # PROJECTION RELEASE SLEW (2026-08-28), in deg/s^2 of correction velocity.
  # The geometric projection re-solves from scratch every tick, so its correction
  # was free to collapse in one tick. Engaging fast is the point of a damper;
  # dis-engaging fast is where the vibration came from.
  # MEASURED, servo_log_20260828_004539.csv, the left-arm <-> stand event at
  # t=223.37-224.01 s. The barrier itself was correct: it pinned the clearance at
  # 24.86-25.01 mm against its own 25 mm floor for 0.58 s while the arm kept moving
  # tangentially (J1 held ~-40 deg/s, J5 swept +1.7 -> +31 deg/s). What was not
  # correct was how the correction CHANGED:
  #   - 40 single-tick dropouts on the left arm (25 on the right): the correction
  #     read 12.28 -> 3.93 -> 12.36 and 12.36 -> 3.94 -> 12.09, each ~4,280 deg/s^2.
  #     |dcorr|/tick was p50 0.197 but p95 8.42 deg/s -- a split distribution.
  #   - a step release: 12.09 -> 0.00 in one tick, immediately followed by J1
  #     -53.8 -> -83.6 deg/s and 5,946 deg/s^2. Seven more on the right arm.
  #   - net 8-60 Hz command vibration of 2.88 in that window vs a run median of
  #     0.248 (12x).
  # A d_hard standoff does NOT address this: it changes WHERE the barrier holds,
  # and the defect is in HOW the correction changes. 400 deg/s^2 turns the measured
  # 12.09 deg/s release into a ~30 ms ramp and the 8.4 deg/s dropouts into ~21 ms,
  # while staying at 13-27% of ddq_max_deg_s2 (1500-3000) so the release itself can
  # never be the dominant jerk. Growing the correction stays instantaneous, so the
  # safety response is never delayed; only shrinking is bounded, which is always the
  # conservative side. 0 restores the legacy one-tick release.
  projection_release_slew_deg_s2: 400.0
  # VERDICT HYSTERESIS (2026-09-04). RoiViolation/FloorViolation/SelfCollision are
  # raised per tick on "the projection cut the command this tick"; a plan dithering
  # on a face toggled Ok <-> RoiViolation six times in 0.3 s. Hold the last
  # projection verdict 100 ms. Telemetry/GUI only -- rows, counters and the
  # intervention stamp are untouched. 0 = per-tick (legacy).
  projection_verdict_hold_sec: 0.1

  # SAFETY PLAN GATE (2026-08-26). The geometric layers slow the ARM but nothing
  # slowed the PLAN: the chunk follower kept integrating at up to 0.45 m/s while a
  # barrier held the arm, and the accumulated lead discharged either as a release
  # lunge (measured 10,050 deg/s^2 command accel at a clamp exit; 40.7 mm of lead
  # across eight RoiViolation episodes) or as re-anchor stop-go (~5 Hz shake class).
  # This gate advances the plan clock at the realized/requested joint-step ratio,
  # so the reference cannot outrun the arm. Same principle as the force advance
  # gate, generalized to geometry.
  #
  # CORRECTED 2026-08-27 (servo_log_20260827_213651.csv, 169 s rollout). As first
  # shipped the gate measured `desired` vs final, i.e. everything the safety filter
  # did, and the CLAMPS dominated it:
  #   - 77.6% of the left arm's gated ticks co-occurred with the J3 approach barrier
  #     and only 5.5% with the self-collision projection; the right arm split
  #     30% barrier / 30% projection / 28.5% acceleration clamp.
  #   - The barrier holding J3 at its 149.90 deg standoff is the barrier WORKING, and
  #     it makes realized < requested on that joint forever, so the gate throttled the
  #     plan clock of all six joints for as long as one joint was parked.
  #   - Cost: 11.07 s of plan time discarded on the left arm (6.5% of the run, ~53
  #     chunks of lag) of which 9.42 s sat on the barrier and 0.72 s on the projection;
  #     1.97 s on the right. That lag is the "offset" the operator felt after every
  #     self-collision slowdown.
  #   - Symptom: a ~4.8 Hz command ripple, exactly the 208 ms chunk arrival rate and
  #     coherent across all six joints, at 2.1-2.8x the baseline 5-25 Hz tremble in
  #     gate-dip windows after matching for speed.
  # The gate input is now post-clamp vs post-projection, so only an obstruction
  # (self-collision, floor, ROI, reach) can close it, and the ratio is the realized
  # step projected onto the requested direction rather than a ratio of two
  # independent per-joint maxima.
  plan_gate:
    enable: true
    release_alpha: 0.02
    # Attack was instantaneous, which let ONE tick cut the plan clock by 88%
    # (measured max |dgate|/tick = 0.88) -- an abrupt motion injected by the layer
    # meant to remove them. The gate is not the safety mechanism (the projection
    # already removed the closing velocity in the same tick), so it can afford a
    # short ramp: 0.1 @ 500 Hz = 63% in 20 ms, 95% in 60 ms.
    attack_alpha: 0.1
    # Compared against the Euclidean norm of the 6-joint step (the directional
    # ratio's own scale), not the per-joint max as before.
    deadband_deg: 0.05
    min_gate: 0.0
    # PACE THE PLAN BY A SUSTAINED IK THROTTLE (2026-08-28). The gate above reads only
    # the obstruction projection, on purpose -- feeding it the joint-limit barrier and
    # the acceleration clamp was tried and REVERTED (a 4.8 Hz ripple at 2.1-2.8x the
    # baseline tremble; see the note at the planGateStep call site). A sustained IK
    # branch-jump rate limit is the case that note does not cover, and the distinction
    # is DURATION: the accel clamp passes its motion through on the next tick, while the
    # rate limiter through an ill-conditioned pose held for 150 CONSECUTIVE ticks
    # (0.3 s) with IK wanting 4.233 deg/tick against a 0.350 ceiling. The follower plan
    # advancing through that wound the divergence to 50.05 mm -- grazing, not crossing,
    # the 50 mm re-anchor latch -- and the catch-up was that run's two worst seconds
    # (3,830 mdeg of >5 Hz command content, 4 follower re-anchors inside 0.6 s).
    # 25 ticks = 50 ms: long enough that no transient clamp reaches it, short enough to
    # act well before divergence accumulates. The gate never goes below min_gate, so the
    # plan SLOWS to the rate the arm is achieving and never stops -- no stop-go.
    ik_throttle_min_ticks: 25
  # JOINT-LIMIT APPROACH BARRIER (2026-08-26). The hard q_min/q_max clamp stops the
  # command AT the limit but says nothing about how fast it arrives, so a target driving
  # a joint into its stop pins it at full commanded speed. Once pinned, IK cannot solve
  # past the limit and the tick is refused -> the arm alternates hold/move at loop rate.
  # MEASURED (servo_log_20260826_055758.csv, right arm ~05:59:20 KST): J3 sat at exactly
  # -150.0 deg, margin 0.000, for 720 of 800 ticks -> 436 IK refusals / 159 best-effort
  # accepts, and an 18.3 Hz buzz on J2/J6 that the left arm's spectrum does not show.
  # This is the joint-space twin of the floor/ROI/self-collision dampers: inside
  # d_slow_deg of a bound the CLOSING speed is capped at sqrt(2*a_brake*margin), so the
  # joint coasts to a stop AT the bound. Retreating is never limited.
  #
  # NOTE the reach_constraint alternative was measured and REJECTED for this failure:
  # every observed singularity/limit event happened at a TCP radius of 0.35-0.58 m while
  # the whole task lives in 0.35-0.68 m, far inside any reach shell. These are INTERIOR
  # joint limits, not workspace-boundary violations, so a radial shell never fires.
  # (2026-08-26 update: the shell IS now enabled below — not for this failure, which
  # the barrier + IK pinned-final refinement own, but as the workspace-boundary
  # backstop that was missing entirely; see reach_constraint.)
  joint_limit_barrier:
    enable: true
    # Braced against the URDF IK limit (+/-165 on J3, RB5-850E). safety.q_min_deg/q_max_deg above
    # now agrees (it was +/-160 until 2026-08-26, which left a 10 deg band the arm could
    # be parked in by PTP but never commanded out of by IK). Keeping this block explicit
    # rather than inheriting documents WHICH limit the barrier brakes against, so a
    # future widening of the safety clamp cannot silently move the braking point.
    # Every other joint is unlimited (+/-360) and the barrier is inert there.
    q_min_deg: [-360, -360, -165, -360, -360, -360]
    q_max_deg: [ 360,  360,  165,  360,  360,  360]
    # d_slow must satisfy d_slow >= dq_max^2/(2*a_brake) or the barrier engages too late
    # to stop before the bound (config load FAILS if it does not). With
    # dq_max=[170,170,170,240,240,320] and the a_brake below the minimum bands are
    # [9.6,9.6,9.6,12.5,12.5,17.1] deg; these carry ~25% margin on top.
    d_slow_deg:     [12, 12, 12, 16, 16, 22]
    a_brake_deg_s2: [1500, 1500, 1500, 2300, 2300, 3000]
    # COME TO REST JUST SHORT OF THE BOUND, NOT ON IT. The barrier asymptotes the
    # command exactly onto the bound, and a joint parked exactly on its bound has
    # its servo holding against the stop. MEASURED 2026-08-27
    # (servo_log_20260827_135610.csv): the left elbow sat at 150.000 deg for 8.0 s
    # while the ENCODER rang at 17 Hz -- 47% of its 5-50 Hz band energy against
    # 1.9% when free -- and that ring is what the operator heard. The command
    # stream itself was clean in band (0.0%, 0.05 deg/s), so this is the servo at
    # its stop, not our stream. In the same run, once the command settled 0.057 deg
    # inside the bound the 17 Hz peak was gone (peak back to 0.5 Hz, ordinary
    # motion). 0.10 deg buys margin over that measured 0.057 while costing a tenth
    # of a degree of travel. The bound itself is UNCHANGED and still owned by the
    # hard clamp; retreating out of the band is still never limited.
    standoff_deg:   [0.10, 0.10, 0.10, 0.10, 0.10, 0.10]
  joint_wrap_period_deg: [0, 0, 0, 360, 0, 360]
  # Keep wrist yaw cable-safe on JointTarget/InitMotion return: J6 must move to
  # the configured raw target, not the nearest +/-360 equivalent.
  joint_target_literal_axes: [false, false, false, false, false, true]
  joint_wrap_for_startup_validation: false
  joint_wrap_for_motion_safety: false
  command_timeout_sec: 0.2
  max_tracking_error_deg: 30.0                 # was 10: fast teleop catch-up tripped the latch
  tracking_error_policy: fault_latch           # real: tracking error MUST latch (no advisory)
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true
  # Server-side dual-arm capsule self-collision guard — independent of the controller's
  # (suppressed/untrusted) op_stat_self_collision. ClampToHold refuses to advance toward
  # collision but never permanently latches; this is the collision net for physical motion.
  # stand + left arm + right arm을 하나의 self로 보는 캡슐 가드.
  # Checked pairs: left<->right, left<->stand, right<->stand (intra-arm 미검사).
  # 활성 mesh self-collision 가드는 dual_rb3_730e_ver5.urdf(ver2 clean stand + CoACD hull)를 사용.
  # (비활성) stand_capsules 캡슐 경로는 여전히 ver3 box 기반 — ver2 재유도 미적용(기능보존).
  # margin_m은 radius 위에 더해지는 clearance threshold (기구 오차 여유).
  # 초기 자세 최소 stand 여유 25.3mm (bone1<->mount_plate, 회귀 테스트로 고정).
  # Stand-frame safety floor: TCP z of either arm may never go below z_min_m
  # (z=0 == stand origin plane). Runtime-adjustable from the viser GUI via the
  # leaseless SetSafetyFloorZ command within [runtime_min_z_m, runtime_max_z_m].
  # JointTarget(InitMotion/jog) SMD 프로파일: 풀스피드 램프 대신 임계감쇠
  # 2차계 추종으로 부드럽게 이동. 아래 한계는 프로파일용 — 전역 dq_max/ddq_max는
  # 외곽 하드 클램프로 그대로 적용됨. (TcpPoseTarget의 pose_track_smd와 대칭)
  joint_target_smd:
    enable: true
    damping_ratio: 1.0          # 임계감쇠: 오버슈트 없음
    # 2026-07-02 (user: 5배 빠르게): InitMotion/Jog 실제 속도는 max_velocity가 아니라
    # wn=2π·fn 과 execution_lookahead_deg 로 결정된다(평형속도 v≈wn·L/2ζ). fn 0.30→1.5
    # (5x)로 올리고, 새 병목이 안 되도록 velocity/accel 상한을 함께 확장(≥ wn²·L≈530).
    # damping_ratio 1.0 유지 → 여전히 오버슈트 없음. 모두 전역 dq_max[170..320]/
    # ddq_max[1500..3000] 하드클램프 이내. 첫 InitMotion은 E-stop 준비 상태로 확인할 것.
    # 2026-07-02 2차 (user: 1.5배 더): fn 1.5→2.25. v_eq는 fn 선형(28→42°/s)이나 초기
    # 가속요구 wn²·L은 fn 제곱(≈1200°/s²)이라 accel 상한을 크게 열어야 fn이 재스로틀 안 됨.
    # 이제 전역 ddq_max[1500..3000] 하드클램프 바로 아래 — 여기가 outer 안전클램프를
    # 안 건드리고 갈 수 있는 실용적 상한. 더 빠르게 하려면 dq_max/ddq_max도 올려야 함(안전 결정).
    natural_frequency_hz: 2.25  # was 1.50 (추가 1.5x); 임계감쇠 유지
    max_velocity_deg_s:  [60, 60, 60, 80, 80, 100]        # was [40,40,40,55,55,70]; v_eq≈42°/s 여유, 전역170/240/320 이내
    max_accel_deg_s2:    [1300, 1300, 1300, 1900, 1900, 2400]  # was [600..1200]; wn²·L≈1200 커버, 전역1500/2300/3000 이내
    # 2026-07-03 (발판 a/c → InitMotion 도착부 감속): natural_frequency와 분리된 도착 테이퍼.
    # 최종 waypoint까지 남은 거리 d로 속도상한 v≤√(2·arrival_decel·d)를 걸어 마지막 구간만
    # 완만히 기어들어가게 함(모든 조인트 균일 스케일 → 직선 경로 보존). 시작/순항(v_eq≈42°/s,
    # wn 지배)은 그대로 — d가 크면 상한>순항속도라 비활성이므로 시작 스냅 영향 0.
    # 참고: SMD 자연 도착감속 peak ≈ 0.368·wn·v0 ≈ 0.368·14.14·42 ≈ 218°/s². 80은 그 ~1/2.7
    # 로 완만. √(2·80·d)<42 → 마지막 d<~11°부터 작동, 감속도 constant 80°/s²(글라이드 ~0.5s).
    # 더 완만/길게: arrival_decel 낮추기(예: 50 → d<~11°→더 부드럽·더 김). 218에 근접시키면 무효과.
    arrival_taper_enable: true
    arrival_decel_deg_s2: 40.0     # 작을수록 더 완만/긴 감속; cap=√(2·a·d) deg/s
    arrival_min_speed_deg_s: 3.0   # tail이 waypoint_tol로 빨리 안착하도록 최저속도 floor
  floor_constraint:
    # 2026-07-12 operator decision: explicitly disabled so the 60 mm geometric
    # velocity damper cannot alter bolt-pick approach proprioception. This
    # removes the TCP/gripper-tip floor backstop for every motion primitive;
    # ROI, self-collision, tracking, lease/deadman, and E-stop remain.
    enable: false
    z_min_m: 0.0000
    runtime_min_z_m: -0.2
    runtime_max_z_m: 0.5
    fail_policy: clamp_hold
    monitor_only: false
    # 2026-06-19 anti-chatter: Stage3 velocity-damper를 더 부드럽게 (기본 4.0/0.05).
    # 평면 접근 시 √(2·a_brake·(z−z_min))로 감속 — a_brake↓ + 밴드↑ = 가장자리 jerk↓.
    a_brake_m_s2: 3.0
    d_slow_m: 0.06
    # PIKA 그리퍼 팁 4점 (TCP 프레임 오프셋, 줄자 실측 tip-to-tip 118mm:
    # tcp 프레임 = 팁 평면(z 247.642mm @attachment_site), 팁 양끝은
    # tool visual의 z+90° 회전 반영 시 TCP x축 방향 ±59.0mm). 2026-06-25:
    # 팁 폭(y)까지 커버하도록 각 x끝에 y축 ±20mm를 더해 팁 평면 4코너로 확장.
    # TCP가 회전했을 때 팁이 TCP 점보다 아래로 내려가는 케이스를 잡는다.
    # 체크는 팔당 5점(TCP+팁 4)이며, 최종 FK backstop뿐 아니라
    # 2026-06-26: 그리퍼 개폐에 따라 팁이 jaw축(TCP x)으로 모이므로 offset_m(완전
    # 개방, percent=100)과 offset_closed_m(완전 닫힘, percent=0) 사이를 실측 그리퍼
    # 개방률로 선형 보간한다. closed x±0.010 = open x±0.057 − URDF 핑거 travel
    # 0.047m(rb3_730e_pika_articulated.urdf). ★URDF 유도 기본값이므로 줄자 실측으로
    # 검증할 것. offset_closed_m 생략 시 정적(개방 고정)=기존 거동.
    tcp_offset_points:
      - { name: gripper_tip_a_yp, offset_m: [ 0.058,  0.012, 0.0 ], offset_closed_m: [ 0.010,  0.012, 0.0 ] }
      - { name: gripper_tip_a_yn, offset_m: [ 0.058, -0.012, 0.0 ], offset_closed_m: [ 0.010, -0.012, 0.0 ] }
      - { name: gripper_tip_b_yp, offset_m: [-0.058,  0.012, 0.0 ], offset_closed_m: [-0.010,  0.012, 0.0 ] }
      - { name: gripper_tip_b_yn, offset_m: [-0.058, -0.012, 0.0 ], offset_closed_m: [-0.010, -0.012, 0.0 ] }
  # Stand-frame ROI box (workspace limit), viser "Safety ROI box"에서 조정.
  # enable=true라야 viser Send가 허용된다(서버가 enabled 보고). bounds/면(face)
  # velocity-damper/fail-closed/escape 로직은 전부 C++ 서버(config-driven)이고
  # sim/real 코드 경로가 동일 — 이 블록이 빠지면 enable 기본값 false로 비활성.
  # 2026-06-20: pgmode simulation에서 강제 거동 검증 완료 → real enforce로 승격.
  # bounds는 sim에서 검증한 값 재사용, 강제(monitor_only=false)는 real floor와 동일.
  roi_box:
    enable: true
    # 2026-07-09 (ft branch): z 하한만 0.000 → -0.200 (runtime_min과 동일). 바닥면이
    # 스탠드 플로어와 같은 높이(z=0)라 플로어를 꺼도 테이블 접근 감속이 남던 것을
    # 제거 — 바닥 backstop은 FT 센서로 대체, x/y/상단 작업공간 제한은 유지.
    # 2026-09-02, RB3-730E -> RB5-850E: ROTATED Rz(+90 deg) into the new stand frame.
    # These bounds are STAND-FRAME, and the stand frame convention changed with the
    # robot -- dual_rb3_730e_ver5 has base->stand = +90 deg about Z, dual_rb5_850e_ver3
    # has identity -- so the same physical box needs different numbers. Left unrotated
    # they were 90 deg off the arms: all four TCPs read off the hardware in two parked
    # poses fell OUTSIDE this box, including the one with both arms out over the table.
    # After the rotation the working pose is inside and the pose touching the stand
    # column stays outside, which is what should happen.
    # The rotation carries the 2026-08-2x y_max tightening with it: -0.300 is now the
    # +0.300 x_min face, same physical plane.
    # ASSUMES the table sits the same way relative to the stand. The stand itself
    # changed (arm spacing +/-0.157 -> +/-0.197 m, height 0.580 -> 0.570), so re-confirm
    # the extents against the real table before trusting the far faces.
    # 2026-09-04 (late): z_min -0.350 -> -0.400. THIS FACE IS THE ONLY GEOMETRIC FLOOR
    # LEFT (floor_constraint.enable is false since 2026-07-12, user_floor_constraint
    # since 2026-07-09), so read the evidence before moving it again.
    # WHY: it co-bound with the reach shell on the deep place approach -- 575 of 3140
    # blocked ticks in servo_log_20260904_225810, x ~0.70. The face binds on the
    # GRIPPER TIP, 58 mm ahead of the TCP the GUI draws, so a -0.350 face stops the
    # TCP at -0.292 and the operator was asking for -0.333 (tip -0.391). -0.400 clears
    # that with 9 mm to spare.
    # WHAT WAS CHECKED FIRST: through those deep episodes the wrist read |F| mean
    # 0.7 N / max 1.0 N -- free space, so it was this face and not the table that
    # stopped the arm. The deepest TARED contact anywhere today was z -0.198, and the
    # arm sat at -0.302 in free air. There is no evidence of a surface between -0.30
    # and -0.40. (The 400k+ ">8 N" ticks in the 2157/2222 logs are UNTARED bias, not
    # contact -- see the auto-tare gap in AGENTS.md.)
    # WHAT IS GIVING WAY: 50 mm of the last geometric floor. Below it the only
    # backstops are force_control's 10 N gate -- which regulates SUSTAINED force and,
    # by its own note above, cannot catch the first-contact transient -- plus operator
    # supervision and the E-stop. safety.SafetyVerdict::ExternalForceLimit exists in
    # the enum but is raised NOWHERE in the server, so do not count on it.
    min_m: [0.300, -0.400, -0.400]
    max_m: [1.100, 0.400, 0.590]
    # runtime_* is the envelope a RUNTIME SetRoiBounds may move the box within, and it
    # is what rb_gui derives its slider limits from. z_min was -0.2 m, so the GUI could
    # not be dragged below -200 mm while laying the box out. Widened to -1.0 m
    # (operator, 2026-09-03). This does NOT move the enforced box -- min_m/max_m above
    # are unchanged; it only widens where the operator is allowed to put it.
    runtime_min_m: [-0.6, -1.2, -1.0]
    runtime_max_m: [1.6, 1.2, 1.6]
    fail_policy: clamp_hold
    monitor_only: false   # real enforce: 박스 면에서 velocity-damper 감속/홀드
    # real anti-chatter 튜닝 (floor_constraint real과 동일: 기본 sim 4.0/0.05).
    # 면 접근 시 √(2·a_brake·margin)로 감속 — a_brake↓ + 밴드↑ = 가장자리 jerk↓.
    # 2026-09-04: 3.0/0.06 → 0.5/0.08. 3.0에서는 제동 거리 v²/(2a)가 40 mm/s에 0.3 mm,
    # 150 mm/s에 3.8 mm라 정책 속도에서 면은 사실상 벽이었다(진입 틱 3,000~9,385
    # deg/s²). 0.5면 150 mm/s가 22 mm, 250 mm/s가 63 mm에 걸쳐 감속하고, 밴드 끝
    # 80 mm에서의 상한은 283 mm/s라 밴드 밖 정상 동작은 건드리지 않는다. 면에서의
    # 정지·탈출 자체는 팔로워 출력 fold(dual_arm_servo_loop.cpp "THE ROI / FLOOR
    # FOLD")가 맡고, 이 행은 그 백스톱이다.
    a_brake_m_s2: 0.5
    d_slow_m: 0.08
    # Engage/release hysteresis on the face rows: engage < d_slow, release only
    # >= d_slow + hyst. 2026-08-26: measured 6 RoiViolation entries in 0.6 s
    # (~10 Hz on/off toggling at the band edge) — this is the knob that breaks
    # that limit cycle, now actually read by the row builder.
    hyst_m: 0.010
    # floor_constraint와 동일한 PIKA 그리퍼 팁 4점. offset_closed_m으로 그리퍼
    # 개폐를 실측 개방률 선형 보간(floor_constraint 주석 참조). 박스 6면 체크는
    # 팔당 5점(TCP+팁 4)을 사용하며, 각 면은 보간된 점들 중 가장 노출된 점에 binds.
    tcp_offset_points:
      - { name: gripper_tip_a_yp, offset_m: [ 0.058,  0.012, 0.0 ], offset_closed_m: [ 0.010,  0.012, 0.0 ] }
      - { name: gripper_tip_a_yn, offset_m: [ 0.058, -0.012, 0.0 ], offset_closed_m: [ 0.010, -0.012, 0.0 ] }
      - { name: gripper_tip_b_yp, offset_m: [-0.058,  0.012, 0.0 ], offset_closed_m: [-0.010,  0.012, 0.0 ] }
      - { name: gripper_tip_b_yn, offset_m: [-0.058, -0.012, 0.0 ], offset_closed_m: [-0.010, -0.012, 0.0 ] }
  # REACH SHELL (2026-08-26, enabled as the workspace-boundary BACKSTOP). No layer
  # bounded an out-of-reach Cartesian command: the ROI box corners sit ~1.0 m from
  # the mount, beyond the measured raw tcp-frame envelope (~1.088 m), so a policy
  # commanding past reach walked the arm into full extension with IK saturating at
  # the boundary. The interior joint-limit failures stay owned by the barrier + IK
  # pinned-final acceptance (see the NOTE above); this shell only brakes the RADIAL
  # closing speed to zero at r_max (sqrt(2*a_brake*margin)), slides tangentially,
  # and never limits retreat. r_max/r_min are the measured envelope minus margin
  # (tools/reach_envelope.py; defaults documented in config.hpp).
  reach_constraint:
    enable: true
    # 2026-09-02 remeasured for RB5-850E with tools/reach_envelope.py on the tracked
    # rb5_850e.urdf (300k FK samples): raw radius [0.1406, 1.2826] m, recommended
    # r_min 0.1706 / r_max 1.2526 at the 0.03 m margin. Rounded the conservative way.
    # The RB3 pair was 1.050 / 0.130 against a ~1.088 m raw envelope.
    # 2026-09-04: 1.250 -> 0.980. The geometric envelope is not where the arm stops
    # being usable: on the RB5 the IK's min singular value falls below
    # singular_region_eps (0.10) at ~0.95 m from the base (measured 0.108 @ 0.951,
    # 0.093 @ 0.969, 0.075 @ 0.981, 0.054 @ 0.994 m, right arm, 2026-09-04) with the
    # elbow at -19..-25 deg, and every "reach" tremor of the day was that region, not
    # the shell (which never engaged: max radius reached 0.994 m vs engage 1.19 m).
    # 0.98 with d_slow 0.06 brakes from 0.92 m so the elbow-straight singularity is
    # approached slowly and left freely (radial closing speed only), while the
    # policy's working radius (<= 0.96 m) is untouched. Wrist singularities happen at
    # any radius (0.84 m measured) and are NOT covered by this shell.
    #
    # 2026-09-04 (evening): 0.980 -> 1.050. THE CLAIM ABOVE THAT "the policy's working
    # radius (<= 0.96 m) is untouched" WAS WRONG, and the operator hit it the same
    # night in UMI teleop. 0.980 turned the shell into a DOME over the table: the
    # shoulder sits at stand z +0.570, so descending at a fixed x/y IS an increase in
    # radius, and the enforced z floor rises with x (TCP-point: -0.178 at x 0.80,
    # -0.080 at x 0.90, +0.053 at x 1.00; the gripper tip takes another 30-58 mm).
    # Measured on the left arm across servo_log_20260904_2144/2146/2157: 11-21% of
    # ticks inside the engage band, and SEVEN episodes where the operator's descent
    # was simply refused - 31, 37, 38, 44, 46, 46 mm, and one 7.14 s hold at x 0.952
    # where goal_z 0.000 met act_z +0.081 (81 mm) with r pinned at 0.9514 to four
    # decimals and projection_constraint_count == 1 (this shell, alone).
    # IT WAS NOT PROTECTING ANYTHING THERE: min singular value through those episodes
    # read 0.125-0.192, comfortably above singular_region_eps (0.10), with zero IK
    # timeouts. The 0.95 m numbers above were measured on the RIGHT arm at elbow
    # -19..-25 deg; conditioning is a function of CONFIGURATION, not radius, so a
    # sphere cannot separate the two and 0.980 priced the healthy poses out.
    # 1.050 (= the config.hpp default, and the old RB3 pair) clears the place pose
    # that was blocked: it needs r_tcp 0.995 with the binding tip ~28 mm beyond, so
    # ~1.023 - leaving ~27 mm of headroom, and the raw RB5 envelope is 1.2826.
    # WHAT THIS GIVES UP: the band now engages at 0.990, so the elbow-straight
    # sigma < 0.10 region at ~0.95-0.99 m is NO LONGER braked by this shell. That
    # region is real; it is just not this layer's to catch. Until the sigma_min gate
    # lands (the proper fix - a conditioning gate, not a radius one) the interior is
    # owned by the IK's own singular_region_eps damping and the joint-limit barrier.
    #
    # ---- 2026-09-04 (late): 1.050 -> 1.150. THIS SHELL IS NOW A GEOMETRIC BACKSTOP,
    # NOT A SINGULARITY GUARD. ----------------------------------------------------
    # 1.050 still bound: in servo_log_20260904_225810 it took 82% of all blocked ticks
    # (2589 of 3140), holding r_far pinned at 1.0500 to four decimals while the
    # operator asked for another 37-46 mm of descent at x 0.90-0.99. Measured, the
    # deepest place target needs r_far 1.0863 (r_tcp 1.0732 + a 13.1 mm binding tip);
    # with d_slow 0.06 the shell must sit at >= 1.146 for that pose to be reached
    # without the damper eating the last of it. 1.150 rounds that up and is still
    # 133 mm inside the measured raw envelope (1.2826).
    #
    # THE REASON THIS IS THE RIGHT DIRECTION, not just a bigger number: a sphere
    # cannot separate "far" from "badly conditioned". Over r_tcp in [0.92, 0.98] --
    # ONE radius band -- sigma_min measured 0.005 (servo_log_20260904_215740, 11.2%
    # of that band under 0.10) and 0.141-0.143 minimum (the 2222/2258 runs, 0.0%
    # under 0.10). Same shell, order-of-magnitude different conditioning. At 0.980 it
    # was pricing out healthy poses; at any radius it lets a genuinely singular one
    # through. So it stops pretending: the shell now guards only the geometry (past
    # here IK has no solution and the arm walks into full extension), and the
    # conditioning problem goes to the sigma_min projection row being designed
    # separately. Until that row lands, sigma is owned by singular_region_eps (0.10),
    # singular_step_scale (0.17 -> 0.11) and the SMD singularity_scale ladders.
    r_max_m: 1.150
    r_min_m: 0.175
    fail_policy: clamp_hold
    monitor_only: false
    a_brake_m_s2: 0.5     # 2026-09-04: with roi_box (was 3.0); 150 mm/s brakes over 22 mm
    d_slow_m: 0.06
    tcp_offset_points:
      - { name: gripper_tip_a_yp, offset_m: [ 0.058,  0.012, 0.0 ], offset_closed_m: [ 0.010,  0.012, 0.0 ] }
      - { name: gripper_tip_a_yn, offset_m: [ 0.058, -0.012, 0.0 ], offset_closed_m: [ 0.010, -0.012, 0.0 ] }
      - { name: gripper_tip_b_yp, offset_m: [-0.058,  0.012, 0.0 ], offset_closed_m: [-0.010,  0.012, 0.0 ] }
      - { name: gripper_tip_b_yn, offset_m: [-0.058, -0.012, 0.0 ], offset_closed_m: [-0.010, -0.012, 0.0 ] }
  # User-defined TILTED floor plane (viser "User Safety Floor"). enable=true라야
  # viser Send가 허용된다(서버가 enabled 보고). 초기 평면은 비워둠(has_initial_plane
  # false) → viser에서 양팔 접촉점 ≥3 캡처 후 Fit & Apply 하기 전까지는 inert.
  # 런타임 SetUserSafetyFloorPlane은 검증됨: 단위 법선 + max_tilt_deg 이내(n.z>0) +
  # point z ∈ [runtime_min/max_point_z_m] + margin ∈ [0, max_margin_m].
  # stand floor와 독립·가법(둘 다 켜지면 더 엄격한 쪽이 이긴다).
  # tcp_offset_points 없음(의도적): viser 캡처가 측정 TCP 원점(tcp_actual_stand,
  # freedrive 추종)을 쓰므로 enforce도 TCP 원점 기준이어야 캡처-집행이 같은 공간에
  # 있다. 팁이 바닥 닿을 때의 TCP 원점 자취 = 평면 → "TCP 원점이 평면 위" = "팁이
  # 실제 바닥 위". 팁 자체의 수평 backstop은 stand floor가 계속 담당.
  # THE WALL BRAKE ON THE POSE-TRACK PATH (2026-09-04 pm). A streamed absolute
  # target (UMI teleop) through the pose-track SMD does not know about the reach
  # shells, the ROI box or the floors: measured on servo_log_20260904_225810.csv
  # (9 episodes), the tracker kept integrating past the shell while the joint-space
  # row held the joints, the reference ran 48 mm ahead, the 50 mm re-anchor snapped
  # it back, and the row's first cut of the un-braked command was a 7.9-9.6k
  # deg/s^2 kick. Here the tracker itself caps its approach speed at
  # sqrt(2 a_brake d) against every enabled wall (each wall's own a_brake_m_s2 /
  # d_slow_m) and holds its state standoff_m inside the wall - the same law the
  # rows enforce, applied one stage earlier, so the rows never have to cut and no
  # re-anchor trips. The rows stay as the backstop. The chunk follower has its own
  # fold (roi_fold, 2026-09-04 am); this is the absolute-target path's equivalent.
  pose_track_wall_fold:
    enable: true
    standoff_m: 0.002
  # THE HOLD FOLD ON THE CHUNK-FOLLOWER PATH (2026-09-05). While a projection row
  # (self-collision, ROI face, reach shell, floor) or the IK branch-jump throttle
  # holds an arm, book the WHOLE shortfall between the emitted plan pose and the
  # pose the arm was actually commanded to into the plan every tick. MEASURED on
  # the bimanual rollouts of 2026-09-04 23:40-23:54: the am collision fold booked
  # only what the rows removed, the velocity/acceleration clamps' share stayed
  # unbooked, the plan ran 12-39 mm ahead of the arm, and the IK's
  # branch_jump_rate_limited tick on that runaway target was a 7.1-12.0k deg/s^2
  # kick in 11 of 11 episodes (every episode with a gap under 1 mm stayed under
  # 850). Above max_step the shortfall is a snap, not a hold: declined and logged.
  hold_fold:
    enable: true
    min_step_m: 1.0e-5
    min_step_rad: 1.0e-5
    max_step_m: 0.03
    max_step_rad: 0.2
    on_ik_throttle: true
  user_floor_constraint:
    # 2026-07-09 (ft branch): DISABLED — floor_constraint와 같은 이유(모델 관측
    # velocity 훼손 방지, FT 센서로 대체). viser Fit & Apply Send는 거부된다.
    enable: false
    max_tilt_deg: 35.0
    runtime_min_point_z_m: -0.2
    runtime_max_point_z_m: 0.5
    max_margin_m: 0.2
    fail_policy: clamp_hold
    monitor_only: false
    a_brake_m_s2: 3.0
    d_slow_m: 0.03
  self_collision:
    enable: true
    fail_policy: clamp_hold
    # mesh(URDF) self-collision을 실제 차단으로 사용. 캡슐 경로는 미평가(기능 보존).
    # 2026-06-19: real에서도 enforce 활성화 + clamp_hold(충돌 방향만 직전 안전자세로
    # 홀드, 비충돌/후퇴 방향은 계속 이동 가능, 비래치 → ResetFault 불필요). sim과 동일.
    monitor_only: false
    # URDF mesh self-collision (async monitor, servo_j 2ms 경로 밖) + 공통 velocity
    # barrier. enable=true면 아래 캡슐 필드는 평가하지 않음(폴백용 보존). 파라미터는
    # closing speed로 자동 적응. d_hard 미만 hard breach 또는 verdict stale -> fault_latch.
    mesh:
      # 2026-09-02, RB3-730E -> RB5-850E. Now a TRACKED asset in this repo, not the
      # sibling mo_robot_descriptions checkout: it is generated from upstream's ver2 by
      # rb_servo_server/tools/make_rb5_850e_urdfs.py, which enforces the three things
      # upstream does not (convex collision shells, the +/-165 deg elbow bound, and
      # 100%-coverage stand hulls in place of boxes that covered 77%). Keeping the file
      # here means those safety-relevant edits are visible in this repo's diff and the
      # server does not depend on a sibling checkout's branch state.
      # NOTE for docs/code_architecture_map.md item 7, which still says the unified URDF
      # is an untracked external asset -- that is now false for RB5.
      unified_urdf: "descriptions/urdf/dual_rb5_850e_ver3.urdf"
      package_dirs:
        - "rb_servo_server/descriptions/urdf"
      # Link-name prefixes in the unified URDF. MUST be set explicitly: config.hpp
      # defaults them to dual_rb3_730e_*, and with an RB5 URDF that mismatch used to
      # degrade silently (ancestry classification off, which is what picks the
      # arm<->arm vs intra-arm d_hard_m floors) or read past the end of the frame
      # vector in the gripper attach. Both now fail closed in collision_monitor.cpp.
      left_prefix: "dual_rb5_850e_left_"
      right_prefix: "dual_rb5_850e_right_"
      pika_gripper_mesh: "rb_servo_server/descriptions/meshes/robots/rb5_850e/visual/tool/pika_gripper_hull.STL"
      # 2026-06-26: ARTICULATED gripper collision — static base hull + two movable finger
      # hulls (convex hulls of the visual STLs) attached at attachment_site (identity, no
      # +90° Z), the fingers tracking the live jaw open percent via setGripperOpenPercent
      # (mirrors rb3_730e_pika_articulated.urdf). Takes precedence over pika_gripper_mesh.
      # Remove these three to fall back to the single static hull above.
      # 2026-06-30 SAFETY FIX: these MUST be precomputed CONVEX HULL meshes (*_hull.STL),
      # not the raw visual STLs. coal's buildConvexRepresentation does NOT compute a hull
      # (it just reuses the mesh points) and this coal build lacks qhull, so a non-convex
      # mesh becomes an INVALID Convex whose GJK distance is garbage (gripper base<->base
      # read 125 mm at a pose where the true clearance was ~21 mm), silently disabling the
      # gripper<->gripper self-collision guard. The arm/stand link*_hull/stand_hull meshes
      # are already convex; only the gripper meshes were raw. (See selfcollision memory.)
      pika_gripper_base_mesh: "rb_servo_server/descriptions/meshes/robots/rb5_850e/visual/tool/pika_gripper_base_hull.STL"
      pika_finger_left_mesh: "rb_servo_server/descriptions/meshes/robots/rb5_850e/visual/tool/pika_finger_left_hull.STL"
      pika_finger_right_mesh: "rb_servo_server/descriptions/meshes/robots/rb5_850e/visual/tool/pika_finger_right_hull.STL"
      # 2026-09-04: 0.047 -> 0.049, MEASURED. The full-open gap between the two TPU tip
      # faces is 98.0 mm by caliper and the jaws close to contact, so each finger runs
      # 49.0 mm. 0.047 was never measured -- it was picked so the vendor CAD's finger
      # pose would close to zero gap, and that pose is 3.8 mm/side inboard of the real
      # open stop. The finger hulls above are now baked AT the open stop to match, so
      # both ends of the travel are right rather than only the closed one.
      gripper_finger_travel_m: 0.049
      stand_ignore_arm_substrings: ["link0"]
      debug_pair_curation: true
      disabled_collision_pairs:
        # Structural adjacent/base false-positive pairs. Verify these in the
        # Viser collision overlay before real operation; do not replace this with
        # a global d_hard_m or InitMotion planner margin reduction.
        - ["*left*link0*", "*left*link1*"]
        - ["*right*link0*", "*right*link1*"]
        - ["*left*link0*", "*left*link2*"]
        - ["*right*link0*", "*right*link2*"]
        # compact wrist structural false-positive: measured overlap 0%, always
        # near 19-25mm and inside d_slow. Distal gripper hull pairs still cover
        # downstream collisions from link6/attachment_site.
        - ["*left*link4*", "*left*link6*"]
        - ["*right*link4*", "*right*link6*"]
      # 2026-09-05: arm<->arm and arm<->gripper floor 25 -> 40 mm, band 67 -> 90 mm
      # (operator request after the bimanual runs of 2026-09-04: the links came to
      # the 25 mm floor, measured min 24.7 mm). gripper_gripper below keeps the OLD
      # 25/67 explicitly so handovers do not tighten with this. Braking:
      # sqrt(2 * 3.0 * 0.050) = 0.55 m/s of closing speed, above the TCP ceiling.
      d_hard_m: 0.040
      # Slow-zone must satisfy d_slow >= d_hard + v_max^2/(2*a_brake) so the barrier
      # can brake a head-on approach at the command ceiling before the hard floor.
      # 2026-08-26: THIS INVARIANT WAS BEING VIOLATED, and the comment below it had gone
      # stale. It was written for d_slow 0.035 / a_brake 4.0 / v_max 0.32; the live
      # values had since become d_slow 0.030 / a_brake 3.0, and the TcpPoseTarget profile
      # flow-infer runs (flow_infer_smooth) commands max_linear_velocity_m_s 0.50. The
      # requirement is therefore 0.025 + 0.50^2/(2*3.0) = 0.0667 m, so 0.030 was short by
      # more than 2x: the barrier had a 5 mm slow zone and physically could not brake the
      # commanded ceiling before the hard floor. Measured consequence on
      # servo_log_20260826_042818.csv at 04:29:31 KST: the right arm went straight to
      # 25.18 mm -- d_hard to three decimals -- and the directional projection only got to
      # act on 24 of 801 ticks (3%), removing a mean of 5.9 deg/s, while the non-
      # directional joint clamps did the work on 394 of 801 ticks (49%) at up to
      # 1050 deg/s. Widening does NOT slow normal motion: the barrier's allowance is
      # sqrt(2*a_brake*margin), which at the new outer edge is 0.50 m/s, i.e. exactly the
      # command ceiling and thus inert until the arm is genuinely closing.
      # 2026-06-19 rationale for the old value ("wider slow zone reduces boundary
      # chatter") is unchanged and still argues for the wider zone, not the narrower one.
      d_slow_m: 0.090
      a_brake_m_s2: 3.0  # softer braking ramp near collision boundary
      hyst_m: 0.010      # 2026-06-19 anti-chatter: 0.005→0.010 (break on/off limit-cycle toggle)
      latency_s: 0.003   # small cushion for verdict/telemetry jitter without aggressive chatter
      # Intra-arm-only margin. Arm<->arm and arm<->stand keep the self values above.
      # Normal operating intra-arm clearances measured >=27mm; true near-contact is
      # retained at full link2<->link4 elbow fold, so 5/15mm catches real fold risk
      # without triggering on compact wrist constant-near geometry.
      intra_arm:
        d_hard_m: 0.005
        d_slow_m: 0.015
        a_brake_m_s2: 3.0
      swept_samples: 2          # 1=endpoint only; >=2 swept-volume (catches tunneling)
      check_intra_arm: true     # arm folding onto itself (non-adjacent links)
      max_staleness_s: 0.050
      # 2026-08-26: 8 -> 16, required by the d_slow_m widening above. `near` is the K
      # globally NEAREST pairs, chosen independently of d_slow, and only pairs in that
      # set can produce a barrier constraint. With a 67 mm zone an arm<->stand pair at
      # 50 mm now has to compete for a slot with the structural intra-arm pairs that sit
      # around 27 mm all run (they are outside their own 15 mm intra-arm zone, so they
      # consume slots without ever constraining anything). Cost is per-pair Jacobians in
      # the ASYNC monitor thread, off the servo_j path.
      max_near_pairs: 16
      # 2026-07-02: OS 배정(-1)으로 전환. 이전(2026-06-19)에는 전용 코어(4)에 핀했으나,
      # 이제 커널 isolcpus=3로 servo 코어가 스케줄러 도메인에서 제외되어 OS가 collision
      # 스레드를 cpu3에 올릴 수 없음 — tools/rt_core_isolation.sh 적용(재부팅) 후에만 -1이 안전.
      # 2026-09-04: cpu4, SCHED_FIFO 50. The monitor was the only safety-critical
      # thread with no core and no RT priority (CFS among the GUI, the runner and the
      # policy servers, max_staleness_s absorbing the jitter); it is now event-driven
      # (one evaluation per submitted target, ~1.5 ms) instead of a busy loop. cpu4
      # is added to the kernel isolation set (tools/rt_core_isolation.sh: isolcpus
      # 1-4; camera_server moved to 5-7). The loader refuses this core if it equals
      # servo.cpu_core or a worker core, and refuses a pin without a priority.
      monitor_core: 4
      monitor_realtime_priority: 50
      # Gauss-Seidel: sweep until converged (tol) rather than 3 fixed sweeps whose
      # answer depended on the noisy row order.
      projection_max_sweeps: 50
      projection_tol_rad_s: 1.0e-6
      # The nine cross-arm gripper-hull pairs as their own class. Margins inherit
      # the self set (unset). exclude_when_force_covered: while force control
      # covers BOTH arms the rows are not built (the handover contact belongs to
      # the F/T sensor); any coverage loss restores the margins on that tick, and
      # inside the floor that means no deeper, opening free -- never a latch.
      gripper_gripper:
        exclude_when_force_covered: true
        # 2026-09-05: pinned at the pre-2026-09-05 self values (they used to inherit
        # 25/67). NOT tightened to "exact" yet: seven real gripper-gripper contacts on
        # 2026-09-04 (mirror F/T forces, cos 0.89-1.00) happened while THIS model
        # reported 18-29 mm of clearance, so the model's relative gripper pose is
        # off by ~20 mm at the rail ends and an exact check would let them touch.
        d_hard_m: 0.025
        d_slow_m: 0.067
        a_brake_m_s2: 3.0
        hyst_m: 0.010
      # 항목 6: URDF에 없는 collision geometry(손목 카메라/케이블/작업 테이블)를
      # 추가 검사. 팔 프레임에 붙이면 그 팔로 자동 분류(좌/우), stand/world면 정적
      # 장애물로 양팔과 페어링. shape: box|sphere|capsule|cylinder.
      # TODO(operator): 실제 치수/장착 오프셋으로 채운 뒤 주석 해제할 것(추측값 금지).
      extra_collision: []
      #   - { name: left_wrist_camera,  shape: box, parent_frame: dual_rb3_730e_left_attachment_site,
      #       size_m: [0.07, 0.10, 0.04], xyz_m: [0.0, 0.05, 0.05], rpy: [0,0,0] }
      #   - { name: right_wrist_camera, shape: box, parent_frame: dual_rb3_730e_right_attachment_site,
      #       size_m: [0.07, 0.10, 0.04], xyz_m: [0.0, 0.05, 0.05], rpy: [0,0,0] }
      #   - { name: work_table, shape: box, parent_frame: stand,
      #       size_m: [1.2, 0.8, 0.04], xyz_m: [0.0, -0.2, 0.0], rpy: [0,0,0] }
      external_boxes:
        # 2026-07-09 (ft branch): DISABLED — 박스 keep-out barrier 감속이 모델 관측
        # velocity를 훼손함(FT 센서 접촉 감지로 대체). enable: false면 box-feed
        # (SetExternalBoxes) startup 요구 + stale-feed watchdog도 함께 사라진다.
        enable: false
        max_count: 2
        size_m: [0.380, 0.240, 0.105]
        margin_m: [0.000, 0.000, 0.020]   # per-axis [x,y,z] box-local; x,y=SIDE, z=HEIGHT.
                                          # side 0mm + d_hard 5mm = ~5mm side keep-out;
                                          # height 20mm + d_hard 5mm = ~25mm top/bottom keep-out.
        monitor_only: false    # ENFORCE (real): velocity-damper decel/hold at the box surface
        stale_timeout_s: 0.5
        stale_policy: hold
        # BOX-ONLY keep-out barrier (SEPARATE from the floor's `external:` set below).
        # 2026-07-02 TIGHTER keep-out: shrunk from the wide 2026-07-01 zone now that
        # box-position estimates are trusted closer — height margin 40→20mm, d_hard 10→5mm,
        # d_slow 80→20mm. Slow-zone width d_slow−d_hard = 15mm still satisfies the invariant
        # d_slow ≥ d_hard + v_max²/(2·a_brake): with a_brake=6, v_max(0.32–0.40) needs
        # ≤18.3mm, so it still brakes the command ceiling (√(2·6·0.015)=0.42 m/s).
        # TRADEOFF: this drops the extra teleop-overshoot margin the 80mm zone gave
        # (that braked ~0.92 m/s); recover>0 still ejects if a fast approach penetrates.
        barrier:
          d_hard_m: 0.005          # hard floor (never cross); + margin 20mm = ~25mm from real box
          d_slow_m: 0.045          # wider slow zone: softer approach to external boxes
          a_brake_m_s2: 2.5        # softer braking reduces limit-cycle vibration near boundary
          hyst_m: 0.010            # larger hysteresis suppresses brake/release toggling from noisy box estimates
          recover_speed_m_s: 0.000 # avoid active push-out limit cycles; command away from boundary instead
          latency_s: 0.015
      # WHOLE-ARM floor: a large thin static box (world frame) so the SAME mesh
      # barrier that guards arm<->arm / arm<->stand also keeps EVERY arm link above
      # the floor (floor_constraint only checks the TCP + offset points, so an
      # elbow/wrist can dip below it). Top face at z_m == floor_constraint.z_min_m
      # (the measured table surface), so the two floors agree. The InitMotion planner
      # avoids this box too.
      ground_plane:
        # 2026-07-09 (ft branch): DISABLED — whole-arm 바닥 박스도 external barrier
        # 감속원이므로 플로어들과 함께 끔(모델 관측 velocity 보존, FT 센서로 대체).
        # InitMotion planner 오라클에서도 빠짐 — 팔꿈치/손목의 테이블 하강은 이제
        # arm<->arm / arm<->stand self-collision만 막는다.
        enable: false
        # z_m: 0.001             # startup/fallback top face (used until a floor drives it)
        z_m: 0.0005             # startup/fallback top face (used until a floor drives it)
        size_m: [4.0, 4.0]      # lateral extents [Lx, Ly]
        thickness_m: 0.10
        parent_frame: world
        # 2026-06-26: whole-arm floor now TRACKS the operator's active viser floor
        # instead of a fixed z_m: User Safety Floor plane when it is active, else the
        # Stand Safety Floor (horizontal at its runtime z), else OFF (box parked far
        # below, inert) when neither is active. So disabling both floors in viser also
        # drops the whole-arm floor — the gripper/links can then descend to the table
        # (limited only by arm<->arm / arm<->stand self-collision). The InitMotion
        # planner keeps its own static copy (z_m above) and stays conservative.
        # NOTE: a large User-floor tilt + this 4x4 m box raises the far edges; keep the
        # captured user floor near-level or reduce size_m if links sit far off-center.
        follow_safety_floors: true
      # 2026-06-26: EXTERNAL collision (arm<->floor/ground_plane) is now its own category,
      # separate from robot self-collision (arm<->arm / arm<->stand). It uses this barrier
      # set instead of the self d_hard above, so the gripper can approach the floor closer
      # (3 mm) than the robot keeps from itself (7 mm). The InitMotion planner applies the
      # same external d_hard to floor pairs (vs self pairs at the self margin).
      external:
        d_hard_m: 0.0035
        d_slow_m: 0.015
        a_brake_m_s2: 2.0
        hyst_m: 0.010
        recover_speed_m_s: 0.0
        latency_s: 0.006

  # Collision-free InitMotion planner (requires self_collision.enable — the mesh
  # model is the planner's collision+floor oracle). A JointTarget init_motion profile command
  # plans a collision-free + floor-safe 12-DOF (both arms) RRT-Connect path to the
  # init pose and streams it through the safety gate, so InitMotion REACHES the pose
  # from any start without self-collision or dipping below the floor (overlapping arm
  # paths allowed). Fail-closed: planning failure holds. Disabled -> direct JointTarget.
  init_motion_planner:
    enable: true
    max_planning_time_sec: 5.0
    max_iterations: 20000
    step_size_rad: 0.20
    edge_resolution_rad: 0.02
    goal_bias: 0.25
    shortcut_passes: 200
    sample_margin_deg: 60.0        # tight band 기본 확대
    sample_margin_deg_per_joint: [45, 75, 75, 45, 75, 30]  # J2/J3/J5 넓게, J6 좁게(케이블)
    global_sample_fraction: 0.15   # 15% wide-band 글로벌 샘플
    global_sample_margin_deg: 150.0
    collision_margin_m: 0.005
    seed: 12345
    waypoint_tol_deg: 1.5
    # 2026-09-04: "done" waits for the SENT stream to settle to this speed inside the
    # tolerance. The arrival taper floor is 3 deg/s (joint_target_smd.arrival_min_speed_deg_s),
    # so 3.5 = "the taper reached its floor": the stop that remains is 3 deg/s at ddq_max
    # instead of the 10-11 deg/s one-tick stop measured on every InitMotion (5,150 deg/s^2).
    done_max_speed_deg_s: 3.5
    noop_tol_deg: 0.75              # 이미 init 자세 근처면 불필요한 escape wiggle 없이 no-op 완료
    max_segment_deg: 3.0
    execution_lookahead_deg: 6.0    # smaller = smoother/slower InitMotion streaming; done uses measured joints
    execution_timeout_sec: 45.0     # once started, drive to completion across command staleness (one click); give up after this
    # 2026-08-19 brake-before-plan: 정책 스트리밍 중(또는 a→c 연타로 실행 중인 init을 재계획할 때)
    # InitMotion이 들어오면 예전엔 송신 목표를 즉시 측정 관절로 스냅+Hold했다 → 추종 지연만큼
    # 0.2~0.7°를 한 틱(2ms)에 역행(송신속도 100~350°/s 스파이크, 손목 F/T 8~26N, 툴 9.5Hz 링잉;
    # servo_log_20260819_085404 t=130.94/152.28). 이제 선택된 팔이 움직이는 중이면 마지막 송신 목표에서
    # joint_target_smd 프로파일로 단조 감속(goal=q+dq/wn, 역행 없음)한 뒤 정지 상태에서 측정 재앵커+계획.
    # 정지 상태에서 누른 경우는 기존 경로 그대로. 끄려면 brake_before_plan: false.
    brake_before_plan: true
    brake_enter_deg_s: 1.0          # 선택 팔 중 한 관절이라도 송신속도가 이보다 크면 감속 먼저
    brake_exit_deg_s: 0.5           # 모든 선택 관절 송신속도가 이 아래면 감속 완료 → 계획
    brake_timeout_sec: 0.75         # 감속 상한(그래도 안 멈추면 그냥 계획; 정상은 ~0.2~0.3s)
    brake_max_travel_deg: 3.0       # 관절당 dq/wn 정지거리 상한
    # 2026-09-04: planning은 측정 관절에서 하되, 명령 스트림(prev_sent)은 측정과의
    # 차이가 이 값 이상일 때만 측정 관절로 스냅한다. 그 아래면 추종 잔차(정지 시
    # 0.02~0.03°)일 뿐이라 스트림을 잇고 joint_target SMD가 첫 웨이포인트로 가며
    # 흡수한다. 실측: 스냅 한 틱에 4.7~6.7k deg/s² (InitMotion 전체 최대 가속). 0 = 항상 스냅.
    command_reanchor_deg: 0.5

network:
  command_bind: "udp://127.0.0.1:50256"
  # Ruckig chunk-follower ingest: whole action-chunk frames (the flow-infer
  # chunk-overlay packet, fanned out here in addition to the GUI's 50262 and
  # the scope dashboard's 50263 — 50263 belongs to servo_scope_dashboard.py
  # (DEFAULT_CHUNK_LISTEN), do NOT bind it here or the dashboard starves).
  # Dedicated socket — NEVER the lease-gated command_bind — so the 500 Hz
  # command stream cannot starve the ~1-2 Hz chunk feed.
  chunk_frame_bind: "udp://127.0.0.1:50264"
  state_pub_endpoints:
    - "udp://127.0.0.1:50356"  # joint scope dashboard
    - "udp://127.0.0.1:50366"  # viser GUI
    - "udp://127.0.0.1:50376"  # make run teleop_mux policy_runner
    - "udp://127.0.0.1:50378"  # external flow-infer readback alongside make run
  state_pub_rate_hz: 100   # default publish rate for gui/scope/policy/flow/camera consumers. Temporarily raise to 500 only for PlotJuggler 500 Hz command-stream debugging (watch send_period_overrun / send_deadline_hit).
  command_source_allowlist: ["127.0.0.1/32"]

# Forward arbitrated per-arm gripper setpoints to the out-of-process gripper_server
# and stamp gripper_state.v1 feedback into the published state JSON (viser gripper
# viz). Launched by tools/run_stack.sh.
gripper:
  enable: true
  command_endpoint: "udp://127.0.0.1:50410"   # -> gripper_server command bind
  feedback_bind: "udp://127.0.0.1:50420"       # <- gripper_server state publish
  # 2026-07-31: MEASURED, not estimated. An in-process probe
  # (gripper_server --latency-probe) plus a bridge->server packet-age measurement
  # decomposed the gripper command chain with matched clocks:
  #     bridge send -> server accept   5.0 ms  (p99 10.0, max 12.0)
  #     server queue (loop + max_hz)   0.1 ms
  #     actuator (serial + motor)     24.4 ms
  #                                   ------
  #                                   29.5 ms total
  # A 50 -> 100 Hz experiment on this key changed nothing, which the 5 ms bridge
  # term explains: the stage was never a bottleneck. Reverted to 50. For the same
  # reason gripper.max_hz (60) is NOT worth raising -- server queueing is 0.1 ms.
  #
  # The apparent 104 ms in the rollout-step log was that log's own 34.7 ms policy
  # grid; and the real failure ("jaw closes while lifting") is upstream of all of
  # this -- the model issues the close 700-1040 ms AFTER the descent bottoms out,
  # 23-35x the entire actuation chain, so no rate change or feed-forward shift
  # addresses it.
  forward_rate_hz: 50

command_source:
  enforce_lease: true
  lease_timeout_sec: 60.0

# Rainbow control-box command-queue regulation (fw v8.7.3 schedules streamed
# servo_j from a FIFO, so box dead time == queue fill; measured dead time =
# RBACK fill + 1 tick). Unregulated, the queue grew +0.67 ticks/s (+1.33 ms/s)
# without bound: 19 -> 29 ticks in 15 s, ~217 ticks extrapolated at 5 min.
# Holding the fill at target_fill is what makes the box delay a constant.
# Gains are controller-manager's Arm::qsync_step, used as-is (same actuator).
queue_sync:
  # Takes effect only with servo.io_model=worker (the loop cannot trim a per-arm
  # period). Measured 2026-08-25 with the LPF off: box delay == RBACK fill + 1
  # tick exactly, and the fill drifts +0.65 tk/s unregulated. Holding it at
  # target_fill is what makes the box delay a constant: 5 + 1 = 6 ticks (12 ms).
  enable: true
  # Hold each arm's motion (decel-ramped at prev_sent, plan frozen) while its
  # qsync phase is warmup/drain, releasing on track. Measured 2026-08-26
  # (review_request_2026-08-26/README.md §4): the stream arms on the FIRST
  # motion command, so warmup 0.4 s + drain 0.2 s (trim 200 us = 8.85 % of
  # setpoints dropped = ~44 doubled-step impulses/s) overlapped real motion at
  # every stream start. Cost: the first commanded motion of a run starts ~0.6 s
  # late (bounded by warmup_max + drain_timeout in the worst case).
  # The hold pins the OUTPUT, so every plan that is paced by the realized step
  # (chunk follower, via plan_gate) or re-planned from prev_sent each tick (the
  # joint-space TrajectoryFilter) freezes with it. The two open-loop stages did
  # NOT, and each had to be stopped explicitly:
  #  - TcpLinearMove's quintic clock is open-loop time. It integrated the whole
  #    hold and discharged the lead as a release lunge (2026-08-27,
  #    servo_log_20260827_211340.csv, left arm: 532 ms pinned, 1.09 deg of accrued
  #    IK lead, +/-60 deg/s in 40 ms, 7,920 deg/s^2 command accel on release).
  #    computeServoTarget now hands that stage dt_sec = 0 for a held arm.
  #  - A streamed TcpPoseTarget (UMI teleop, flow-infer) has no clock to stop at
  #    all: its reference is the operator's hand. The SMD goal integrator accrued
  #    the hold and the filter chased it against the pinned output (2026-08-28,
  #    servo_log_20260828_100832.csv, UMI pedal press: 0.69 s pinned, 6.06 mm of
  #    right-arm lead, released at 99.7 deg/s / 6,068 deg/s^2 on J1 with two
  #    velocity reversals; the left arm's 0.4 mm fired a 34.5 deg/s pulse that
  #    collapsed in 6 ms. BOTH arms release on the same tick, so the operator
  #    feels one two-armed bang). applyPoseTrackSmd now pins the tracker at the
  #    live reference (SmdPoseTracker::holdAt) every held tick, so the release
  #    starts from where the arm is, with zero velocity and an empty goal.
  # NOTE the deliberate asymmetry: teleop lead is DISCARDED, not deferred. There
  # is no safe way to replay 0.69 s of hand motion the arm never made.
  hold_motion_until_track: true
  target_fill: 5

  # ---- THE DIAGNOSTIC BAND (2026-09-03) ---------------------------------------
  # Between "regulating normally" and protect_fill (1, near-empty) there was NOTHING
  # watching, so a queue sagging to 2-4 for seconds was invisible. These two numbers
  # close that, and both are DELIBERATELY SPELLED OUT rather than left to the code
  # default, because the band is the thing an operator reads a run against.
  #
  # *** warn_fill IS NOT DERIVED FROM target_fill, ON PURPOSE. *** controller-manager
  # tied its dip line to the setpoint, then raised the setpoint, and the detector
  # moved onto the regulator's OWN RIPPLE TROUGH and fired forever. A diagnostic must
  # not be tied to the thing it watches. The loader refuses warn_fill >= target_fill
  # for exactly that reason.
  #
  # 4 is one below our measured ripple floor: across 1.5M fresh observations on
  # v8.9.1 (2026-09-03) the fill held 5, with 10 samples at 4 and none below. So this
  # line is silent today and speaks only when something changes.
  warn_fill: 4
  # Consecutive FRESH observations at/below protect_fill before an underrun counts.
  # One sample of an integer scraped out of a TCP stream is not evidence -- CM had
  # exactly one bad sample de-energize a healthy cell. We only count, so what this
  # buys is that the count can be CITED. See docs/reference/queue_sync_review.md.
  underrun_confirm: 3

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

# =============================================================================
# F/T SENSOR + TOOL
#
# EVERY NUMBER HERE WAS MEASURED THROUGH controller-manager ON THIS CELL. Do not
# hand-edit one: re-run CM's own procedure and copy the whole result. The source
# files are
#     submodules/controller-manager/platforms/monkey/params-presets/efts/RFT64-6A01-A.yaml
#     submodules/controller-manager/platforms/monkey/params-presets/tools/pika.yaml
# and CM is the authority for them, because both stacks drive the SAME arm and a
# value that silently disagrees is worse than no value at all.
# =============================================================================
force_torque:
  enable: true
  # Tell the control box the payload is ZERO so it subtracts NOTHING from the F/T
  # output, and compensate the tool here instead. Not sending leaves the box holding
  # whatever the pendant or CM last set — a compensation of unknown size that ours
  # would then run on top of. CM measured that double-compensation as ~20 N.
  #
  # THE COST, ACCEPTED: the box's own collision detection runs on this payload, so
  # with zero it sees the tool's weight as an external force.
  push_zero_payload_to_box: true

  # ---- AUTOMATIC TARE ON InitMotion -----------------------------------------
  # Pressing InitMotion re-zeros that arm's sensor. The operator no longer has to
  # remember a separate tare, which is the failure that leaves force control refusing
  # to cover an arm (or worse, regulating against yesterday's zero).
  #
  # *** IT DOES NOT SAMPLE WHEN THE MOVE STARTS. *** A tare averages `raw - gravity`
  # over 250 ticks (0.5 s), and during the move the arm's own acceleration and the
  # tool's swing land in that average as force. The REQUEST arms it; the samples are
  # taken after the arm reaches the init pose and stands still. In the common case the
  # arm is already parked at the init pose, so the server's no-op path completes
  # instantly and the zero lands ~settle_sec later without any motion at all.
  #
  # THE OPERATOR'S CHECK IS UNCHANGED: whatever load stands at the init pose becomes
  # the new zero. Automatic means nobody pressed the button, not that anybody looked
  # in the gripper.
  auto_tare_after_init_motion:
    enable: true
    # Mechanical settle at the init pose before the first sample. The arrival taper
    # ends with the tool still ringing; 0.5 s is one full tare window of quiet ahead
    # of the tare itself.
    settle_sec: 0.5
    # ... and the command must actually be stopped. Read off the last SENT joint
    # velocity (the surface brake-before-plan uses), not the measured joints, which
    # keep jittering at rest. Same order as init_motion_planner.brake_exit_deg_s.
    max_sent_speed_deg_s: 0.5
    # Drop the old zero the instant InitMotion is requested, so an InitMotion that
    # fails or is cancelled leaves the arm with NO zero and force control refuses it,
    # rather than silently keeping a zero the operator believes was just refreshed.
    invalidate_on_request: true

  left:
    enable: true
    sensor_name: "RFT64-6A01-A"
    tool_name: "pika"

    # flange -> SENSING REFERENCE ORIGIN. Only relates the sensor origin to the
    # flange; it is NOT applied to the reading (the torque is referenced AT the SRO).
    # Matches the URDF ft chain: attachment_site +15 mm (ft_sensor_base) +30 mm
    # (ft_sensor_measurement) = 45 mm.
    sensor_offset_mm: [0.0, 0.0, 45.0]

    # *** THE SENSOR AXES, AS BASIS COLUMNS IN THE FLANGE FRAME. ***
    # det = -1 — the unit reports in a LEFT-HANDED axis set, and that is CORRECT. Do
    # not "fix" it, and do NOT copy the URDF's ft_sensor_base_joint yaw (+90 deg,
    # det +1): that is the nominal MECHANICAL placement and disagrees with this
    # electrical relabel by a sign flip.
    #
    # *** PROVENANCE — READ THIS BEFORE CITING IT AS MEASURED ON OUR ARMS. ***
    # It is not. This value is DERIVED, by two routes that agree:
    #   1. CM's chimpanzee (RB5-850E — our arm) preset carries fx[0,0,-1] / fy[1,0,0]
    #      / fz[0,1,0] in ITS flange frame, from the 2026-07-07 7-pose gravity
    #      calibration (2.055 kg, 0.16 N residual) and the 2026-08-06 tool
    #      identification (0.373 / 0.491 N). Our `attachment_site` is CM's link6
    #      rotated Rx+90 deg, and re-expressing their triad through that gives
    #      exactly the three vectors below.
    #   2. CM's monkey (RB3-730ES) cell converged on these SAME numbers by hand-push
    #      on 2026-08-16 — because the RB3 flange relates to the RB5 flange by the
    #      same Rx(-90 deg) map. That agreement is a useful cross-check and NOTHING
    #      MORE: it is a different robot, and an earlier version of this comment
    #      cited it as if it were our arms.
    # CM's own record lists the push test on BOTH chimpanzee arms as still OWED
    # (findings/the-rft64-sensor-is-left-handed.md, 2026-09-02). The procedure is
    # two minutes: tare, then push the tool along flange +X/+Y/+Z by hand and check
    # each push reads on the same axis with the same sign. Until that is done on
    # THESE arms, this triad is a well-founded derivation, not a measurement.
    axes:
      fx: [ 0.0, -1.0,  0.0]
      fy: [ 1.0,  0.0,  0.0]
      fz: [ 0.0,  0.0, -1.0]

    # The sensor's own weight. Informational: the box compensates the sensor stack.
    sensor_mass_kg: 0.175
    sensor_com_mm: [0.0, 0.0, 21.5]

    # SOFT per-axis dead-band on the COMPENSATED outputs only. 2 N is ~204 g, which
    # is why the tool-load estimate exists to read below it.
    # 2.0 -> 3.0 N (2026-09-03): the raw stream's own p-p is 2.9 N (liveness check at
    # boot), so a 2 N band let noise through on 7.6 % of hand-off ticks (measured
    # above). 3 N is one full noise p-p; the tool-load estimate reads below it. The
    # torque band stays at 0.5 Nm - rotation is rigid on both laws now.
    deadzone_force_n:  [3.0, 3.0, 3.0]
    deadzone_torque_nm: [0.5, 0.5, 0.5]
    tool_load_tau_s: 1.0

    # SRO -> TCP. NOT flange-relative: the sensor stack already contributes its
    # 45 mm, so flange -> TCP = 45 + 202.642 = 247.642 mm — which is exactly the
    # URDF's tcp_joint origin (0.247642 m, rpy 0). The TCP is the pika FINGERTIP
    # CENTRE PLANE. Stating a flange-relative number here would put the TCP 45 mm
    # too far out, i.e. reaching past the workpiece, with nothing on screen to say why.
    tool_xyz_mm: [0.0, 0.0, 202.642]
    tool_rpy_deg: [0.0, 0.0, 0.0]      # flange-aligned; jaw axis = TCP +/-x

    # MEASURED, not CAD-nominal. CM `ft identify` 2026-08-17 14:08, residual 0.62 N.
    # The pika CAD's own +90 deg yaw is baked into the exported meshes, not the TCP
    # frame, so it does not appear here.
    tool_mass_kg: 0.7912
    tool_com_mm: [-0.02, 3.24, 25.34]   # SENSOR frame, from the SRO

    # The point the applied-force torque is referenced to. A two-finger gripper
    # applies its force AT THE FINGERTIPS. It lands on the same 202.642 as the TCP
    # because robotics_lab DEFINES the TCP at the contact plane — it does not follow
    # the TCP, and would not move with it.
    applied_force_mm: [0.0, 0.0, 202.642]

    # No bias on file: the bias is a SENSOR ZERO and belongs to a tare, not to a
    # config. Force control REFUSES to cover an arm that has never been tared, so
    # send TareForceSensor with the arm still and carrying nothing but the tool.

  right:
    enable: true
    sensor_name: "RFT64-6A01-A"
    tool_name: "pika"
    sensor_offset_mm: [0.0, 0.0, 45.0]
    # The SAME product on the same flange design. The triad was converged on the LEFT
    # arm; if this arm's own 7-pose fit ever disagrees, that fit wins for this arm.
    axes:
      fx: [ 0.0, -1.0,  0.0]
      fy: [ 1.0,  0.0,  0.0]
      fz: [ 0.0,  0.0, -1.0]
    sensor_mass_kg: 0.175
    sensor_com_mm: [0.0, 0.0, 21.5]
    # 2.0 -> 3.0 N (2026-09-03): the raw stream's own p-p is 2.9 N (liveness check at
    # boot), so a 2 N band let noise through on 7.6 % of hand-off ticks (measured
    # above). 3 N is one full noise p-p; the tool-load estimate reads below it. The
    # torque band stays at 0.5 Nm - rotation is rigid on both laws now.
    deadzone_force_n:  [3.0, 3.0, 3.0]
    deadzone_torque_nm: [0.5, 0.5, 0.5]
    tool_load_tau_s: 1.0
    tool_xyz_mm: [0.0, 0.0, 202.642]
    tool_rpy_deg: [0.0, 0.0, 0.0]
    # CM `ft identify` 2026-08-17 14:10, residual 0.59 N. 1.1 % from the left arm's
    # mass and under 1.5 mm in CoM — two units of one product, measured separately
    # and kept separately, because each arm compensates with its OWN sensor.
    tool_mass_kg: 0.7822
    tool_com_mm: [-1.24, 4.03, 26.56]
    applied_force_mm: [0.0, 0.0, 202.642]

# =============================================================================
# FORCE CONTROL — the admittance overlay on the emitted Cartesian target.
#
# THE LAW IS controller-manager's FOLLOW path, ported: that is the consumer whose
# problem matches ours (a streamed Cartesian plan that must yield to contact without
# abandoning the plan). The numbers are CM's shipped 10 N row, which is ONE SOLVE —
# k, b and the gate threshold are not independent, and mixing a b from one row with a
# k from another is not a tuning, it is a different system.
#
#   k = max_force_n / d_max          10 N / 25 mm = 400 N/m
#   b = 2*zeta*sqrt(m*(k + k_env))   zeta = 0.25, k_env = 5e4 (hard plastic)
#   m = 15 kg                        owner constraint 10..15
#
# WHY zeta = 0.25 AND NOT 1.0: critical damping is WORSE here, measured. A large b
# physically RESISTS the offset's retreat at the moment of impact and raises the peak
# (65.4 N at zeta 1.0 against 47.2 N at zeta 0.25), while the gate already stabilises
# the loop.
#
# THE IMPACT PEAK IS NOT max_force_n. First contact at speed spikes far above it
# because the impact resolves in 30-50 ms while the gate needs ~70 ms to arrive. The
# gate regulates the SUSTAINED force; it cannot catch the transient. The two levers
# are approach speed and m — not this threshold.
# =============================================================================
force_control:
  enable: true

  # *** TWO CONSUMERS, TWO LAWS - AND RIGHT NOW THEY CARRY THE SAME NUMBERS. ***
  # That is a DECISION (operator, 2026-08-26 and again 2026-09-03), not duplication:
  # the split stays because the two problems are different and the numbers may
  # diverge again.
  #
  # ============================================================================
  # 2026-09-03: SPRING 0, LIKE controller-manager. k = 0 ON EVERY AXIS + THE FOLD.
  # ============================================================================
  # Until today this block was CM's 10 N ROW (m 15 / b 434.7 / k 400, gate 10 N):
  # "F converges to the gate's number, d converges to F/k = 25 mm". The operator
  # decided to follow CM's live configuration instead (platforms/*/params-tasks/
  # follow.yaml since 2026-08-25: m 12 / b 1000 / k 0, gate 30 N), with the one
  # mechanism that makes k = 0 workable: THE FOLD (force_control.fold_deviation).
  #
  # WHAT k = 0 CHANGES, STATED PLAINLY:
  #   * There is no spring, so the deviation is a bare integrator with no
  #     equilibrium but w == 0. Under a streamed plan the GATE stops the advance at
  #     max_force_n and the DAMPER then retreats at F/b until the wrench is inside
  #     the F/T deadzone (2 N). A sustained streamed contact therefore rests in the
  #     2..10 N band, not AT a designed number - CM measured its k = 0 force as
  #     b*v_cmd, a by-product of the stream speed (wiki/decisions/0028 SS2). A
  #     designed converged force needs a ref_force (CM 0039's one law, HANDOFF item
  #     4); that is the NEXT step, not this one.
  #   * Without the fold the deviation walks without bound (CM: 9.5 m in 300 s;
  #     resting bias 2.4 N -> 4.7 mm/s; the 40 mm fence pinned 2657 times in a run
  #     and the arm went rigid there; on 2026-08-26 a singularity guard stopped both
  #     arms on a nominal chain 97 mm from a healthy emitted pose). The fold hands
  #     the deviation to the plan EVERY TICK - the chunk follower's chained state and
  #     knots, or the compliant Hold's latched nominal - and the overlay drops its
  #     copy while keeping its velocity. Emitted pose unchanged: a change of
  #     variables, legal precisely because k == 0 (AdmittanceOverlay::
  #     pureDamperTranslation). The plan and the command are ONE chain again.
  #   * The fence is UNREACHABLE on a fold path. What still bounds free-space drift
  #     under a standing wrench: the F/T deadzone (a tare is a precondition, not a
  #     nicety), the deviation RATE caps below, and the ROI / collision / joint
  #     layers downstream. The fence stays as a dead backstop for the paths that
  #     DECLINE the fold (an absolute TcpPoseTarget source - UMI teleop - keeps its
  #     deviation in the overlay because it re-issues its target every tick).
  #
  # WITH k = 0 THE ONLY STABILITY KNOB IS b, AND THE BINDING CONSTRAINT IS PHASE
  # MARGIN AGAINST TRANSPORT DELAY, NOT ZETA (docs/reference/
  # force_control_stability_margin.md; the model reproduces CM's measured ring to
  # 4 % and our own 2026-08-27 incident to 6 %). L(s) = k_env/(s(ms+b)) * LPF(25 Hz)
  # * exp(-s T_d). Gain margin [dB] against a rigid surface, k_env 30.7 kN/m (CM's
  # 08-27 jig) / 44.4 kN/m (CM's 08-26 jig), translation (tools/force_loop_margin.py):
  #
  #     m      b   | T_d 12 ms        | T_d 18 ms        | T_d 26 ms
  #    15  434.7   |  -1.3  / -4.5    |  -3.7  / -6.9    |  -6.0  / -9.2   <- the OLD row at k=0: rings
  #    12    700   |  +3.5  / +0.3    |  +1.2  / -2.1    |  -1.1  / -4.4
  #    12   1000   |  +7.1  / +3.9    |  +4.7  / +1.5    |  +2.4  / -0.8   <- CM's pick (LIVE until the evening of 09-03; see the m 6 / b 500 block below)
  #    12   1500   | +11.1  / +7.9    |  +8.7  / +5.5    |  +6.3  / +3.1      (CM ran it; "sluggish")
  #
  # THE LINEAR MARGIN IS NECESSARY, NOT SUFFICIENT: the gate is a second loop and a
  # nonlinear one. Closed offline through a rigid wall (test_force_control.cpp
  # WallLoop, 50 mm/s stream, 25 Hz filter, force_gate.open_tau_s 1.0):
  #     b 1000: 18 ms / 30.7 kN/m settles flat; 18 ms / 44 kN/m and 26 ms / 30.7 kN/m
  #             still ring 12 N p-p; a 200 mm/s approach rings everywhere.
  #     b 1500: halves those amplitudes; a hand (1 kN/m) and wood (15 kN/m) are
  #             quiet at every delay with either b.
  # So against a RIGID surface at this cell's delay b = 1000 is marginal, exactly as
  # CM found on its jig (+0.6 dB), and the lever that actually buys margin is the
  # DELAY (CM: "at T_d = 13 ms a 6 dB margin needs only b = 717"). The oscillation
  # guard below is the backstop while that is worked on; b = 1500 is the fallback
  # if a ring shows up on hardware.
  #
  # T_d ON THIS CELL IS NOT SETTLED: 12 ms is what the RB3 / fw 8.7.3 ring implied,
  # and CM measured the command->reference echo at 18 ms on fw 8.9.1 (26090101),
  # the firmware these boxes run since 2026-09-02. Read the 18 ms column until it
  # is re-measured. b = 1000 is +4.7 dB there against the softer jig and +1.5 dB
  # against the harder one - on the right side of unity, not comfortably.
  #
  # WHAT b COSTS, IN BOTH DIRECTIONS: a hand pushing the arm at v feels F = b*v,
  # so 30 mm/s costs 30 N at b = 1000 (13 N at the old 434.7; CM's operator called
  # 1500 = 45 N sluggish within a session). AGAINST A WALL under a stream the
  # sustained force before the gate closes is b*v_cmd - b and stream speed trade
  # 1:1. And the bias walk (a wrench above the deadzone that is not contact) runs at
  # w/b: 2.4 N -> 2.4 mm/s here.
  #
  # THE DISCRETE LIMIT is untouched: the loader refuses b >= m/dt = 6000; 1000 is
  # 17 % of it.
  #
  # THE IMPACT PEAK IS NOT max_force_n, and no b here changes that: the impact
  # resolves in 30-50 ms while the gate needs its own close time to arrive. The
  # peak is v * sqrt(k_env * m); the parameter that governs it is
  # force_gate.close_tau_s and the approach speed, not the law.
  # ---- m 6 / b 500 (2026-09-03 evening, operator) -----------------------------------
  # The task is dual-arm pick & place and this law exists to keep the tool from being
  # pressed into the table, not to survive fast rigid impacts. With k = 0 the SUSTAINED
  # contact force is set by force_gate.max_force_n (the closed-loop model, gate + 3 N
  # deadzone + delay, settles at 8-10 N for EVERY b), so b only decides how fast the
  # arm yields (F/b: 10 N -> 20 mm/s here, was 10 mm/s) and the first-contact
  # transient (15-20 % lower than at m 12 / b 1000). Both favour a lower b for this
  # purpose. What a lower b costs is delay margin, and that is decided by the CONTACT
  # STIFFNESS, not by the approach speed (tools/force_loop_margin.py, 25 Hz filter):
  #
  #     m / b    | k_env  5 kN/m | 10 kN/m | 15 kN/m | 30.7 kN/m      (T_d 18 ms / 26 ms)
  #     6 / 500  | +14.4 / +12.1 | +8.4/+6.1 | +4.9/+2.6 | -1.3 / -3.6   <- LIVE
  #     8 / 600  | +15.9 / +13.6 | +9.9/+7.5 | +6.3/+4.0 | +0.1 / -2.2      fallback
  #    12 / 1000 | +20.4 / +18.1 |+14.4/+12.1|+10.9/+8.6 | +4.7 / +2.4      CM's row
  #
  # The pika fingertips are TPU 95A, so the contact this cell makes is expected well
  # under 15 kN/m (stable by 2.6 dB or more), and the tip's own give absorbs part of
  # the 0.5-2 mm the model shows the tool yielding. NOT MEASURED YET: if a press shows
  # a 5-8 Hz ring on *_fc_gate_force_n, that contact is ~30 kN/m and the row to step
  # back to is 8 / 600. The oscillation guard stays as the backstop either way.
  # Hand cost (hold law shares these numbers): 15 N at 30 mm/s, was 30 N.
  # ---- 2026-09-04: THE STREAM LAW GETS ITS SPRING BACK - k = 400 = 10 N / 25 mm ----------
  # The operator's requirement is "hold the contact at the configured N once pressed"
  # (first-contact peaks are accepted). With k = 0 that is not what happens: the
  # sustained force is the balance between the gate's creep and the damper's retreat,
  # a by-product of speed and b, and at the policy's 100-135 mm/s it limit-cycles
  # (closed-loop model, 15 kN/m, 26 ms: 8.6 +/- 5.9 N at 100 mm/s, 9.6 +/- 7.6 at 135).
  # CM 0028's shape - a spring UNDER the gate - is what converges: F -> max_force_n
  # exactly, d -> max_force_n / k, at every speed (CM measured 14.95-14.99 N for a 15 N
  # threshold from 10 to 50 mm/s). Same model, this row, gate 10 N judged on the
  # PHYSICAL force (see force_gate below), 15 kN/m, T_d 26 ms:
  #     v 20 mm/s 9.4 N | 50 mm/s 9.7 | 100 mm/s 9.9 | 135 mm/s 11.4   (k 600 drifts to 14.7)
  # and the contact still releases within ~50 ms when the plan lifts. k = 400 is CM's
  # 10 N row (10 N / 25 mm); the 40 mm fence is 1.6x away, as it was in August.
  #
  # WHAT THIS COSTS AND WHERE IT IS PAID: with k > 0 the FOLD DECLINES for this law
  # (AdmittanceOverlay::pureDamperTranslation is false), so the deflection stands in the
  # overlay - up to 25 mm at 10 N - and springs back. Every plan-side anchor (the chunk
  # follower's seed / re-anchor / lead guard, the pose-track SMD's reseed) now strips
  # it first (DualArmServoLoop::nominalOfEmitted), otherwise a contact would read as
  # 25 mm of plan lead against the 35 mm budget and a re-anchor would compose it twice.
  # The hold law keeps k = 0 + fold (a hand-guide has no force to converge to).
  # Delay margin is unchanged by k (tools/force_loop_margin.py --k 400).
  # ---- 2026-09-04 (evening): m 6 -> 12 ON BOTH LAWS, operator's teleop trial -------------
  # b stays 500 so the steady yield is unchanged (10 N -> 20 mm/s; hand cost 15 N at
  # 30 mm/s). What m changes: the law's time constant m/b 12 -> 24 ms, the stream
  # spring's corner sqrt(k/m) 8.2 -> 5.8 rad/s (zeta 5.1 -> 3.6, still overdamped),
  # and the first-contact peak v*sqrt(k_env*m) up by sqrt(2). Delay margin
  # (tools/force_loop_margin.py --k 400 --rows 6:500,12:500):
  #     m / b    | k_env 5 kN/m | 10 kN/m   | 15 kN/m   | 30.7 kN/m     (T_d 18 / 26 ms)
  #     6 / 500  | +14.5/+12.2  | +8.4/+6.1 | +4.9/+2.6 | -1.3/-3.6     <- 2026-09-03 row
  #    12 / 500  | +13.7/+11.4  | +7.6/+5.3 | +4.1/+1.8 | -2.1/-4.4     <- LIVE (trial)
  # i.e. 0.8 dB less at every contact, ring 7.2 -> 5.7 Hz at 18 ms; still stable by
  # 1.8 dB or more below 15 kN/m (the TPU tips), unstable only against the same
  # 30.7 kN/m rigid jig that 6/500 was. Same k = 0 row for hold. To revert: m 6.0.
  stream:
    translation:
      - {m: 100.0, b: 500.0, k: 400.0}   # x   10 N / 25 mm; m 12 = the 2026-09-04 trial
      - {m: 100.0, b: 500.0, k: 400.0}   # y
      - {m: 100.0, b: 500.0, k: 400.0}   # z
    # ROTATION: CM ships m 0.3 / b 10 / k 0 (derived for its 140 mm lever). On the
    # pika's 202.642 mm lever the rotational environment stiffness is k_env * L^2 =
    # 2.1x CM's, and CM's row reads -6.2 dB at T_d 12 ms / -8.6 dB at 18 ms against
    # 30.7 kN/m - unstable against any rigid contact, and rotation is the channel
    # that saturated J6 on 2026-08-27. Same model, same table (tools/
    # force_loop_margin.py --rotation):
    #     m      b   | 12 ms          | 18 ms          | 26 ms
    #   0.3     10   | -6.2 / -9.4    | -8.6 / -11.8   | -10.9 / -14.1   <- CM's row on OUR lever
    #   0.3     20   | +0.5 / -2.7    | -1.8 / -5.0    |  -4.1 / -7.3
    #   0.3     30   | +4.6 / +1.4    | +2.2 / -1.0    |  -0.1 / -3.4    <- LIVE
    # b_r = 30 is the smallest round number on the right side of unity at 18 ms. A
    # hand turning the tool at 0.2 rad/s (~11 deg/s) feels b_r*w = 6 Nm.
    # ROTATION IS RIGID (2026-09-03, operator). With k_r = 0 every torque about the TCP
    # turns the tool at M/b_r for as long as it stands, and on this cell the torques
    # that stand are NOT the task's: the F/T housing sits 202.6 mm behind the TCP, so
    # any force at the wrist - a cable pull, a hand resting on the gripper body, the
    # gravity model's residual - arrives with a 0.18 m lever. Measured
    # (servo_log_20260903_205241, right arm): the 14 fingertip pushes (4-16 N along the
    # tool axis) carried ZERO torque and turned nothing; all 11.7 deg of that run's
    # rotation came from 1-5 N at the housing, 7.4 deg of it in 18 s with the hand off.
    # The same 0.9 Nm was 0.2 deg under CM's k_r 250, 6.4 deg under the 08-26 k_r 8,
    # and unbounded here - which is the "rotation since last week" timeline exactly.
    # The frame is the TCP and the torque transfer is right; the stiffness is what
    # changed. A rotational compliance worth having needs a ref_force design (CM 0039);
    # until then the tool holds its orientation. The rotation GATE still throttles a
    # plan's rotational advance into a torque; that is a different mechanism.
    # To restore: {m: 0.3, b: 30.0, k: 0.0} per axis (the 2026-09-03 morning row).
    rotation:
      - {m: 0.0, b: 0.0, k: 0.0, mode: rigid}   # rx  RIGID
      - {m: 0.0, b: 0.0, k: 0.0, mode: rigid}   # ry
      - {m: 0.0, b: 0.0, k: 0.0, mode: rigid}   # rz

  # ---- the HOLD law: an operator pushing the arm by hand -----------------------
  # THE SAME NUMBERS AS `stream` ABOVE, by operator decision. With k = 0 and the fold
  # a compliant Hold is a HAND-GUIDE: the arm moves at F/b while pushed and STAYS
  # where it is released - the latched nominal is moved along with every fold, so
  # there is no spring-back and nothing pins the fence. Release it where you want it.
  # The gate does not act here (no plan advance to attenuate); the F/T deadzone and
  # the rate caps are what stop it drifting when nobody is pushing.
  hold:
    translation:
      - {m: 100.0, b: 500.0, k: 0.0}     # x   10 N -> 20 mm/s (same row as stream; m 12 trial)
      - {m: 100.0, b: 500.0, k: 0.0}     # y
      - {m: 100.0, b: 500.0, k: 0.0}     # z
    # RIGID, same reason as the stream law above: the hand-guide is a TRANSLATION
    # stage. Push anywhere on the tool and the TCP translates along the force; nothing
    # you do by hand turns it. (Orientation changes are a TcpLinearMove / policy job.)
    rotation:
      - {m: 0.0, b: 0.0, k: 0.0, mode: rigid}   # rx  RIGID
      - {m: 0.0, b: 0.0, k: 0.0, mode: rigid}   # ry
      - {m: 0.0, b: 0.0, k: 0.0, mode: rigid}   # rz

  # THE GATE. With k = 0 it is the ONLY thing that stops a streamed plan from
  # driving into a contact (the damper yields, it does not hold the plan back), so
  # the loader keeps refusing k = 0 + gate WITHOUT the fold (nothing would bound the
  # deviation) and k > 0 without the gate (the spring ramps the force forever, CM
  # measured 961 N in 40 s). 10 N is this cell's threshold (operator, 2026-07-24,
  # the pure 10 N reflex decision); CM's follow ships 30 N.
  force_gate:
    enable: true
    # JUDGED ON THE PHYSICAL |F| (compensated, BEFORE the 3 N deadzone) since
    # 2026-09-04. Judged on the deadzoned wrench the gate closed 3 N late and a
    # "10 N" contact settled at 13 N. This IS the force a pressed contact holds.
    # ACTS ON BOTH STREAMING PATHS since 2026-09-04: the chunk follower's plan
    # advance (as a plan shift) AND the absolute-target pose-track SMD's per-tick
    # advance (as a hold of the tracker's state, goal untouched). Before that a
    # TcpPoseTarget aimed under a surface drove the SMD path into it ungated.
    max_force_n: 10.0        # the plan advance into the contact is fully held here
    max_torque_nm: 1.4       # = 10 N * 0.140 m, CM's stale-L assumption, carried over
    close_tau_s: 0.10        # fast to close  - protective
    # 0.40 -> 1.0 ON 2026-09-03, WITH k = 0. A fast re-open makes the gate a relay,
    # and with no spring the relay feeds the damper ring directly: the offline
    # closed-loop test (test_force_control.cpp, WallLoop: a 50 mm/s stream into a
    # 30.7 kN/m wall, 18 ms of delay, the 25 Hz filter) rings 9.2 N p-p at 0.40 and
    # settles flat at 1.0 with the same b. CM had this same change "on the table"
    # (open_tau_s 0.40 -> 0.8-1.0) and held it pending a re-measure; here the
    # model that predicted both cells' rings says take it. COST: after a contact
    # releases, the plan's authority INTO the last contact direction recovers over
    # ~1 s instead of ~0.4 s. Retreat and sliding are never gated, so a grasp-and-
    # lift pays nothing; only a re-approach does.
    open_tau_s:  1.0         # slow to open   - see above
    # THE STREAM CHANNEL (2026-09-04 pm): how the gate is judged on the ABSOLUTE-
    # TARGET path (UMI / TcpPoseTarget through the pose-track SMD). The chunk
    # follower keeps the tick-judged gate above. MEASURED on the day's UMI teleop
    # logs: while MOVING in free space the compensated |F| was 3-5 N RMS in 8-30 Hz
    # (tool vibration excited by the motion) against 0.3 N below 2 Hz; its
    # excursions over the 10 N fade point lasted 12-33 ms; the tick-judged gate
    # stood below 0.9 for 45-74 % of the moving time and cut the tracker on 13-26 %
    # of the moving ticks with a sign-flipping direction - the shaking the
    # operator felt, absent with force control off. Tool inertia was ruled out
    # (fitted 0.02-0.2 kg, 0 % explained). So this channel is judged on a
    # SUSTAINED contact: the force VECTOR (stand frame, before the deadzone)
    # low-passed at stream_judge_lpf_hz - magnitude and cut direction both from
    # that filtered vector - armed once |slow F| has stood over stream_arm_force_n
    # for stream_arm_dwell_sec, released below stream_release_force_n. THE VECTOR,
    # NOT |F|: replayed on the same logs, a 3 Hz filter on |F| still armed 10-47 %
    # of the moving time (a zero-mean vibration rectifies into a DC level); the
    # filter on the vector with these values armed 0 % on 7 of 10 arm-runs and
    # <= 2 % on the rest (real light contacts are not excluded there). A 15 N
    # press arms it in ~180 ms and half-closes it at ~250 ms; then it fades as before.
    stream_judge_lpf_hz:     2.0    # contact band; 8-30 Hz vibration is 20-200x down
    stream_arm_force_n:      5.0    # = hold_engage_force_n: one notion of "contact"
    stream_release_force_n:  2.0    # = hold_release_force_n
    stream_arm_dwell_sec:    0.10   # 3-5 vibration cycles (12-33 ms each measured)

  # A DEAD BACKSTOP, not an operating limit. On a fold path the deviation is booked
  # into the plan every tick and never accumulates here; on a declined path (an
  # absolute TcpPoseTarget source) this is what bounds a k = 0 walk. It exists
  # because the fold depends on the wrench being right - a fresh port has not yet
  # earned the right to assume that.
  max_deviation_m: 0.040
  max_deviation_rad: 0.2617993878     # 15 deg

  # How FAST the deviation may grow. NOT the fence: deleting these would not be "no
  # limit", it would be an unbounded per-tick jump.
  max_velocity_m_s: 0.50
  max_acceleration_m_s2: 5.0
  max_velocity_rad_s: 2.00
  max_acceleration_rad_s2: 20.0

  # CONTACT-SHOCK LOW-PASS ON THE WRENCH THE LAW SEES (2026-08-27).
  # *** THIS FILTERS FORCE, NOT MOTION. *** It sits between the F/T pipeline and
  # the admittance law + force gate. The servo command path keeps its own filters
  # OFF on purpose (servo_alpha 10.0, output_moving_average_window 1) and is not
  # touched, and the logged/published wrench stays the RAW measurement -- the
  # filtered value is logged separately as *_fc_wrench_filt_* so the pair shows
  # what was removed.
  # MEASURED (servo_log_20260827_164625.csv, right arm, t=410.1 s): on contact the
  # compensated |F| swung 0 -> 98.6 N and back every few ticks -- 53.8 N inside a
  # single 2 ms tick, 26,900 N/s -- and the overlay followed it faithfully. Median
  # commanded acceleration during contact was 1,501 deg/s^2 (the accel clamp's own
  # ceiling, engaged on half those ticks) against 57 deg/s^2 streaming free. That
  # is the jerk felt at contact. The deviation moved one way throughout, so it is
  # shock-following, not the limit cycle the oscillation guard catches.
  # 25 Hz: one pole, ~6 ms of lag against the box's own 12 ms pipeline, well above
  # the 0.8 Hz admittance corner so the steady contact force is untouched. Set 0
  # to feed the law the raw wrench (pre-2026-08-27 behaviour) for an A/B.
  wrench_filter_hz: 25.0

  # OSCILLATION GUARD (2026-08-27 incident, servo_log_20260827_101144.csv). A hand
  # push pinned the 40 mm translation fence, then a ~5.3 Hz coupled oscillation
  # (F/T dynamic feedback through the ~12 ms pipeline delay) grew INSIDE the
  # 2 rad/s rotation cap until wrist IK amplification saturated every joint at
  # dq_max (321 deg/s commanded on J6, 283 deg/s measured, 318 N on the sensor)
  # and the operator hit E-stop. The rate caps bound amplitude per tick; they
  # cannot see a limit cycle. This can: >= min_reversals velocity-direction flips
  # at >= min_velocity_frac of the cap within window_sec freezes compliance until
  # the wrench stays below the release thresholds for release_quiet_sec.
  oscillation_guard_enable: true
  oscillation_min_reversals: 4
  oscillation_window_sec: 0.75
  oscillation_min_velocity_frac: 0.35
  oscillation_release_force_n: 5.0
  oscillation_release_torque_nm: 0.5
  oscillation_release_quiet_sec: 0.5
  # Same incident, phase 6: a coverage freeze decays the command rate, which
  # un-trips the rate check that froze it - 226 freeze<->covered transitions in
  # 10 s (~23 Hz), re-latching the Hold nominal at the pushed pose each time. The
  # raw verdict must now hold for coverage_recover_sec before re-covering, and a
  # Hold nominal is never latched while |F| > hold_relatch_max_force_n (the Hold
  # stays rigid until the hand releases).
  coverage_recover_sec: 0.5
  hold_relatch_max_force_n: 5.0
  # 2026-09-04: the compliant Hold's nominal is latched at the last COMMANDED TCP
  # (FK of the previous sent joints, overlay deviation stripped) instead of the
  # measured TCP, which trails the stream by the box's ~22 ms and re-targeted the arm
  # backwards on every pedal release (5-11k deg/s^2 kicks, every UMI release, four
  # runs). Above this command/measured gap the measured pose is latched instead.
  hold_latch_max_command_gap_m: 0.020

  # ---- THE HAND-GUIDE ENGAGEMENT LATCH (2026-09-03) -------------------------------
  # A Schmitt trigger on the PHYSICAL |F| (compensated, BEFORE the deadzone - the push
  # the operator feels) for the hold law: the arm starts yielding only at >= engage,
  # keeps yielding down to <= release, and is FROZEN in between. With k = 0 there is
  # no other stop for a parasitic wrist force. MEASURED (servo_log_20260903_205241,
  # right arm, 228 s with the hand off): the compensated force cleared the 2 N
  # deadzone on 7.6 % of ticks and the arm crawled 38 times on its own - 0.2-2.1 mm
  # per event, up to 2.3 mm/s, one 18 s crawl of 7 mm along a steady 1-3 N pull at the
  # F/T housing (a cable or a resting hand; the teleop mux was idle, no gripper command,
  # no mode change). That is what "vibration without pushing" was. A hand that means it
  # pushes past 5 N without noticing; at b = 1000 the arm answers at 5 mm/s from there.
  hold_engage_force_n: 5.0
  hold_release_force_n: 2.0

  # Make a plain Hold compliant by latching its measured TCP as the nominal. This is
  # what lets an operator push the arm by hand and watch it yield and spring back
  # without a policy running. Turn it OFF once a policy owns the arm: a compliant Hold
  # is an arm that moves when something leans on it.
  hold_compliance: true

  # THE FOLD (2026-09-03, controller-manager's k = 0 hand-off - wiki/findings/
  # k-zero-follow-stops-on-the-nominal-chain.md, Arm::absorb_overlay_offset). Every
  # tick, on a law whose axes are all pure mass-dampers, the deviation is handed to
  # the plan that produced the nominal and the overlay drops its copy (velocity
  # kept). Emitted pose unchanged. REQUIRED by the loader for k = 0 + gate and for a
  # spring-less compliant Hold. Sinks: the chunk follower (delta_preview rollouts)
  # and the compliant Hold's latched nominal; an absolute TcpPoseTarget source (UMI
  # teleop) declines and keeps its deviation fenced in the overlay. Logged as
  # *_fc_folded / *_fc_fold_sink / *_fc_absorbed_*.
  fold_deviation: true

  # *** IS THE COMMAND ACTUALLY REACHING THE ROBOT? ***
  # The overlay is an open-loop integrator on the measured wrench: if its output never
  # lands, the wrench never answers and it winds until something else stops it. On
  # 2026-08-26 a queue-sync deadlock put the command 54 deg out this way.
  #
  # THE TEST IS RATE, NOT DISTANCE, and that is the whole point. Comparing how far the
  # box's own reference TRAILS the last sent joints froze compliance on a healthy link:
  # at 334 deg/s it legitimately trails 8.6 deg (the queue alone is 5 ticks) while the
  # same run's median was 0.02 deg. No fixed distance separates "behind" from
  # "stopped". A rate does, because a fast move drags the box's reference along with it
  # and a dead link leaves it exactly where it was.
  #
  # THE RATIO IS MEASURED, NOT PICKED. Across the six runs of 2026-08-26 the healthy
  # minimum was 0.156 and every dead-link run read 0.000, so 0.05 sits three times
  # below the healthy floor and far above the dead one.
  command_execution_tau_sec: 0.20         # the comparison window (rate low-pass)
  command_execution_min_rate_dps: 5.0     # below this we are not moving; say nothing
  command_execution_min_ratio: 0.05       # ref rate must be >= this x our rate

  # Refuse to compose onto a nominal older than this — a deviation composed onto a
  # stale pose is a command nobody authored.
  max_state_age_sec: 0.05

kinematics:
  enable: true
  provider: pinocchio
  urdf: "descriptions/urdf/rb5_850e.urdf"
  # THE BOX DH CALIBRATION (2026-09-05). At `make run` the server reads each box's
  # calibrated DH (get_link_parameter: J2.alpha J3.alpha J1.d J2.a J3.a J4.d), writes
  # calibrated runtime URDFs (logs/stack/runtime_urdf/) and builds IK/FK, the
  # collision monitor and the GUI manifest from them. ANY failure - box off, a
  # different value count, a cell beyond the limits, a mismatch at connect - ends
  # the server (exit 3): real never runs on the URDF nominal. Measured gain vs
  # nominal: p50 0.6-1.2 mm, 0.1 deg per arm (URDF FK vs box TCP, 2026-09-04).
  # box_tool_offset_mm = the box's TCP point relative to our fingertip, in the box
  # TCP axes, fitted on 2026-09-04 against the NOMINAL FK (left/right mirror in x).
  # Feeds RobotState::fk_vs_box_tcp_mm every tick and the startup oracle; refit
  # after the first calibrated session, then consider oracle_fatal: true.
  calibration:
    source: box
    output_dir: logs/stack/runtime_urdf
    probe_timeout_sec: 2.0
    max_abs_delta_mm: 10.0
    max_abs_delta_deg: 2.0
    oracle_max_mm: 0.5
    oracle_fatal: false
    box_tool_offset_mm:
      left:  [3.0, -249.7, -251.5]
      right: [-3.7, -249.3, -250.7]
    # The GUI draws its arms from calibrated copies of this file (published in the
    # state manifest as robot_urdf_left/right); missing = fatal, like everything above.
    gui_arm_urdf: "descriptions/urdf/rb5_850e_pika_articulated.urdf"
  base_link: "world"
  tip_link: "tcp"
  joint_names:
    - base_joint
    - shoulder_joint
    - elbow_joint
    - wrist1_joint
    - wrist2_joint
    - wrist3_joint
  q_units: deg
  publish_tcp: true
  ik:
    # MINIMUM SOLVER STEPS before the tolerance test may accept (2026-08-28). The
    # test sits at the TOP of the iteration, so 0 lets the solver return the SEED
    # whenever the new target is already inside position_tolerance_m of the pose the
    # previous sent joints reach. Streaming Cartesian control asks for less than that
    # on every slow tick, so the joint command came out as a staircase -- hold N
    # ticks, then one lump step, and that step always leaves from a standstill so it
    # trips the acceleration limiter at ddq_max*dt.
    # MEASURED (servo_log_20260827_234302.csv, 34 s of pi0.5 rollout): 4.3% of the
    # RIGHT arm's ticks returned 0 iterations, and on those the commanded second
    # difference was 13x the rest of the run (7554 vs 570 mm/s^2). Essentially all of
    # that arm's command roughness came from 4% of its ticks. The LEFT arm spent
    # 23.3% of ticks with a sub-tolerance reference step.
    # The dead zone was not filtering noise: across 3864 (left) / 655 (right)
    # consecutive sub-20 um reference steps, the cosine between one step and the next
    # was +1.00 on 100% of them -- the reference moves smoothly below the tolerance,
    # so the dead zone was quantizing a smooth signal rather than rejecting a rough
    # one. Cost of the extra step: 1.02 us -> 6.16 us on the affected ticks, against
    # a worst-case loop margin of 405 us in 2000 us.
    # Set 0 to restore the dead zone. The no-noise measurement above covers the chunk
    # follower path only; SpaceMouse / UMI teleop references were not re-measured.
    min_iterations: 1
    enable: true
    max_iterations: 100
    timeout_ms: 20.0
    damping: 0.02
    # ANTI-TREMBLE (was 0.002 / 0.005): the tolerance is a DEAD ZONE for the
    # 500Hz streaming TcpPoseTarget path — solveIk returns the seed (q_actual)
    # unchanged whenever the tracking error is inside it. At teleop speeds
    # (10-25mm/s) the steady-state tracking error (speed x ~100ms servo lag)
    # sits exactly at the old 2mm boundary, producing a 3-5Hz relay limit
    # cycle (= 1/(2 x loop delay)). Tighter tolerance shrinks the dead zone
    # so the solver actually iterates each tick; typical cost 1-3 DLS steps.
    # 2026-06-19 (jhkim): SLOW-motion tremble fix. servo_log 140451 slow ticks:
    # pos_err pinned at the 1e-4 boundary (p99 9.94e-5) and ik_iters==0 (dead-zone
    # = IK returns seed) in 44% of slow ticks -> boundary relay -> q_sent ripple
    # (slow reversals 7-22) -> robot stop-go stick-slip (q_actual hold 35%). Fast
    # motion unaffected (error >> tolerance, dead-zone never fires). Shrink dead-zone
    # 5x so the solver iterates every tick. Do NOT go to 2e-7 (#-out above) — too
    # tight, solver can't hit it -> oscillates. If slow tremble persists, try 1e-5.
    position_tolerance_m: 0.00002 #0.0001 #0.0000002
    orientation_tolerance_rad: 0.0002 #0.001
    max_step_deg: [2, 2, 2, 3, 3, 4]
    # Selective singularity-robust damping. Shared by every position-IK
    # primitive (TcpPoseTarget / TcpLinearMove / pose-track SMD / twist-via-SMD),
    # so it also covers the occasional MODE=real teleop lurch — not just
    # singular_region_eps, damping on that direction ramps up to damping_max,
    # keeping the solver on the seed branch (no ~5 deg single-tick joint flip for
    # a ~0 mm Cartesian move) at the cost of a small Cartesian lag near the
    # singularity. The arm keeps moving toward the command — it never holds.
    #
    # DEFAULT OFF (0.0/0.0) until tuned: for this arm sigma_min is ~0.004 even in
    # a healthy pose (mixed m/rad task units), so a too-high eps would damp normal
    # motion and add tracking lag everywhere. TUNE FROM TELEMETRY: capture a log
    # with RB_TWIST_PIPELINE_CSV and read ik_sigma_min at the tick where
    # ik_branch_jump=1; set singular_region_eps just above that value (expected
    # well below the ~0.004 healthy-pose floor) and raise damping_max until the
    # branch-jump flag stops firing there. Only then enable.
    # 2026-06-28: REVERTED to 0.10/0.08. The 0.14/0.15 experiment (to damp the
    # near-singular jerks) RAN THE IK OUT OF ITERATIONS: when the operator drove the
    # right arm deep into singularity (cart_min_singular ~0.033 at a far y=-0.82 reach),
    # damping ramped to ~0.145, IK steps shrank, iters climbed 57->100 (the cap) ->
    # 'max_iterations' failure -> per-arm hold -> the right arm FROZE for ~12 s. 100% of
    # the failures were below eps=0.14. Higher damping_max trades IK convergence for
    # smoothness and that trade broke convergence. The deep-singular jerk/freeze is an
    # operator-reach problem (full extension), not a damping-tunable one — keep the arm
    # out of that region; do NOT raise damping_max without also raising the IK iteration
    # budget (which risks the 500 Hz loop deadline).
    singular_region_eps: 0.10
    damping_max: 0.08
    # Observability ON: flag a solve whose joint solution jumps > N deg from the
    # seed in one tick (branch-jump detector). Does not change motion; surfaces
    # the events to tune the damping above.
    # 2026-08-26: 2.0 -> 1.0. NOTE what this does and does not buy (measured on
    # servo_log_20260826_042818.csv): this is a PER-TICK per-joint step ceiling, and at
    # 500 Hz the downstream dq_max clamp already caps every joint at
    # dq_max*dt = [0.34,0.34,0.34,0.48,0.48,0.64] deg/tick. 2.0 (== 1000 deg/s) could
    # therefore never bind before that clamp, and 1.0 (== 500 deg/s) still cannot, so
    # UMI teleop reach/speed is UNAFFECTED -- teleop is limited by dq_max, not by this.
    # What 1.0 does buy is a smaller residue for the per-joint clamp to cut: the rate
    # limiter scales all six joints UNIFORMLY (preserving the joint-space direction)
    # while dq_max clamps each joint independently (rotating it). Over the 58 s rollout
    # the raw jump exceeded 2.0 on 56 ticks and 1.0 on 130 ticks (right arm), so this
    # hands ~74 more ticks/58 s to the direction-preserving limiter.
    # If you later want this to be the real smoothness knob rather than a backstop, it
    # has to go at or below the per-tick dq_max budget above -- that is a separate,
    # speed-affecting decision.
    max_solution_jump_deg: 1.0
    # Branch-jump CLAMP (acts, not just observes). When a converged solve still
    # jumps > max_solution_jump_deg from the seed: re-solve the SAME tick at
    # branch_jump_damping_scale x damping (escalating per retry) to pull it back
    # onto the local branch; if it still jumps, hold the SEED (zero motion this
    # tick) instead of flipping to a distant branch. Telemetry ik_branch_jump_clamped
    # (state + twist_pipe.csv). 2nd line of defense behind the singular damping above
    # (1st: suppress the jump at the source). If clamp fires often, raise
    # singular_region_eps / damping_max so it's caught earlier.
    branch_jump_damping_scale: 10.0   # base 0.02 -> re-solve at 0.2, then 2.0
    branch_jump_max_retries: 2
    branch_jump_clamp_to_seed: false
    # RATE-LIMIT (preferred): if a solve still jumps > max_solution_jump_deg after
    # the damping retries, scale the whole seed->solution joint delta so the
    # largest per-joint step == max_solution_jump_deg. Advances toward the solution
    # at a bounded joint speed (no deadlock like clamp_to_seed, no abrupt flip like
    # plain allow). Takes precedence over branch_jump_clamp_to_seed.
    # max_solution_jump_deg above is now the SMOOTHNESS/LAG knob: smaller =
    # smoother but more lag through high-gain (wrist) regions; larger = snappier.
    branch_jump_rate_limit: true
    # MANIPULABILITY step guard (2026-08-26). Scales max_solution_jump_deg down as the
    # task Jacobian's smallest singular value drops, so a poorly conditioned pose is
    # traversed slowly instead of at the full ceiling.
    # WHY HERE: the pose_track_smd manipulability guard (singularity_scale_* in the
    # TcpPoseTarget profiles below) only runs on the legacy pose-track SMD. flow-infer's
    # chunk follower (controller delta_preview) bypasses that SMD entirely -- smd_active
    # was 0 for the whole 2026-08-26 rollout -- so that guard was dead code on the path
    # that needed it. Every Cartesian path goes through IK, so the IK step ceiling is the
    # one choke point covering pose-track, delta_twist, delta_preview and teleop.
    # THRESHOLDS from the measured band, NOT guessed: over that rollout sigma_min ran
    # 0.104-0.191 (median 0.180) and never went below 0.10 -- there was no true
    # singularity. The two shake events sat at the BOTTOM of that band (0.118-0.152 and
    # 0.104-0.123), where the empirical |dq|/|dp| gain was 1.8-2.6x its baseline. So the
    # ramp is placed across the real operating band: full speed at sigma >= 0.17 (above
    # the median), floor at sigma <= 0.11 (the observed bottom), and 0.30 min so a
    # 1.0 deg/tick ceiling becomes 0.30 deg/tick there -- below the tightest dq_max
    # budget (0.34), i.e. tight enough to actually bind, and never zero so the arm can
    # always be commanded back out.
    singular_step_scale_full_sigma: 0.17
    singular_step_scale_floor_sigma: 0.11
    singular_step_scale_min: 0.30
    # JOINT-LIMIT BEST EFFORT. Without this, a joint pinned at its range makes the
    # residual irreducible, the iteration budget runs out, the tick is REFUSED, and
    # the arm holds — losing the feasible part of the motion as well. Measured
    # 2026-08-26 on five pi0.5 rollouts: J3 pinned at its +/-150 deg elbow limit left
    # a 34 um / 9e-5 rad residual against position_tolerance_m 20 um, i.e. the solve
    # missed by 14 um, the arm froze for 1-5 s, and the chunk follower's plan ran away
    # into delta_preview_actual_lead_fault. Accept the clamped iterate while its
    # residual stays inside these: the arm keeps tracking every direction the pinned
    # joint does not block, and the residual it truly cannot follow is bounded here.
    # 0.5 mm / 0.11 deg = 25x/10x the convergence tolerances, but ~70x/~44x below the
    # follower lead budgets, so a best-effort tick can never masquerade as tracking.
    # Beyond this the solve still fails, the arm still holds, and the follower now
    # freezes its plan instead of running away (cartesian_solve_blocked_recent).
    # 2026-08-26: track the feasible directions instead of refusing the whole tick when a
    # joint is pinned and the residual is OUTSIDE the best-effort window below. The
    # residual is irreducible there -- the joint cannot go further -- so refusing does
    # not shrink it, it only discards the motion the other five joints could still make,
    # and because a neighbouring tick usually solves, the arm alternates hold/move at
    # loop rate (measured: 436 refusals / 159 accepts, 18.3 Hz buzz, J3 at -150.0 deg).
    # The commanded pose is the clamped iterate; the part that cannot be followed stays
    # visible as follower lead, the tick stamps the command-throttled window, and the
    # divergence latch therefore RE-ANCHORS instead of raising ChunkFollowerFault.
    # Reason stays distinct in telemetry: "joint_limit_tracking" vs
    # "joint_limit_best_effort" vs a real convergence.
    joint_limit_track_feasible: true
    # 2026-08-26 refinement: the residual-UNBOUNDED tracking acceptance now
    # requires the FINAL solution to be pinned ON a limit. The sticky hit flag
    # alone (a mid-solve iterate grazing a limit, or a clamped seed) no longer
    # authorizes accepting arbitrary residuals -- that path let an out-of-reach
    # target walk the arm toward a limit posture one "successful" tick at a time.
    joint_limit_best_effort_position_tolerance_m: 0.0005
    joint_limit_best_effort_orientation_tolerance_rad: 0.002
    # Orientation task weighting (default 1.0 = legacy unweighted; NOT enabled
    # yet -- flip in its own supervised session). The log6 task mixes m and rad;
    # with the 0.3476 m flange->TCP lever, 1 rad of orientation error moves the
    # tip ~0.35 m, so the unweighted solve treats orientation ~3.5x looser at
    # the tip than position. orientation_error_weight: 0.3476 expresses both
    # halves in tip-equivalent meters. Tolerances stay on the unweighted errors.
    # orientation_error_weight: 0.3476
    # MAX-ITERATIONS BEST EFFORT (2026-08-26). Same idea, for the other way the loop
    # runs out: near a singularity the selective DLS damping ramps up, the per-iteration
    # step shrinks, and the 100-iteration budget is spent while the residual is already
    # micrometres from the target. The tick is then refused, the arm holds at its
    # previous joints, the NEXT tick converges, and the arm alternates hold/move at loop
    # rate.
    # EVIDENCE (servo_log_20260826_054303.csv, right arm 05:44:48.9 -> 05:44:52.2 KST):
    # sigma_min fell to 0.0114 and IK hit the cap on 1448 ticks in 307 alternating
    # bursts (~93 Hz). Measured residual on ALL 1448 of them: position <= 0.221 mm
    # (median 0.034 mm), orientation <= 6.6e-5 rad (median 1.0e-5). position_tolerance_m
    # is 20 um -- so the arm was frozen and shaken for 3.3 s because the solve came up
    # 14-200 MICROMETRES short. The measured joint motion in that window was 137 deg at
    # J3 and 219 deg/s.
    # Values mirror the joint-limit pair above (0.5 mm / 0.11 deg), which covers 100% of
    # those 1448 ticks with ~2x margin over the worst residual, and still sits ~70x/~44x
    # under the follower lead budgets so a best-effort tick can never pass as tracking.
    # Past this window the solve still fails, the arm still holds, and the follower
    # freezes its plan (cartesian_solve_blocked_recent) instead of running away.
    max_iterations_best_effort_position_tolerance_m: 0.0005
    max_iterations_best_effort_orientation_tolerance_rad: 0.002
    # ===================== JOINT-LIMIT RELIEF (2026-08-28) =====================
    # WHAT THIS FIXES. Blocking J3 at +/-150 (the RB3-730E range) is necessary, but it
    # was the WHOLE policy: nothing said what the 6-DOF task should give up once the
    # joint was gone. So the solver asked five joints for six DOF, burned all 100
    # iterations on a residual it cannot close, and re-drew the null space every tick.
    # MEASURED on two pi0.5 rollouts (servo_log_20260828_102032.csv / _111241.csv), left
    # arm returning to pick past the near-base box at stand (0.25, -0.33, 0.07):
    #   - elbow pinned at 149.90 (the barrier standoff) on 4.0% / 6.3% of rollout ticks
    #   - on 99.5% / 100% of IK max-iteration ticks the limit clamp was on that joint
    #   - IK-reported residual 10.0 / 18.3 mm median (0.0005 mm on normal ticks)
    #   - IK cost 5.8 -> 462 us
    #   - >5 Hz command residual x2.9-3.8 on EVERY joint except the pinned one, which
    #     sat at exactly 0. The pinned joint is quiet; the others are improvising.
    #
    # WHY ORIENTATION IS WHAT GIVES. Same logs, 7,682 ticks within 30 mm of the failing
    # position: corr(orientation deviation, elbow angle) = -0.897. Held within 5 deg of
    # the commanded orientation the elbow never leaves 145-150; give it 15-20 deg and it
    # returns to 128-138. The POSITION is reachable throughout. (Also measured and ruled
    # out: no alternative IK branch to switch to — in 7,310 ticks within 30 mm / 11 deg
    # the elbow was NEVER below 145 — and the reach shell cannot fire at r = 0.531 m.)
    #
    # THE THREE MUST SHIP TOGETHER. Offline solver bench on the measured pinned posture
    # with the measured target noise, one paired noise realisation, >5 Hz joint-command
    # residual / mean position residual:
    #     baseline    91.8 mdeg / 37.8 mm
    #     A alone    188.3 mdeg /  3.6 mm   <- 2.1x WORSE shake
    #     A+B        215.5 mdeg /  6.6 mm   <- 2.3x WORSE shake
    #     D alone     39.6 mdeg / 38.4 mm
    #     A+B+D        5.8 mdeg /  2.3 mm   <- -94% shake, 16x better tracking
    # Relief buys tracking, but the null space it opens also gives target noise room to
    # move the arm. The low-pass is what converts the better tracking into a quiet
    # command. The config loader REFUSES relief without the low-pass for this reason.
    #
    # COST, accepted deliberately: up to ~8 deg of commanded orientation is traded away
    # while a joint is pinned (budget below caps it at 0.35 rad = 20 deg and ramps the
    # relief back out over the top 30%). The band means this can only happen within
    # 8 deg of a bound — during the measured rollouts the elbow was there 12.8% of the
    # time and inside 5 deg of the bound 7.1%; ordinary manipulation sits at 85-130 deg
    # where the law is exactly inert. SUPERVISED VALIDATION REQUIRED on the next run:
    # the policy is closed-loop on proprio, so letting orientation drift changes what it
    # sees, and whether it follows or fights that is not answerable offline.
    # (A) and (B) are DISABLED pending a fix — see the 2026-08-28 11:43 run below.
    #
    # THEY WORKED ON THEIR OWN AXES (servo_log_20260828_114352.csv vs _111241.csv,
    # left arm): IK saturation 6.3% -> 3.1%, time with the elbow at >= 149.5 deg
    # 6.3% -> 0.0%, and the residual on a saturated solve 18.26 mm -> 0.138 mm (132x).
    # The elbow stopped parking on its bound entirely.
    # THEY ALSO SHOOK THE ARM, and the run was stopped by the operator at t=79 s.
    # Three defects, all in this change:
    #  1. The loop's low-pass (D) gates on joint_limit_PINNED, i.e. on the solution
    #     RESTING on the bound -- which is the exact state (A)+(B) exist to prevent. The
    #     moment they worked, D became unreachable: 0 pinned ticks and 0 low-pass ticks
    #     across the whole 1450-tick shake. The config coupling below enforced shipping
    #     them together; the RUNTIME gate made one of the three dead.
    #  2. relief -> sigma_min -> (damping ramp, step-scale guard, null-space projector)
    #     -> avoidance -> joint margin -> relief is a closed loop with no damping.
    #     Measured corr(relief, sigma) = +0.985, corr(sigma, avoidance) = -0.948,
    #     corr(relief, avoidance) = -0.884. It limit-cycled at 3.0 Hz, swinging the elbow
    #     125 -> 148 deg and reversing J1/J2/J4 at +/-60 deg/s -- ENTIRELY in the null
    #     space, with position error <= 0.44 mm and orientation error <= 0.12 deg the
    #     whole time. The arm shook while tracking its target perfectly.
    #  3. sigma_min is computed from the RELIEF-WEIGHTED Jacobian, so relief makes a pose
    #     look singular to every guard keyed on it (singular_region_eps 0.10,
    #     singular_step_scale floor 0.11, and the SMD manipulability guard). Median sigma
    #     0.168 -> 0.120 with relief on, and 0.062 inside the shake: under all of them.
    #
    # ALL THREE ARE NOW FIXED IN CODE (the low-pass gates on the relief REGIME, relief is
    # frozen per solve from the seed, sigma is reported unweighted), and a bench that can
    # actually see this failure exists -- tests/test_kinematics_ik.cpp
    # testIkLimitReliefIsStableNearAReachableBound. On that bench the fixes take the shake
    # in this regime from 161 -> 39 mdeg (-76%) and the elbow swing from 0.83 -> 0.22 deg.
    #
    # THEY STAY OFF ANYWAY, because on the same bench relief still loses where it used to
    # win: in the ORIGINAL pinned regime it is 19.5 -> 50.5 mdeg (2.6x WORSE), and the
    # escape it exists to provide is down to -0.163 deg / 2 s for 0.64 mm / 3.0 deg of
    # pose drift (was -0.545 deg for 0.45 mm / 0.71 deg before the stability fixes --
    # escape speed was the price of making the solve a pure function of its inputs).
    # Re-enabling is a hardware decision, and the numbers do not justify it yet.
    #
    # D IS LEFT ON. With (A)/(B) off the elbow pins again, so D's gate arms and it does
    # the job it was measured to do (-57% on the offline bench, on the pinned shake that
    # servo_log_20260828_102032.csv and _111241.csv actually show).
    limit_relief_band_deg: 0.0
    limit_relief_min_orientation_weight: 1.0
    limit_relief_max_orientation_error_rad: 0.0
    limit_avoidance_band_deg: 0.0
    limit_avoidance_gain: 0.0
    limit_avoidance_max_step_deg: 0.0
    # (D) pinned-unconverged low-pass, applied by the servo loop. 8 Hz passes the real
    # motion and stops the per-tick null-space redraw. A low-pass and NOT a hold: holding
    # re-creates the loop-rate hold/move alternation joint_limit_track_feasible exists to
    # prevent, and releases with a step.
    pinned_unconverged_lowpass_hz: 8.0
    # BAND AROUND THE BOUND, not just ON it (2026-08-28, servo_log_20260828_122527.csv --
    # the run whose left-then-right return-to-pick shake this addresses).
    # Both arms' worst ticks of that run were at their elbow's OPPOSITE bounds -- left
    # +150.03 deg at t=96 (1090 mdeg), right -149.98 deg at t=114 (1236 mdeg), the two
    # highest of the whole run -- and the roughness peaks 1-8 deg OFF the stop, not on it:
    #   margin 20-200 deg  policy target 0.508 mm   q_sent  77.8 mdeg
    #   margin   8-20 deg                0.933 mm          137.7 mdeg
    #   margin    3-8 deg                1.543 mm          196.9 mdeg
    #   margin    1-3 deg                1.815 mm          275.1 mdeg   <- worst
    #   margin    0-1 deg                1.505 mm          123.0 mdeg   <- only this was covered
    # The right arm's single worst tick converged in ONE IK iteration and was not pinned,
    # so no pinned/iteration-exhausted test can reach it. What is actually happening is
    # upstream: the POLICY's own command roughens 3.0-3.6x as the elbow closes on its
    # stop (its tracking error goes 1.0 -> 4.5 mm there and pi0.5 is closed-loop on
    # proprio), and the servo passes 64-80% of that through -- except where this low-pass
    # runs, which cuts the transfer to 39%.
    # SIZED, not guessed: against that run's own ticks, pinned-only covers 6.1% of the
    # roughest 1%; a 5 deg band covers 25.7% of them while filtering just 1.5% of all
    # ticks. 8 deg and 12 deg cover no more rough ticks and filter 2x / 4.6x as many.
    # NOTE the remaining 74%: most rough ticks are NOT near a bound. This fixes the
    # joint-limit shake specifically, and nothing else.
    pinned_lowpass_margin_deg: 5.0
    # RAMPED RELEASE + the IK throttle in the gate (2026-08-28,
    # servo_log_20260828_135443.csv). The branch-jump rate limiter is STATELESS, so it
    # switches off in one tick and the transfer function steps with it: at a release the
    # commanded acceleration is a median 4,482 deg/s^2 against 83 elsewhere (54x),
    # peaking at 184,224 = 122x ddq_max, with the joint reversing between two 2 ms
    # samples. 16% of the 51 ticks that exceeded even the 4x decel ceiling sit exactly on
    # such a release.
    # A/B on the recorded command stream replayed through the real solver and clamp chain
    # (36 s; this is the bench that finally matched hardware -- 24.3x against a measured
    # 23.4x -- after three synthetic ones did not):
    #     today                      21 release events, 9,125 deg/s^2 median at release
    #     + throttle in the gate      6 events,          3,000
    #     + 120 ms ramped release     6 events,          1,120
    # The ramp is what makes EVERY gate transition (pinned, relief, margin band,
    # throttle) continuous, not just this one.
    pinned_lowpass_release_sec: 0.12
    # 2026-09-04: the release ramp is for a gate that CLEARS while the arm is still
    # being solved. A joint-mode interval (InitMotion / Hold / JointTarget jog) now
    # resets the engagement and the filtered joints outright; the frozen state was
    # being blended into the first Cartesian tick after a both-arm InitMotion (5.5 mm
    # lunge at 450 mm/s, 12,021 deg/s^2 brake, on every resume from an ROI-face stall).

cartesian_control:
  # goal lead the measured TCP by more than this (position m / orientation rad).
  # Bounds goal run-away when the arm stalls (IK clamp / fault / can't track) and
  # caps the recovery lurch; never engages in healthy tracking (lead = SMD lag,
  # ~mm/sub-deg). Floor-enabled twist also reports floor_goal_clamped and
  # goal_minus_measured_* in state + twist_pipe.csv.
  enable: true
  allow_in_simulation: true
  allow_in_real: true                          # PHYSICAL real Cartesian (config-gated; no env)
  allow_in_controller_simulation: false        # must be false for a real (non-sim) config
  warn_ik_duration_us: 3000
  fail_ik_duration_us: 5000
  # runs the pose_track_smd feedforward chain (quintic profile, no measured-
  # state feedback), same as streaming TcpPoseTarget.
  path_kp_pos: 3.0                # anti-tremble (was 6.0): less reactive to tiny errors
  path_kp_ori: 3.0                # anti-tremble (was 6.0)
  velocity_damping: 0.08          # anti-tremble (was 0.01): damp IK velocity solution
  # Low-speed first-run Cartesian limits (sim profile used 0.2 / 0.4 / 0.002 / 0.02).
  # PHYSICAL real speed decision (operator-approved); first-run halved values retired.
  # 2026-06-16 raised 0.10/0.2 -> 0.25/0.4 to stop policy-reach truncation: right
  # arm flow-infer commanded up to 0.237 m/s / 0.343 rad/s, clamp lost ~188mm/7deg
  # per rollout (twist_pipeline.csv). 0.25 == SMD max_linear_velocity_m_s ceiling;
  # 0.4 stays well under SMD 1.0 rad/s. OPERATOR-SUPERVISED retry, E-stop ready.

  max_linear_move_speed_m_s: 0.05
  max_angular_move_speed_rad_s: 0.1
  max_cartesian_step_m: 0.01
  max_cartesian_step_rad: 0.1

  exceed_limit_policy: clamp
  tcp_pose_target_profile_default: umi_large_smooth
  tcp_pose_target_profiles:
    spacemouse_precise:
      pose_track_smd:
        enable: true
        damping_ratio_linear: 1.0
        damping_ratio_angular: 1.0
        # 2026-06-28: nf_linear 1.3->1.8 to recover the sustained speed lost when the
        # source target-lead was halved (0.010->0.005). Sustained TCP speed ~=
        # lead * (2*pi*nf) / 2, so a smaller lead needs higher bandwidth to keep speed.
        # The SMD stays critically damped (no ringing); the ~5mm stop "coast" is set by
        # the LEAD, not by nf, so raising nf speeds tracking WITHOUT bringing coast back.
        natural_frequency_linear_hz: 1.8
        natural_frequency_angular_hz: 1.3
        velocity_feedforward: false
        # ceiling only (rarely binding; lead*bandwidth governs sustained speed).
        max_linear_velocity_m_s: 0.18
        # 0.35->0.5 so the higher-bandwidth tracking isn't accel-starved on quick moves.
        max_linear_accel_m_s2: 0.5
        max_angular_velocity_rad_s: 0.60
        max_angular_accel_rad_s2: 1.80
      max_smd_goal_lead_m: 0.020
      max_smd_goal_lead_rad: 0.08
    umi_large_smooth:
      pose_track_smd:
        enable: true
        # THE RELEASE BRAKE (2026-09-04 pm): on a deadman release (TcpPoseTarget ->
        # Hold) ramp the tracker's velocity to zero at max_linear/angular_accel
        # instead of dropping it for a one-tick stop (measured 9,283 deg/s^2 on the
        # right arm, servo_log_20260904_225810.csv 79.756 s). From 150 mm/s at
        # 2.5 m/s^2 that is 60 ms and 4.5 mm; the goal follows the state so the
        # next press integrates from where the arm stopped.
        release_brake_enable: true
        release_brake_timeout_sec: 0.5
        damping_ratio_linear: 1.0
        damping_ratio_angular: 1.0
        # 2026-06-28 (2nd raise): nf_linear 1.0->2.5 is the main FOLLOW-LATENCY fix.
        # velocity_feedforward already zeros the steady-state ramp lag, so nf is a
        # transient-bandwidth dial: at 1.0 Hz the arm took ~0.3-0.5 s to respond at
        # starts/reversals ("robot follows AFTER I move"); 2.5 Hz tightens that to ~0.1 s.
        # Critically damped (no overshoot). If UMI tracking jitter shows through, lower
        # toward 2.0. (angular left at 1.0; raise if rotation also lags.)
        # 2026-06-28 (3rd tune): q_sent stayed smooth but the ROBOT (q_actual) jerked up
        # to 1.56 deg/tick under nf=2.5 + accel 2.8 — NOT singularity (branch jumps were
        # at healthy minSV~0.17); it's the rbpodo controller jerking on over-aggressive
        # accel/nf (accel clamp churning). Ease nf 2.5->2.0 and linear accel 2.8->2.0 to
        # stay in the controller's smooth-tracking envelope; KEEP the high velocity (top
        # speed is not the jerk source). Rotation raised conservatively again on
        # 2026-07-07 after SetExternalBoxes no longer displaced teleop motion:
        # logs showed smooth motion, no IK failures, but angular source/server
        # lead clamped at 0.20 rad and angular ff hit the 1.0 rad/s ceiling.
        # A later 0.30 rad / 1.2 rad/s run still hit rotation lead + velocity
        # caps; keep nf/accel fixed because that run also showed a short
        # sol-jump/safety-clamp cluster. If jerk returns, first roll back omega.
        natural_frequency_linear_hz: 2.0
        natural_frequency_angular_hz: 1.5 #2.0
        velocity_feedforward: false
        # max_linear_velocity_m_s: 1.20
        max_linear_velocity_m_s: 0.30
        max_linear_accel_m_s2: 2.50
        max_angular_velocity_rad_s: 1.4 #2.00
        max_angular_accel_rad_s2: 3.0 #5.00
        # 2026-06-28: kill the UMI "robot moves when I just press the pedal" lurch.
        # On re-engage the command buffer holds the last target across the deadman
        # gap, keeping the SMD active, so the first re-anchored command delta (the
        # whole accumulated lead, measured ~17 mm) was integrated into the goal. Any
        # single delta over these caps is that re-engage jump (real per-tick teleop
        # deltas are ~1 mm at 500 Hz, source-capped at max_target_lead 0.020) -> re-latch.
        reengage_relatch_max_step_m: 0.012
        reengage_relatch_max_step_rad: 0.12
        # 2026-06-28: singularity velocity guard. Near a singularity the right arm
        # lurched (q_actual ~408 deg/s on a tiny q_sent) because the IK needs huge joint
        # velocity for small Cartesian motion there. Scale the SMD velocity down as the
        # IK min singular value drops: full speed at sigma>=0.15, ramping to 0.12x at
        # sigma<=0.05, so the arm SLOWS smoothly into the region instead of jerking and
        # the operator feels it and backs out (scale stays >0 = never freezes). This is
        # VELOCITY-ONLY -> it cannot stall the IK (unlike the reverted damping_max try).
        # Tune: more slowdown -> raise full_sigma / lower scale_min; if the edges feel too
        # slow -> lower full_sigma. (cart_min_singular ~0.17 in healthy poses, ~0.11 at
        # the lurches, ~0.03 at the deep reach that froze.)
        # 0.15->0.12: the right arm's NORMAL operating point is cart_min_singular ~0.154,
        # so full=0.15 was throttling normal motion (guard active 33% of ticks -> "slow").
        # 0.12 keeps full speed through normal operation and only engages when genuinely
        # closer in (lurch ~0.11, deep ~0.03). If lurches return, lower scale_min/floor.
        # 2026-08-14 (left arm, logs/servo_log_20260814_100223.csv): lurches returned —
        # following the note above, scale_min 0.12 -> 0.02. Two singularity events (wrist,
        # J5 through 0 at t=46s; elbow, J3 through 0 at t=79s) drove sigma to 0, IK iters
        # 1->100 -> max_iterations, and the IK landed on a branch up to 59.9 deg away
        # EVERY tick (median raw jump 5.9, p90 48.0; all 377 branch-jump ticks burned both
        # damping retries without recovering). q_actual peaked at 415 deg/s and the
        # commanded pose swung 18-30 deg out and back at 6-18 Hz.
        # 0.12 was not enough to stop entry: at the floor the SMD still tracks at 12% of
        # 0.30 m/s = 36 mm/s, which walks straight into the exact singularity. 0.02 gives
        # 6 mm/s — the arm effectively stops and the operator backs out — while keeping
        # the invariant above (scale > 0 = never freezes, recovers on its own).
        # Bounded by measurement, not guesswork: in that run 0 of 22,009 normal teleop
        # ticks (Running + ik ok, event windows excluded) had 0 < sigma <= 0.05, i.e. the
        # floor region is never touched in healthy operation, while 29% of the two event
        # windows sat in it. full_sigma/floor_sigma are UNCHANGED, so the onset of the
        # ramp — the part measured to throttle normal motion — is untouched.
        singularity_scale_full_sigma: 0.12
        singularity_scale_floor_sigma: 0.05
        singularity_scale_min: 0.02
      max_smd_goal_lead_m: 0.080
      max_smd_goal_lead_rad: 0.40 #0.35
    flow_infer_smooth:
      pose_track_smd:
        enable: true
        damping_ratio_linear: 1.0
        damping_ratio_angular: 1.0
        # 2x flow-infer rollout profile: keep critically damped SMD, but remove
        # the old 0.25 m/s, 0.45 m/s^2 bottleneck so --speed-scale 2.0 can track.
        natural_frequency_linear_hz: 1.6
        natural_frequency_angular_hz: 1.6
        velocity_feedforward: true
        max_linear_velocity_m_s: 0.50
        max_linear_accel_m_s2: 1.20
        max_angular_velocity_rad_s: 1.80
        max_angular_accel_rad_s2: 5.00
        reengage_relatch_max_step_m: 0.010
        reengage_relatch_max_step_rad: 0.10
        singularity_scale_full_sigma: 0.12
        singularity_scale_floor_sigma: 0.05
        singularity_scale_min: 0.12
      # Ruckig receding-horizon chunk-follower (replaces the SMD step above while
      # a chunk feed is live). fallback_policy=smd preserves legacy SMD fallback;
      # fallback_policy=fault holds on cold start and latches on feed loss/divergence.
      # fallback_policy=hold holds on cold start AND on feed loss, latches on divergence only.
      # Consumes whole chunk frames from network.chunk_frame_bind.
      # 2026-07-03 first-hardware values: CONSERVATIVE on purpose — at 33 ms
      # segments the JERK cap is the convergence budget (|dv| <= j*dt^2/4
      # ~ 0.0056 m/s per step at j=20); raise only on real-run evidence.
      ruckig_follower:
        enable: true
        controller: "delta_preview"
        # v3 timestamp-aligned local deltas are integrated into absolute knots by
        # the server, then followed by the existing Ruckig p/v/a chain. This
        # removes stale residual catch-up while preserving both arms' predictions.
        # 2026-07-17: raised from the first-hardware conservative set
        # (0.18 / 1.5 / 45) on real-run evidence, operator decision "follow the
        # model's predicted actions more faithfully": (a) training-distribution
        # motion reaches ~0.45 m/s (flow_infer_pgmode_sim_param_search), so
        # 0.18 clipped even the SPEED_SCALE=0.5 rollout (~0.22 m/s); (b) the
        # 18:08 real rollout latched delta_preview_projection_fault at 2.6 mm
        # because jerk 45 allows only ~12 mm/s velocity change per 33 ms
        # segment (dv <= j*dt^2/4) -- too slow for policy direction changes;
        # jerk 120 -> ~33 mm/s per segment. FT hard limit 30 N (11 ms
        # debounce), 50 mm divergence latch, ROI/self-collision, and
        # supervised E-stop remain the safety envelope for the faster motion.
        # 2026-07-18 14:28 run (SPEED_SCALE=1.0): the 0.25 m/s pairing for
        # scale 0.5 clipped full-speed policy transients -- projection fault at
        # 4.05 mm / 0.55 deg (rotation budget also exceeded) during a 204 mm/s
        # direction change with no contact. 0.45 matches the training
        # distribution top; angular velocity raised for full-speed wrist
        # reorientation headroom.
        # 2026-07-18 14:48 run (SPEED_SCALE=1.0, projection window already at
        # 12 segments): projection error 13.9 mm / 1.3 deg SUSTAINED past
        # 400 ms with no contact -- full-speed policy chunks demand sustained
        # tracking beyond accel 3 / jerk 120, not just reversal transients.
        # Operator decision: follow the model's chunks harder. Inertial
        # consequence: ~17.5 N m*a transients at 5 m/s2 with the ~3.5 kg tool;
        # watch for EFT-residual spikes against the 30/35 N hard limits before
        # raising further.
        max_linear_velocity_m_s: 0.45
        # 2026-07-31: speed_scale 1.0 trembling was diagnosed as SEGMENT
        # INFEASIBILITY, not roughness in the reference. The follower solves one
        # Ruckig segment per policy step with minimum_duration=dt, consumes only
        # the first dt, then re-solves toward the next knot -- so duration/dt is
        # the fraction of each plan that actually executes. Measured on hardware
        # (tools/follower_feasibility.py):
        #     speed 0.75, these limits  -> duration/dt p50 1.204, converged 26%  smooth
        #     speed 1.00, these limits  -> duration/dt p50 3.116, converged  1%  TREMBLES
        # i.e. at 33.4 ms only ~1/3 of each planned segment ran before it was
        # thrown away and re-aimed, which is the sawtooth that reads as trembling.
        #
        # rb_servo_server/tools/follower_replay --sweep, replaying the RECORDED
        # trembling knot stream offline, isolates the binding axis. Raising the
        # LINEAR limits alone changed nothing (p50 1.934 at lin_a 5->20 and at
        # lin_j 300->3000); ruckig time-synchronizes the 6 DoF, so the saturated
        # ANGULAR axes were setting the duration for translation too:
        #     baseline                     p50 1.934  >1.5 69.5%  conv  4.5%
        #     ang_j 2000                   p50 1.445  >1.5 46.3%  conv 23.8%
        #     + ang_a 20                   p50 1.078  >1.5 20.6%  conv 42.2%
        #     + lin_j 600                  p50 1.000  >1.5 10.2%  conv 61.3%
        # The last row matches the smooth speed-0.75 profile (p50 1.000, >1.5
        # 8.3%, conv 66.4%) on the same tool, and re-running the 0.75 stream with
        # these limits is strictly better (conv 98.9%), so this is not a trade.
        # af_damping_beta and the corner ring-down were also swept and made
        # feasibility WORSE when relaxed -- they are helping, leave them alone.
        #
        # These bound the follower's Cartesian REFERENCE generation only. The
        # joint-level guards downstream are unchanged and still own actual motion:
        # safety.dq_max_deg_s / ddq_max_deg_s2, the tracking-error latch, the
        # stand-frame floor, the async URDF-mesh CollisionMonitor, and the FT
        # hard limits. PENDING supervised physical confirmation: re-run
        # tools/follower_feasibility.py on the next real servo log and check
        # duration/dt p50 lands near 1.2 (target <= 1.3).
        #
        # 2026-08-14: global p50 hit 1.000 (feasibility verdict OK on
        # servo_log_20260814_134450) but BURSTS remained and were matched
        # tick-for-tick to the observed intermittent trembling and micro-pauses
        # (left arm post-reset: duration/dt p90 1.79, >1.5 on 13.9% of segments,
        # converged 74.6%; all three observed pauses sat inside >50 ms-segment
        # clusters, including free-space ones).
        # follower_replay one-factor sweep on that run's recorded knot stream
        # (outputs/follower_replay/knots_left_post.txt) showed BOTH acceleration
        # classes binding this time, velocities/jerks/corner-guard not:
        #     baseline (6 / 20)          >1.5 13.9%  conv 74.6%  projP95 5.33mm
        #     ang_a 20->40 alone         >1.5  9.7%  conv 80.5%
        #     lin_a  6->12 alone         >1.5  9.4%  conv 79.2%
        #     both + jerks doubled       >1.5  2.2%  conv 93.4%  projP95 0.22mm
        # (right arm same change: >1.5 3.1% -> 0.4%, conv 97.9%.) Doubling the
        # jerks alongside keeps the accel headroom reachable within dt. The
        # aggressive tier (lin_a 20 / ang_a 60) reached conv 97.7% but is not
        # taken: at 12 m/s^2 the ~3.5 kg tool's m*a transient is ~40 N against
        # the 10/12 N reflex thresholds, so watch EFT residuals during fast
        # free-space transients on the confirmation run; if spurious retreat
        # reflexes appear, this accel raise (not the reflex threshold) is the
        # first suspect. SPEED_SCALE stays 1.0 by operator decision.
        max_linear_accel_m_s2: 12.0     # 6.0 -> 12.0 (2026-08-14, binding; see above)
        # 2026-08-28: 4000.0 -> 2000.0 (and ang 8000 -> 4000), operator request, to
        # soften the acceleration transients that excite the arm's 11-13 Hz mode.
        # At dt 2 ms, 4000 m/s^3 lets acceleration swing 8 m/s^2 in ONE tick, so the
        # 12 m/s^2 ceiling is reachable in ~3 ms -- near-step acceleration, which is
        # broadband and hits that mode directly. Measured on
        # servo_log_20260828_112134/114352: the Ruckig output used only 58% of the
        # jerk limit at p50 (91% max) while acceleration ran at 45% p50 and touched
        # the 12 m/s^2 ceiling, and vibration correlated with acceleration (+0.61)
        # more than with jerk (+0.42).
        # THE 2026-08-14 CONCERN WAS CHECKED, NOT ASSUMED. That entry doubled the
        # jerks specifically to "keep the accel headroom reachable within dt", so
        # halving them risks the segment infeasibility it fixed. follower_replay on
        # THIS run's own knot stream (extracted from the chunk-row log) says the
        # cost is small, because the accel raise to 12/40 stays:
        #     left   4000/8000  >1.5 1.3%  conv 93.1%  projP95 0.25mm
        #     left   2000/4000  >1.5 2.1%  conv 90.0%  projP95 0.71mm
        #     right  4000/8000  >1.5 1.7%  conv 95.4%  projP95 0.00mm
        #     right  2000/4000  >1.5 2.0%  conv 92.7%  projP95 0.25mm
        # against the 2026-08-14 problem state of >1.5 13.9% / conv 74.6%. Nowhere
        # near it. Revert this pair (not the accels) if trembling or micro-pauses
        # of the infeasibility kind reappear -- judge with tools/follower_feasibility.py.
        max_linear_jerk_m_s3: 2000.0    # 4000.0 -> 2000.0 (2026-08-28, see above)
        max_angular_velocity_rad_s: 0.90
        max_angular_accel_rad_s2: 40.0   # 20.0 -> 40.0 (2026-08-14, binding; see above)
        max_angular_jerk_rad_s3: 4000.0  # 8000.0 -> 4000.0 (2026-08-28, paired with the linear halving above)
        discard_head_steps: 0     # v3 producer already removes rows emitted since observation
        # Match FLOW_INFER_CHUNK_EXECUTE_STEPS: consume exactly the policy
        # execution window at normal pace before decelerating into reserve rows
        # from the published runway. 2026-07-24: 12 -> 6 to match the RTC
        # freshest-chunk deployment (EXECUTE_STEPS=6, replan every 6 steps).
        # With consume 12 a late frame kept the follower running rows 7-12 of
        # the STALE chunk at full speed; consume 6 + reserve 4 instead follows
        # only the fresh window and decelerates ~178 ms into the runway tail
        # when the next chunk is late.
        # 2026-08-27: 5 -> 8 to let EXECUTE_STEPS=8 actually be consumed.
        # THIS IS A CEILING, NOT A DEMAND. ChunkWindow::activate clamps it to
        # what the frame can supply: c_eff = min(consume_steps, n - L - R), and
        # policy_runner publishes n = min(EXECUTE_STEPS + RUNWAY_STEPS, horizon).
        # So with reserve 4 and discard_head 0 this one value covers both
        # settings -- EXECUTE_STEPS=4 gives n=8 -> c_eff=4, EXECUTE_STEPS=8
        # gives n=12 -> c_eff=8 -- and an A/B needs no config change. At 5 it
        # silently capped an 8-step window at 5.
        # (Measured 2026-08-27, servo_log_20260827_210705.csv: the policy
        # predicts 24 steps and only rows 0-3 were ever executed, while the
        # right arm's per-step motion GREW across that window, 4.58 -> 5.19 mm
        # -- the depth was being left in the rows we cut off.)
        consume_steps: 8
        reserve_steps: 4 #2
        smoothing_window: 1
        # Continuous server-side conditioning of the follower's 500 Hz emitted
        # pose, immediately before IK. Disabled until offline replay acceptance.
        # 2026-07-31 evidence: policy knots were ~2x rougher than demonstrations;
        # joint-command 5-20 Hz accel energy was 16-42x UMI teleop, overlapping
        # the stand modes at ~13 Hz (right) / ~17 Hz (left). The policy path had
        # ~30 Hz bandwidth and no downstream LPF (output_moving_average_window=1).
        # A per-chunk FIR made the result worse by creating a 5.74 Hz boundary
        # comb, so this filter is continuous and has no chunk-boundary state.
        # Chaining, projection, divergence, and actual-lead stay PRE-filter. The
        # accepted added lag at nf=3.5 Hz consumes part of the 50 mm divergence /
        # 35 mm actual-lead budgets, but the expected 0.45 m/s transient is well
        # under 20 mm.
        # 2026-07-31 offline replay acceptance PASSED (recorded trembling knot
        # stream, servo_log 16:22 run, tools/follower_replay --output-smd-*):
        # accel power attenuation 13-20 Hz 89-109x / 10-13 Hz 22-31x / 5-10 Hz
        # 4.5-5.1x, task band 1-5 Hz kept at 1.15x (~7% amplitude), path
        # deviation p50 0.42 / p95 3.5 / max 9.4 mm, z_min and z_range preserved
        # (downward-travel delta is removed jitter, not lost descent). FF OFF was
        # REJECTED: stronger attenuation but deviation p95 21 mm. -> enabled.
        # OUTPUT SMD. Second-order critically-damped tracker with velocity
        # feedforward; the last shaping stage before IK.
        #
        # WHAT IT ACTUALLY DOES (transfer function, not intuition). With the FF
        # low-pass tied to nf and zeta 1 the response is
        #     H(s) = wn^2 (3s + wn) / (s + wn)^3
        # so the error is  1 - H = s^2 (s + 3 wn) / (s + wn)^3 : the velocity
        # feedforward CANCELS first-order lag outright (near-DC group delay
        # 0.07 ms), and what remains is acceleration-driven,
        #     lag = a (1/wn^2 + 2 zeta / (wf wn)) = 3a/wn^2 when wf = wn.
        # It is therefore NOT a plain low-pass: it passes 0.5-3 Hz at 1.06-1.30x
        # (peak 1.30x at 2.0 Hz) and only starts attenuating above ~4.3 Hz.
        #
        # 2026-08-28: 3.5 -> 3.0 linear. Measured on
        # servo_log_20260828_112134.csv, an 87 s left-arm rollout that vibrated in
        # several places (worst t=84 s, 8-40 Hz command-velocity rms 7.57 against a
        # 0.34 run median). Every other layer was cleared: at matched speed the
        # high-vibration windows showed follower converged 100%, stall 0%, alpha
        # 1.000, velocity/accel clamps 0.0%, plan_gate 1.000, IK residual 0.0017 mm
        # at 1 iteration -- nothing saturates. The chunk-row log (added the same
        # day, so the model's own trajectory could finally be measured rather than
        # inferred) REFUTED the policy-zigzag hypothesis: correlation between
        # vibration and the plan's 2nd-difference/step ratio is -0.147, and the
        # worst-vibration chunks are SMOOTHER than the quiet ones (direction cos
        # 0.98 vs 0.65). What separates them is speed -- their steps are 4.6x
        # larger (3027 vs 656 um). So a fast, smooth command excites an
        # 11-13 Hz structural mode the arm amplifies 1.2-2.8x (J3 worst), and the
        # only control-side lever left is to hand it less of that band.
        #
        # THE TRADE, at 12.5 Hz and in acceleration lag (measured shipped lag was
        # 0.84 mm quiet / 1.22 mm in the vibrating windows):
        #     nf 3.5  |H|=0.211  1.00x   lag 1.00x   0.84 / 1.22 mm   (was)
        #     nf 3.2  |H|=0.179  0.85x   lag 1.20x   1.00 / 1.46 mm
        #     nf 3.0  |H|=0.159  0.76x   lag 1.36x   1.14 / 1.66 mm   (now)
        #     nf 2.8  |H|=0.140  0.66x   lag 1.56x   1.31 / 1.91 mm
        #     nf 2.5  |H|=0.113  0.54x   lag 1.96x   1.65 / 2.39 mm
        # 3.0 is deliberately the small step: 24% less of the offending band for
        # +0.3 mm of lag.
        #
        # TRIED AND REVERTED, 2026-08-28 (servo_log_20260828_114352.csv against
        # servo_log_20260828_112134.csv). The change took effect exactly as
        # computed -- outSMD lag went 1.44x (p50) / 1.46x (p90) / 1.42x
        # (speed-matched) against a predicted 1.36x, and the MEDIAN 8-40 Hz
        # command-velocity rms fell 0.79x against a predicted 0.76x. The physics
        # was right and it did not help: p90 was 1.00x and the speed-matched p90
        # 1.01x, i.e. the worst windows -- the ones the operator actually sees --
        # did not improve at all, and the actual/command amplification stayed
        # 1.18-1.47x, unchanged. The tail is fast TRANSIENTS, not steady band
        # content, and uniform band attenuation does not touch them. Paying +42%
        # lag (which lands directly on chunk-following depth) for a 21% cut in
        # the quiet band was the wrong trade, so nf is back at 3.5.
        # (The comparison is not a controlled A/B -- different run, different
        # trajectory, and the AFTER run was faster: worst-window peak speed
        # 96-124 deg/s vs 62 deg/s. The lag ratio is trustworthy because it is a
        # filter property nearly independent of trajectory; the vibration ratio
        # is not, which is why the reverted verdict rests on p90 being flat
        # rather than on the max going up.)
        #
        # TWO ALTERNATIVES WERE COMPUTED AND REJECTED, both worse per unit lag:
        #   velocity_ff_lpf_hz 2.0 (keeping nf 3.5) gives |H|=0.154 (0.73x) for
        #     1.50x lag -- same attenuation as nf 3.0 at more cost, because
        #     slowing the FF re-introduces the first-order lag nf does not.
        #   damping_ratio 1.4 makes 12.5 Hz WORSE, 1.13x, while flattening the
        #     2 Hz peak; 2.0 is worse still at 1.24x. Damping is the wrong knob.
        # nf_angular_hz is untouched: the vibration measured here is translational,
        # and this repo changes one reviewed setting at a time.
        output_smd:
          enable: true
          nf_linear_hz: 3.5
          nf_angular_hz: 2.5
          damping_ratio: 1.0
          velocity_ff: true
          velocity_ff_lpf_hz: 0.0  # 0 = follow each domain's natural frequency
        # 2026-07-24: 1.0 -> 0.6 paired with smoothing_window 1. Removing the
        # positional moving-average restored waypoint fidelity but exposed the
        # model's row-to-row noise in the central-diff accel feedforward
        # (measured second-difference roughness up ~40-70% on the right arm).
        # beta damps ONLY the accel feedforward (per-waypoint micro-brake) --
        # position waypoints stay exact, so path fidelity is preserved while
        # the derivative-domain jitter is attenuated.
        # 2026-07-24 (2nd pass): 0.6 -> 0.8. Two runs at 0.6 showed descent
        # authority loss (right z_min 16-17 mm vs 9-15 mm before) WITHOUT a
        # roughness win (730/458 um) -- the accel micro-brake damps the real
        # final-approach deceleration as much as the noise. Smoothing moved to
        # the jerk caps above instead; beta stays slightly <1 as a mild guard.
        # Feedforward accel damping. af = (d_{k+1} - d_k)/dt^2, so it multiplies policy-knot noise
        # by 1/dt^2 (~900x at 30 Hz) and DOUBLES when SPEED_SCALE goes 0.75 -> 1.0 for the same
        # commanded path. Split per axis class on 2026-07-31 because the classes are nowhere near
        # each other (E1 rollouts, right arm, SPEED_SCALE 1.0):
        #     translation af p90 = 1.53 m/s^2   =  31% of max_linear_accel   (headroom)
        #     rotation    af p90 = 8.56 rad/s^2 =  95% of max_angular_accel  (saturated)
        # With rotation alone eating 95% of the accel limit, ruckig could not reach the knot inside
        # dt: right arm `converged` 1.5% / projection p90 6.3 mm, vs left 70.6% / 0.13 mm. beta=1.0
        # was costing tracking fidelity, not preserving it.
        #
        # The 2026-07-24 single-scalar sweep (1.0/0.8/0.6) was abandoned because 0.6 lost descent
        # authority (right z_min 16-17 mm vs 9-15 mm). That is a TRANSLATION regression -- the class
        # that has headroom. One scalar could not damp rotational noise without also damping the
        # real final-approach deceleration, which is exactly why this is now two knobs.
        #
        # BOTH STAY AT 1.0. Damping the rotation class was proposed from the saturation numbers
        # above and is REFUTED by the follower_replay sweep recorded under max_linear_velocity_m_s:
        # relaxing beta made feasibility WORSE, not better.
        #
        # Why the saturation reading was misleading: the cost of a segment is not |af|, it is
        # |af_target - a0| / dt -- the jerk needed to swing acceleration from the chained current
        # state to the target. a0 already carries the honest curvature, so shrinking af_target
        # ENLARGES that mismatch and spends jerk forcing the arm to arrive flatter than it is
        # actually travelling. af is a boundary condition, not a demand; a smaller one is not a
        # cheaper one.
        #
        # The binding constraint was the angular limits themselves (ang_j 540 -> 2000, ang_a 9 ->
        # 20), which is what actually moved duration/dt p50 to 1.000.
        #
        # The split is kept because it makes the knob measurable per axis class -- the earlier
        # single scalar could not separate rotational noise from the translational final-approach
        # deceleration, which is why the 2026-07-24 sweep lost descent authority (right z_min
        # 16-17 mm vs 9-15 mm) with no roughness win. Sweep with follower_replay --beta-ang /
        # --beta-lin before changing either.
        af_damping_beta_lin: 1.0
        af_damping_beta_ang: 1.0
        # Corner (direction-reversal) ring-down guard. A flanking step below the
        # deadband contributes sign 0 and cannot form a reversal pair, so a LARGER
        # deadband makes the guard ignore more wobble.
        #
        # 2026-07-31 measurement (right arm, flow-infer rollouts): the guard fires on
        # 23-41% of segments, and 17-38 points of that come from the ROTATION axes
        # alone -- translation contributes only 2-12%. Cause is a scale mismatch: the
        # policy commands ~2 mm and ~0.30 deg per 30 Hz step, and 0.30 deg split over
        # three rotation axes leaves per-axis components only 3-7x the 0.029 deg
        # default, so rotational sign noise reverses constantly. The cost is not
        # confined to the reversing axis -- ruckig time-synchronizes the segment, so
        # one braked rotation axis stretches the whole 6-DoF duration (measured
        # follower `converged` 26% -> 4-14% as corner rose).
        #
        # Values below are the historical hard-coded defaults, unchanged: this block
        # exists so the guard is measurable and sweepable, not to retune it. Raise
        # corner_deadband_ang_rad (0.029 deg -> ~0.1-0.3 deg) to test the rotational
        # -noise hypothesis; raise corner_velocity_scale toward 1.0 to soften the cut.
        corner_deadband_lin_m: 0.0003        # 0.3 mm
        corner_deadband_ang_rad: 0.0005      # 0.029 deg
        corner_velocity_scale: 0.25          # target-velocity ring-down at a reversal
        delta_twist_clear_residual_on_new_frame: true
        delta_twist_min_time_to_go_sec: 0.015
        delta_twist_tau_sec: 0.020
        delta_twist_residual_drain_steps: 1
        delta_twist_max_residual_m: 0.006
        delta_twist_max_residual_rad: 0.050
        # Must stay below the strict chunk-follower divergence latch
        # (50 mm / 0.1 rad) so lead clamp engages before safety fault.
        delta_twist_max_lead_m: 0.020
        delta_twist_max_lead_rad: 0.060
        delta_twist_stale_residual_timeout_sec: 0.15
        # Required delta_preview fail-closed bounds. These are explicit reviewed
        # config values; the loader rejects a delta_preview profile if any are absent.
        # 2026-07-17 real-run recalibration: the original 1 mm / 3-segment
        # projection budget latched on the first real-speed rollout (2.6 mm
        # excursion during a policy direction change, no contact) -- it was a
        # hardware-free provisional value. 2 mm / 5 segments still fails closed
        # ~12x under the 50 mm divergence latch. actual_lead budget (Phase 3
        # re-tighten after the contact-aware follower landed): lead is pure
        # plan-vs-robot tracking. The honest residual is fast-motion
        # servo lag -- measured ~16 mm at 0.25 m/s in the 19:29 run
        # (v_max x ~65 ms effective rbpodo lag). 2026-07-18: v_max raised to
        # 0.45 for SPEED_SCALE=1.0, so the same formula gives ~29 mm of honest
        # full-speed lag; 35 mm covers it with margin while the 50 mm
        # divergence latch remains the runaway backstop. Tighten only with
        # telemetry showing lower real lag.
        preview_max_projection_error_m: 0.002
        preview_max_projection_error_rad: 0.00436332313  # 0.25 deg
        preview_max_consecutive_projection_errors: 12 #5
        # 2026-07-18 SPEED_SCALE=1.0 operator decision: FOLLOW whatever chunk
        # the model outputs (smoothed at the configured Ruckig dynamics) —
        # sustained projection-budget breaches log a throttled warning instead
        # of latching. Runaway safety is owned by the lead gates below, the
        # 50 mm divergence latch, ROI/self-collision, and the FT hard limits.
        preview_projection_fault_policy: "warn"
        preview_max_actual_lead_m: 0.035
        # 14:51 run: the 1.0 deg angular lead budget was never scaled with the
        # speed raises — honest full-speed rotational lag is ~0.9 rad/s x
        # ~65 ms ~= 3.3 deg, so a fast wrist reorientation latched on angle
        # while positional lead sat at ~5 mm. 4 deg = pairing + margin.
        # 2026-08-26: 4.0 -> 5.0 deg. Five pi0.5 rollouts latched here at
        # 4.07-4.38 deg while positional lead sat at 15-23 mm of the 35 mm
        # budget, i.e. the angular gate was firing alone. The lead itself was
        # real (J3 pinned at its elbow limit, arm held), but the plan-freeze on
        # a blocked Cartesian solve now owns that case; this is the honest
        # rotational-lag budget with margin. Do NOT raise past the 0.10 rad
        # (5.73 deg) follower divergence latch (kPoseTrackReanchorAngTolRad):
        # above it the coarser chunk_follower_divergence fault fires first and
        # the lead diagnostic is lost.
        preview_max_actual_lead_rad: 0.08726646259       # 5.0 deg
        preview_max_consecutive_actual_lead_errors: 3
        # LEAD RE-ANCHOR BUDGET (2026-08-26). A lead breach used to latch outright.
        # It now RE-ANCHORS the plan to the reference (which removes the lead, and with
        # it the catch-up lunge that used to follow), and only latches once re-anchoring
        # has demonstrably stopped helping: more than 5 UNEXPLAINED re-anchors inside 2 s.
        # A breach that is explained (safety projection / blocked solve / throttled
        # command) is free -- its cause is known and already handled by the layer that
        # caused it, so a pinned joint recovers indefinitely rather than killing the run.
        #
        # WHY A BUDGET AND NOT A BIGGER THRESHOLD: measured over the 122 s rollout in
        # servo_log_20260826_070506.csv, BOTH lead budgets are already saturated --
        # right-arm angular lead p99.9 = 0.0855 rad against the 0.0873 limit above (98%),
        # and left-arm POSITIONAL lead peaked at 0.0354 m against its 0.035 limit (101%).
        # Raising the angular limit past 0.10 rad only hands the latch to the coarser
        # chunk_follower_divergence gate and loses the lead diagnostic (see the note on
        # preview_max_actual_lead_rad above). Threshold-chasing does not converge here.
        # SIZING: that same run produced exactly ONE legitimate re-anchor in 122 s, so
        # 5-in-2-s only ever fires when the plan is genuinely undeliverable, not when the
        # arm is momentarily behind.
        preview_lead_reanchor_window_sec: 2.0
        preview_max_lead_reanchors_in_window: 5
        # 2026-07-18 12:44: eight synchronized 10--360 ms Hold bounces in
        # 32 s repeatedly cold-seeded the follower at v=0 while the arms were
        # moving. Preserve the frozen chained position/velocity for a bounded
        # resume; longer gaps still discard the chunk and cold-start.
        hold_bounce_resume_sec: 0.5
        chunk_feed_timeout_sec: 1.5
        # 2026-09-04: fault -> hold. Same strictness (never chase a stale target through
        # the SMD) but a feed stall or a late first frame HOLDS at the reference and waits;
        # only divergence still latches. The 02:06 rollout died on chunk_feed_timeout
        # while the runner was already holding the arm (policy server at ~800 ms on a
        # shared GPU) -- a slow inference is a liveness condition, not a fault; a dead
        # runner is the client deadman's job. engage_timeout_sec is ignored under hold.
        fallback_policy: "hold"
        engage_timeout_sec: 3.0      # max wait for the first chunk frame before faulting (fault policy only)
      max_smd_goal_lead_m: 0.080
      max_smd_goal_lead_rad: 0.35
  linear_move:
    min_duration_sec: 0.05
    max_duration_sec: 10.0
    default_linear_speed_m_s: 0.03
    default_angular_speed_rad_s: 0.2
    constant_orientation_tolerance_rad: 0.005
    default_orientation_mode: constant
    # Collision-free MoveL (requires safety.init_motion_planner.enable): run the exact
    # straight path when it is collision/floor-clear, else stream an RRT joint detour to
    # the IK'd target. One click always reaches the target; reactive barrier is the net.
    collision_free: true
    collision_check_samples: 40
