schema: robotics_lab.rb_servo_server.v1

# Physical-real transition template for P5 tiny Cartesian delta. Template
# only. This tracked file keeps real Cartesian disabled and sends no Servo J
# commands; a site-local config and explicit acceptance gates are required.

left_robot:
  backend_type: rbpodo
  run_mode: real
  name: left_rbpodo_physical_tiny_cartesian_template
  ip: "172.28.60.200"
  operation_mode: real
  command_timeout_sec: 0.05
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  speed_bar: 0.05
  servo_t1_sec: 0.002
  servo_t2_sec: 0.05
  servo_gain: 1.0
  servo_alpha: 0.5
  disable_waiting_ack: false

right_robot:
  backend_type: rbpodo
  run_mode: real
  name: right_rbpodo_physical_tiny_cartesian_template
  ip: "172.28.60.201"
  operation_mode: real
  command_timeout_sec: 0.05
  initial_q_deg: [0, -30, 80, 0, 60, 0]
  speed_bar: 0.05
  servo_t1_sec: 0.002
  servo_t2_sec: 0.05
  servo_gain: 1.0
  servo_alpha: 0.5
  disable_waiting_ack: false

left_mount:
  base_pose_in_stand: [0.1601, -0.1725, 0.5825, 2.186649, 0.523831, 2.526296]

right_mount:
  base_pose_in_stand: [-0.1601, -0.1725, 0.5825, 2.186649, -0.523831, -2.526296]

servo:
  rate_hz: 500
  command_timeout_sec: 0.2
  io_model: direct
  startup_mode: Hold
  send_servo_commands: false
  enable_realtime_priority: true
  realtime_priority: 80
  cpu_core: 2
  filter_dt_min_ratio: 0.5
  filter_dt_max_ratio: 1.5
  servo_t1_rate_match_tolerance_ratio: 0.2
  allow_servo_t1_rate_mismatch: false

safety:
  q_min_deg: [-360, -360, -360, -360, -360, -360]
  q_max_deg: [360, 360, 360, 360, 360, 360]
  dq_max_deg_s: [10, 10, 10, 15, 15, 20]
  ddq_max_deg_s2: [50, 50, 50, 80, 80, 100]
  joint_wrap_period_deg: [0, 0, 0, 360, 0, 360]
  joint_wrap_for_startup_validation: true
  joint_wrap_for_motion_safety: false
  command_timeout_sec: 0.2
  max_tracking_error_deg: 1.0
  tracking_error_policy: fault_latch
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true

network:
  command_bind: "udp://127.0.0.1:50451"
  state_pub_endpoint: "udp://127.0.0.1:50551"
  state_pub_rate_hz: 50
  command_source_allowlist: ["127.0.0.1/32"]

command_source:
  enforce_lease: true
  lease_timeout_sec: 1.0

kinematics:
  enable: true
  provider: pinocchio
  urdf: "../descriptions/urdf/rb3_730e.urdf"
  base_link: "world"
  tip_link: "tcp"
  q_units: deg
  publish_tcp: true

cartesian_control:
  enable: false
  allow_in_simulation: false
  allow_in_controller_simulation: false
  allow_in_real: false
  max_twist_linear_m_s: 0.01
  max_twist_angular_rad_s: 0.05
  max_linear_move_speed_m_s: 0.005
  max_angular_move_speed_rad_s: 0.03
  max_cartesian_step_m: 0.001
  max_cartesian_step_rad: 0.005
  exceed_limit_policy: clamp

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

force_control:
  provider: null
  enable: false
