        max_linear_accel_m_s2: 1.20
        max_angular_velocity_rad_s: 1.80
        max_angular_accel_rad_s2: 5.00
        reengage_relatch_max_step_m: 0.010
        reengage_relatch_max_step_rad: 0.10
        singularity_scale_full_sigma: 0.12
        singularity_scale_floor_sigma: 0.05
