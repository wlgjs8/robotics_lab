schema: robotics_lab.rb_servo_server.v1

# =====================================================================================
# STACK CONFIG (SIM) — single source of truth for `make run MODE=sim`.
# pgmode simulation: run_mode=real, operation_mode=simulation.
# Real/sim env gates are retired; no RB_ALLOW_* envs are needed.
# =====================================================================================
left_robot:
  backend_type: rbpodo
  run_mode: real
  name: left_stack_sim
  ip: "172.28.60.200"
  operation_mode: simulation      # pgmode controller-simulation (no physical motion)
  command_timeout_sec: 0.05
  speed_bar: 1.0                  # applied at backend initialize via set_speed_bar()
  servo_t1_sec: 0.002
  servo_t2_sec: 0.021
  servo_gain: 1.0           # reverted: 0.5 caused excessive servo lag (5deg) + right servo deactivation
  servo_alpha: 10.0         # effective 1.0 = controller LPF OFF. Same transparent-executor profile as stack_real.yaml.
  disable_waiting_ack: true    # ACK-off 500Hz streaming; config-driven, no RB_ALLOW_* env gate
  state_read_pipelined: true   # non-blocking read: tick N requests, tick N+1 consumes (state ~2ms old)

right_robot:
  backend_type: rbpodo
  run_mode: real
  name: right_stack_sim
  ip: "172.28.60.201"
  operation_mode: simulation      # pgmode controller-simulation (no physical motion)
  command_timeout_sec: 0.05
  speed_bar: 1.0               # applied at backend initialize via set_speed_bar()
  servo_t1_sec: 0.002
  servo_t2_sec: 0.021
  servo_gain: 1.0                 # reverted: 0.5 caused excessive servo lag (5deg) + right servo deactivation
  servo_alpha: 10.0               # effective 1.0 = controller LPF OFF. Same transparent-executor profile as stack_real.yaml.
  disable_waiting_ack: true    # ACK-off 500Hz streaming; config-driven, no RB_ALLOW_* env gate
  state_read_pipelined: true   # non-blocking read: tick N requests, tick N+1 consumes (state ~2ms old)

# 2026-09-06: upstream ver2 -> ver1 mounts, matching stack_real.yaml. See the evidence
# block there and in tools/make_rb5_850e_urdfs.py; these must equal the
# stand->stand_<side>_arm_base transform in the tracked unified URDF.
# 2026-09-06 site mount calibration applied too (see stack_real.yaml and
# make_rb5_850e_urdfs.py MOUNT_CALIBRATION_M): sim and real must model the same cell.
left_mount:
  base_pose_in_stand: [0.16176534, 0.18457447, 0.56270534, 2.185914, 0.523132, -2.186649]

right_mount:
  base_pose_in_stand: [0.16098534, -0.18516447, 0.56214534, 2.185914, -0.523132, -0.954944]

servo:
  rate_hz: 500
  command_timeout_sec: 0.2
  io_model: direct
  startup_mode: Hold
  send_servo_commands: true
  send_at_tick_start: true   # dispatch previous tick's filtered target right after wake-up (wire jitter = wake-up latency only; +2ms command latency)
  enable_realtime_priority: true
  realtime_priority: 80
  cpu_core: 3
  filter_dt_min_ratio: 0.5
  # Final-stage joint MA: 40 ticks @500Hz = 80ms boxcar (~40ms delay).
  output_moving_average_window: 1
  filter_dt_max_ratio: 1.5
  servo_t1_rate_match_tolerance_ratio: 0.2
  allow_servo_t1_rate_mismatch: true   # servo param experiment: t1 != 2ms period accepted (was false)
  # REAL physical-motion opt-in: accept the vendor -2001 (op_stat_self_collision/robot_time
  # field-layout garbage) as unavailable instead of latching diagnostics_suspect. ONLY
  # these two fields are suppressed; everything else still faults. Fail-closed (needs
  # operation_mode==real + this config opt-in; no env gate).
  allow_real_motion_with_suspect_diagnostics: true
  # pgmode controller-simulation operation keys (proven in the 500hz_ack runs):
  allow_controller_simulation_motion: true
  allow_controller_simulation_diagnostics_suspect: true
  controller_simulation_treat_unreliable_status_fields_as_unavailable: true
  # pgmode ONLY: the rbpodo controller's op_stat_self_collision (1005) false-positives at
  # full-amplitude TcpPoseTarget replay (verified: server URDF-mesh CollisionMonitor sees no
  # real approach; ver5 FK global min clearance stays at the static rest baseline). Demote the
  # clean flag to non-latching here so scale-1.0 replay/profiling runs; the mesh CollisionMonitor
  # stays the trusted self-collision guard. Controller-sim gated → never affects real motion.
  controller_simulation_demote_self_collision_fault: true
  # Per-arm direct teaching (free-drive) opt-in. Fail-closed: without this the
  # server rejects every Freedrive command. Enabled here for VM-sim verification
  # of the toggle/resync path against the virtual control boxes.
  allow_freedrive: true
  # Rainbow VIRTUAL control box (RBVirtualSimulator VM): activation (stage 6)
  # is impossible by design ([A187]) and init_error=187 is permanently set —
  # accept both in controller-simulation operation only.
  allow_controller_simulation_init_error: true
  allow_controller_simulation_not_activated: true
  # Controller-sim advisory carve-outs are intentionally OMITTED here: they are inert in
  # real mode and must not be relied on for physical motion.
  # Async streaming (sdk_ack_worker) is a controller-simulation-only feature and is
  # rejected in real mode by config validation. Real motion uses the synchronous direct
  # send path (io_model: direct above); per-command ACK was ~176us in pgmode, well within
  # the 2ms 500Hz budget. A real send failure latches SendFailure (no advisory in real).
  rbpodo_async_streaming:
    enable: false

safety:
  # J3 (elbow) physical range on RB3-730E is +/-150 deg (catalog); the joint cannot
  # reach +/-360. Clamped here so JointTarget/InitMotion PTP (which bypass IK) and
  # shortest-path goal selection never command an unreachable J3. Mirrors the IK URDF
  # limit (rb5_850e.urdf: elbow +/-2.879793 rad); see docs/joint_range_policy.md.
  # 2026-09-02: RB3-730E -> RB5-850E, whose catalog elbow range is +/-165 (Rainbow RB
  # Series catalog p7). Mirrors stack_real.yaml, and must equal the bound in both
  # generated URDFs. This profile drives the SAME control boxes in pgmode, so it tracks
  # the physical arm, not the old one.
  q_min_deg: [-360, -360, -165, -360, -360, -360]
  q_max_deg: [360, 360, 165, 360, 360, 360]
  # Halved vs the sim profile for the first physical run.
  # dq_max_deg_s: [60, 60, 60, 90, 90, 120]      # was halved [30,30,30,45,45,60] for first run
  # 2026-09-02: [170,170,170,240,240,320] -> [170]*6. RB5-850 is +/-180 deg/s on all
  # six joints; RB3 allowed 360 on J5/J6, so J4-J6 were above the rating of the arm
  # now attached. Mirrors stack_real.yaml.
  dq_max_deg_s: [170, 170, 170, 170, 170, 170]
  ddq_max_deg_s2: [1500, 1500, 1500, 2300, 2300, 3000]  # was [1100,1100,1100,1700,1700,2300]
  joint_wrap_period_deg: [0, 0, 0, 360, 0, 360]
  # Match real stack cable-safety behavior for JointTarget/InitMotion return.
  joint_target_literal_axes: [false, false, false, false, false, true]
  joint_wrap_for_startup_validation: false
  joint_wrap_for_motion_safety: false
  command_timeout_sec: 0.2
  max_tracking_error_deg: 30.0                 # was 10: fast teleop catch-up tripped the latch
  tracking_error_policy: fault_latch
  controller_simulation_tracking_error_source: reference
  controller_simulation_tracking_error_nonlatching: true
  # This tracked profile currently targets the physical RB3-730 control boxes
  # held in pgmode simulation. Their encoders must remain still; any physical
  # motion indication is therefore an immediate server-owned fault latch. A
  # Virtual ControlBox, whose simulated q_actual legitimately follows commands,
  # needs a future explicit topology contract before it can use this profile.
  controller_simulation_physical_motion_policy: fault_latch
  controller_simulation_physical_motion_threshold_deg: 0.05
  # The threshold above sits INSIDE the encoder noise band, and the raw test is a
  # single sample. Measured 2026-08-27 (servo_log_20260827_111803.csv): the right
  # arm wandered 0.001-0.036 deg with no direction and clipped 0.051 deg exactly
  # once at t=39.75 s - a 1-LSB (0.001 deg) excursion that latched TrackingError and
  # ended the run. Real physical motion in a no-motion mode is SUSTAINED, so
  # requiring the excursion to persist 0.1 s costs the guard nothing.
  controller_simulation_physical_motion_debounce_sec: 0.1
  latch_fault_on_robot_state_error: true
  stop_both_arms_on_single_arm_error: true
  # Server-side dual-arm capsule self-collision guard — independent of the controller's
  # (suppressed/untrusted) op_stat_self_collision. ClampToHold refuses to advance toward
  # collision but never permanently latches; this is the collision net for physical motion.
  # stand + left arm + right arm을 하나의 self로 보는 캡슐 가드.
  # Checked pairs: left<->right, left<->stand, right<->stand (intra-arm 미검사).
  # 활성 mesh self-collision 가드는 dual_rb3_730e_ver5.urdf(ver2 clean stand + CoACD hull)를 사용.
  # (비활성) stand_capsules 캡슐 경로는 여전히 ver3 box 기반 — ver2 재유도 미적용(기능보존).
  # margin_m은 radius 위에 더해지는 clearance threshold (기구 오차 여유).
  # 초기 자세 최소 stand 여유 25.3mm (bone1<->mount_plate, 회귀 테스트로 고정).
  # Stand-frame safety floor: TCP z of either arm may never go below z_min_m
  # (z=0 == stand origin plane). Runtime-adjustable from the viser GUI via the
  # leaseless SetSafetyFloorZ command within [runtime_min_z_m, runtime_max_z_m].
  # JointTarget(InitMotion/jog) SMD 프로파일: 풀스피드 램프 대신 임계감쇠
  # 2차계 추종으로 부드럽게 이동. 아래 한계는 프로파일용 — 전역 dq_max/ddq_max는
  # 외곽 하드 클램프로 그대로 적용됨. (TcpPoseTarget의 pose_track_smd와 대칭)
  joint_target_smd:
    enable: true
    damping_ratio: 1.0          # 임계감쇠: 오버슈트 없음
    natural_frequency_hz: 0.50  # InitMotion/Jog를 더 부드럽게 추종해 시작/정지 jerk 감소
    max_velocity_deg_s:  [36, 36, 36, 52, 52, 68]
    max_accel_deg_s2:    [120, 120, 120, 180, 180, 240]
    # natural_frequency와 분리된 InitMotion 도착부 감속 테이퍼(발판 a/c). 최종 waypoint까지
    # 남은 거리 d로 속도상한 v≤√(2·arrival_decel·d) → 마지막 구간만 완만히 안착. 상세: stack_real.yaml.
    # sim은 fn=0.5로 자연 도착감속(≈0.368·wn·v0)이 이미 낮아 25로 더 낮춰야 체감됨.
    arrival_taper_enable: true
    arrival_decel_deg_s2: 25.0     # sim: 더 완만하게(느린 wn과 조합) 관찰용
    arrival_min_speed_deg_s: 3.0
    # 출발 테이퍼(도착 테이퍼의 대칭 짝). 근거/설계는 stack_real.yaml 참조.
    # 하한 = wn³·L/2ζ = 3.1416³·6/2 = 93 °/s³ (그 아래면 순항이 throttle된다).
    # 160 = 하한의 1.7배. sim 프로파일(fn 0.5) 40° pursuit 시뮬 실측:
    #   저크 off → 첫틱 59.2°/s², peak jerk 29,609, 순항 9.42°/s, 이동 5748 ms
    #   160      → 첫틱  0.3°/s², peak jerk    160, 순항 9.42°/s, 이동 5950 ms
    max_jerk_deg_s3: 160.0
  floor_constraint:
    # DISABLED TO MATCH stack_real.yaml (operator, 2026-09-03). Real has run with the
    # stand floor off since the ft branch: the box's own bottom face sits at the stand
    # floor (z = 0), so with the floor plane ALSO on, every table approach carried a
    # second, redundant deceleration. Real replaced that backstop with the F/T sensor
    # and kept x/y/upper limits on the ROI box. Sim was still enforcing the floor, so a
    # motion that is clean on real would decelerate here -- the opposite of what a
    # rehearsal profile is for.
    #
    # The pgmode note stands on its own: this profile commands a box in simulation, so
    # nothing here can reach the floor physically. The reason to match real is fidelity,
    # not safety relief.
    enable: false
    z_min_m: 0.0000
    runtime_min_z_m: -0.2
    runtime_max_z_m: 0.5
    fail_policy: clamp_hold
    monitor_only: false   # moot while enable is false; kept equal to real
    # PIKA 그리퍼 팁 2점 (TCP 프레임 오프셋). tcp 프레임 = 팁 평면
    # (z 247.642mm @attachment_site), jaw축 = TCP x.
    # 2026-09-10: ±0.058/±0.010 → ±0.049/0.000 — real과 같은 정정(stack_real.yaml의
    # 같은 블록 주석에 근거 전문). 요약: 기존 값은 RB3 + 순정 팁 줄자 118mm 유래,
    # 현재 값은 v15 PLA+TPU 팁을 2026-09-04 캘리퍼로 잰 full-open 98.00mm(±49.0)/
    # 0%에서 접촉(0). 이 sim 스택은 real과 같은 핑거 메쉬·같은 travel 0.049를 쓴다.
    # TCP가 회전했을 때
    # 팁이 TCP 점보다 아래로 내려가는 케이스를 잡는다. 체크는 팔당 3점(TCP+팁 2)이며,
    # projection도 같은 점들을 사용한다.
    tcp_offset_points:
      - { name: gripper_tip_a_yp, offset_m: [ 0.049,  0.013, 0.0 ], offset_closed_m: [ 0.000,  0.013, 0.0 ] }
      - { name: gripper_tip_a_yn, offset_m: [ 0.049, -0.013, 0.0 ], offset_closed_m: [ 0.000, -0.013, 0.0 ] }
      - { name: gripper_tip_b_yp, offset_m: [-0.049,  0.013, 0.0 ], offset_closed_m: [-0.000,  0.013, 0.0 ] }
      - { name: gripper_tip_b_yn, offset_m: [-0.049, -0.013, 0.0 ], offset_closed_m: [-0.000, -0.013, 0.0 ] }
  # Stand-frame ROI box (workspace limit), viser "Safety ROI box"에서 조정.
  # enable=true라야 viser Send가 허용된다(서버가 enabled 보고). monitor_only=true로
  # 시작: 박스/여유(margin)/closest_face 관찰 + bounds 튜닝만 하고 강제는 안 함.
  # 실제 차단(면 슬라이드/홀드)을 보려면 monitor_only=false로 전환.
  roi_box:
    enable: true
    # 2026-09-02: ROTATED Rz(+90 deg) into the RB5 stand frame, same reason as
    # stack_real.yaml -- these bounds are stand-frame and that frame's convention
    # changed with the robot (base->stand was +90 deg on dual_rb3_730e_ver5, identity
    # on dual_rb5_850e_ver3). An unrotated box puts the margin/closest_face readouts
    # on the wrong faces.
    #
    # 2026-09-03: BOUNDS NOW COPIED FROM stack_real.yaml (operator). This used to be a
    # permissive OBSERVATION range equal to runtime_min_m/runtime_max_m below -- i.e.
    # the box was the whole envelope the operator may drag it within, which is not a
    # workspace limit at all and made every margin/closest_face readout meaningless
    # (nothing is ever near a face that far out). A rehearsal profile that reports
    # different faces, different margins and different violations than real is not a
    # rehearsal. Verified before the change: both TCPs sit INSIDE this box at the
    # current parked pose (left [0.514, 0.292, -0.037], right [0.477, -0.258, -0.013]),
    # the tightest margin being the left arm's +y face at 108 mm -- outside the 60 mm
    # d_slow band, so the tighter box does not engage the damper where the arms stand.
    #
    # KEEP THESE TWO FILES IN STEP. real's own comment warns the far faces still need
    # confirming against the physical table (the stand changed with the robot: arm
    # spacing +/-0.157 -> +/-0.197 m, height 0.580 -> 0.570). When that measurement
    # happens it lands in BOTH files or the rehearsal silently drifts again.
    min_m: [0.300, -0.400, -0.350]
    max_m: [1.100, 0.400, 0.590]
    # runtime_* is the envelope a RUNTIME SetRoiBounds may move the box within, and it
    # is what rb_gui derives its slider limits from. z_min was -0.2 m, so the GUI could
    # not be dragged below -200 mm while laying the box out. Widened to -1.0 m
    # (operator, 2026-09-03). This does NOT move the enforced box -- min_m/max_m above
    # are unchanged; it only widens where the operator is allowed to put it.
    runtime_min_m: [-0.6, -1.2, -1.0]
    runtime_max_m: [1.6, 1.2, 1.6]
    fail_policy: clamp_hold
    monitor_only: true   # 관찰 시작; 강제하려면 false
    a_brake_m_s2: 0.5    # 2026-09-04: parity with stack_real (soft face, see the real file)
    d_slow_m: 0.08
    tcp_offset_points:
      - { name: gripper_tip_a_yp, offset_m: [ 0.049,  0.013, 0.0 ], offset_closed_m: [ 0.000,  0.013, 0.0 ] }
      - { name: gripper_tip_a_yn, offset_m: [ 0.049, -0.013, 0.0 ], offset_closed_m: [ 0.000, -0.013, 0.0 ] }
      - { name: gripper_tip_b_yp, offset_m: [-0.049,  0.013, 0.0 ], offset_closed_m: [-0.000,  0.013, 0.0 ] }
      - { name: gripper_tip_b_yn, offset_m: [-0.049, -0.013, 0.0 ], offset_closed_m: [-0.000, -0.013, 0.0 ] }
  # THE WALL BRAKE ON THE POSE-TRACK PATH (2026-09-04 pm). A streamed absolute
  # target (UMI teleop) through the pose-track SMD does not know about the reach
  # shells, the ROI box or the floors: measured on servo_log_20260904_225810.csv
  # (9 episodes), the tracker kept integrating past the shell while the joint-space
  # row held the joints, the reference ran 48 mm ahead, the 50 mm re-anchor snapped
  # it back, and the row's first cut of the un-braked command was a 7.9-9.6k
  # deg/s^2 kick. Here the tracker itself caps its approach speed at
  # sqrt(2 a_brake d) against every enabled wall (each wall's own a_brake_m_s2 /
  # d_slow_m) and holds its state standoff_m inside the wall - the same law the
  # rows enforce, applied one stage earlier, so the rows never have to cut and no
  # re-anchor trips. The rows stay as the backstop. The chunk follower has its own
  # fold (roi_fold, 2026-09-04 am); this is the absolute-target path's equivalent.
  pose_track_wall_fold:
    enable: true
    standoff_m: 0.002
  # THE HOLD FOLD ON THE CHUNK-FOLLOWER PATH (2026-09-05). While a projection row
  # (self-collision, ROI face, reach shell, floor) or the IK branch-jump throttle
  # holds an arm, book the WHOLE shortfall between the emitted plan pose and the
  # pose the arm was actually commanded to into the plan every tick. MEASURED on
  # the bimanual rollouts of 2026-09-04 23:40-23:54: the am collision fold booked
  # only what the rows removed, the velocity/acceleration clamps' share stayed
  # unbooked, the plan ran 12-39 mm ahead of the arm, and the IK's
  # branch_jump_rate_limited tick on that runaway target was a 7.1-12.0k deg/s^2
  # kick in 11 of 11 episodes (every episode with a gap under 1 mm stayed under
  # 850). Above max_step the shortfall is a snap, not a hold: declined and logged.
  hold_fold:
    enable: true
    min_step_m: 1.0e-5
    min_step_rad: 1.0e-5
    max_step_m: 0.03
    max_step_rad: 0.2
    on_ik_throttle: false   # see stack_real.yaml (2026-09-06)
  user_floor_constraint:
    # DISABLED TO MATCH stack_real.yaml (operator, 2026-09-03), together with the stand
    # floor above. This is the viser-fitted TILTED plane; it is independent of and
    # ADDITIVE to the stand floor, so leaving it on would put back exactly the layer the
    # block above just removed -- and it is the stricter of the two wherever a captured
    # plane is tilted toward the arm.
    #
    # NOTE what this also switches off: with enable false the server reports the
    # constraint disabled, and rb_gui's "User Safety Floor" Send is refused
    # (safety.send_set_floor_z checks the reported `enabled`). Capturing/fitting a
    # plane in sim needs this back at true.
    enable: false
    max_tilt_deg: 35.0
    runtime_min_point_z_m: -0.2
    runtime_max_point_z_m: 0.5
    max_margin_m: 0.2
    fail_policy: clamp_hold
    monitor_only: false   # moot while enable is false; kept equal to real
    a_brake_m_s2: 3.0
    d_slow_m: 0.06
  self_collision:
    enable: true
    # clamp_hold: 충돌 방향 명령만 직전 안전 자세로 홀드(비래치, 탈출 허용) —
    # spacemouse로 충돌을 시연해도 ResetFault 없이 계속 조작 가능.
    # 빨간 pair 오버레이는 정책과 무관하게 violated면 표시됨.
    fail_policy: clamp_hold
    monitor_only: true    # SIM-ONLY (2026-06-20 replay analysis): detect+telemetry but DO NOT block, so full-amplitude pgmode replay runs through the self-colliding region for analysis. pgmode = no physical motion. NEVER set true in stack_real.yaml (real keeps enforce).
    # URDF mesh self-collision (async monitor, servo_j 2ms 경로 밖) + 공통 velocity
    # 속도는 측정 closing speed로 자동 적응.
    mesh:
      # 2026-09-02: the tracked RB5 model, generated by
      # rb_servo_server/tools/make_rb5_850e_urdfs.py. See stack_real.yaml for why it
      # lives in this repo rather than the sibling mo_robot_descriptions checkout.
      unified_urdf: "descriptions/urdf/dual_rb5_850e_ver3.urdf"
      package_dirs:
        - "rb_servo_server/descriptions/urdf"
      # MUST be explicit: config.hpp defaults these to dual_rb3_730e_*, which against an
      # RB5 URDF now fails closed in collision_monitor.cpp instead of silently degrading.
      left_prefix: "dual_rb5_850e_left_"
      right_prefix: "dual_rb5_850e_right_"
      pika_gripper_mesh: "rb_servo_server/descriptions/meshes/robots/rb5_850e/visual/tool/pika_gripper_hull.STL"
      pika_gripper_base_mesh: "rb_servo_server/descriptions/meshes/robots/rb5_850e/visual/tool/pika_gripper_base_hull.STL"
      pika_finger_left_mesh: "rb_servo_server/descriptions/meshes/robots/rb5_850e/visual/tool/pika_finger_left_hull.STL"
      pika_finger_right_mesh: "rb_servo_server/descriptions/meshes/robots/rb5_850e/visual/tool/pika_finger_right_hull.STL"
      # 2026-09-04: 0.047 -> 0.049, MEASURED. The full-open gap between the two TPU tip
      # faces is 98.0 mm by caliper and the jaws close to contact, so each finger runs
      # 49.0 mm. 0.047 was never measured -- it was picked so the vendor CAD's finger
      # pose would close to zero gap, and that pose is 3.8 mm/side inboard of the real
      # open stop. The finger hulls above are now baked AT the open stop to match, so
      # both ends of the travel are right rather than only the closed one.
      gripper_finger_travel_m: 0.049
      stand_ignore_arm_substrings: ["link0"]
      debug_pair_curation: true
      disabled_collision_pairs:
        # Structural adjacent/base false-positive pairs. Verify these in the
        # Viser collision overlay before real operation; do not replace this with
        # a global d_hard_m or InitMotion planner margin reduction.
        - ["*left*link0*", "*left*link1*"]
        - ["*right*link0*", "*right*link1*"]
        - ["*left*link0*", "*left*link2*"]
        - ["*right*link0*", "*right*link2*"]
        # compact wrist structural false-positive: measured overlap 0%, always
        # near 19-25mm and inside d_slow. Distal gripper hull pairs still cover
        # downstream collisions from link6/attachment_site.
        - ["*left*link4*", "*left*link6*"]
        - ["*right*link4*", "*right*link6*"]
      viz_near_pairs_m: 0.06   # GUI-only: show witness tubes within 60mm (decoupled from d_slow)
      # 2026-09-05: arm<->arm and arm<->gripper floor 25 -> 40 mm, band 67 -> 90 mm
      # (operator request after the bimanual runs of 2026-09-04: the links came to
      # the 25 mm floor, measured min 24.7 mm). gripper_gripper below keeps the OLD
      # 25/67 explicitly so handovers do not tighten with this. Braking:
      # sqrt(2 * 3.0 * 0.050) = 0.55 m/s of closing speed, above the TCP ceiling.
      d_hard_m: 0.040
      # Slow-zone must satisfy d_slow >= d_hard + v_max^2/(2*a_brake) so the barrier
      # can brake a head-on approach at the command ceiling before the hard floor.
      # v_max(max_linear_velocity)=0.32, a_brake=4.0 -> d_hard+0.0128=0.0278; 0.035
      # leaves a ~20mm slow zone (stoppable up to ~0.4 m/s). (Stage 0c)
      # 2026-09-04: 0.030 -> 0.067, same braking invariant as stack_real (the loader
      # now REFUSES d_slow < d_hard + v_max^2/(2 a_brake); v_max 0.50 m/s -> 0.0667).
      d_slow_m: 0.090
      a_brake_m_s2: 3.0  # softer braking ramp near collision boundary
      hyst_m: 0.010      # 2026-06-19 anti-chatter: 0.005→0.010 (break on/off limit-cycle toggle)
      latency_s: 0.003   # small cushion for verdict/telemetry jitter without aggressive chatter
      # Intra-arm-only margin. Arm<->arm and arm<->stand keep the self values above.
      # Normal operating intra-arm clearances measured >=27mm; true near-contact is
      # retained at full link2<->link4 elbow fold, so 5/15mm catches real fold risk
      # without triggering on compact wrist constant-near geometry.
      intra_arm:
        d_hard_m: 0.005
        d_slow_m: 0.015
        a_brake_m_s2: 3.0
      swept_samples: 2          # 1=endpoint only; >=2 swept-volume (catches tunneling)
      check_intra_arm: true     # arm folding onto itself (non-adjacent links)
      max_staleness_s: 0.050
      max_near_pairs: 16
      # 2026-07-02: OS 배정(-1)으로 전환. 이전(2026-06-19)에는 전용 코어(4)에 핀했으나
      # (미설정 시 OS가 떠돌며 servo 코어 침범 가능이 사유), 이제 커널 isolcpus=3로
      # servo 코어가 스케줄러 도메인에서 제외되어 OS가 collision 스레드를 cpu3에
      # 올릴 수 없음 — tools/rt_core_isolation.sh 적용(재부팅) 후에만 -1이 안전.
      # 2026-09-04: cpu4, SCHED_FIFO 50. The monitor was the only safety-critical
      # thread with no core and no RT priority (CFS among the GUI, the runner and the
      # policy servers, max_staleness_s absorbing the jitter); it is now event-driven
      # (one evaluation per submitted target, ~1.5 ms) instead of a busy loop. cpu4
      # is added to the kernel isolation set (tools/rt_core_isolation.sh: isolcpus
      # 1-4; camera_server moved to 5-7). The loader refuses this core if it equals
      # servo.cpu_core or a worker core, and refuses a pin without a priority.
      monitor_core: 4
      monitor_realtime_priority: 50
      # Gauss-Seidel: sweep until converged (tol) rather than 3 fixed sweeps whose
      # answer depended on the noisy row order.
      projection_max_sweeps: 50
      projection_tol_rad_s: 1.0e-6
      # The nine cross-arm gripper-hull pairs as their own class. Margins inherit
      # the self set (unset). exclude_when_force_covered: while force control
      # covers BOTH arms the rows are not built (the handover contact belongs to
      # the F/T sensor); any coverage loss restores the margins on that tick, and
      # inside the floor that means no deeper, opening free -- never a latch.
      gripper_gripper:
        exclude_when_force_covered: true
        # Bare floor kept through the exclusion, matching stack_real.yaml (see the
        # evidence there: an untared sensor held coverage for 93.6 % of a 517 s rollout
        # and the grippers reached -48.7 mm).
        covered_d_hard_m: 0.005
        # 2026-09-05: pinned at the pre-2026-09-05 self values (they used to inherit
        # 25/67). NOT tightened to "exact" yet: seven real gripper-gripper contacts on
        # 2026-09-04 (mirror F/T forces, cos 0.89-1.00) happened while THIS model
        # reported 18-29 mm of clearance, so the model's relative gripper pose is
        # off by ~20 mm at the rail ends and an exact check would let them touch.
        d_hard_m: 0.025
        d_slow_m: 0.067
        a_brake_m_s2: 3.0
        hyst_m: 0.010
      # 항목 6: URDF에 없는 collision geometry(손목 카메라/케이블/작업 테이블)를
      # 추가 검사. 팔 프레임에 붙이면 그 팔로 자동 분류(좌/우), stand/world면 정적
      # 장애물로 양팔과 페어링. shape: box|sphere|capsule|cylinder.
      # TODO(operator): 실제 치수/장착 오프셋으로 채운 뒤 주석 해제할 것(추측값 금지).
      # CELL STRUCTURE (env_* geometry in the unified URDF). Today that is
      # env_stand_riser, the 307 x 324 x 295 mm block between the stand base plate
      # and the work table, which make_rb5_850e_urdfs.py emits with a <collision>
      # (ENVIRONMENT entry "collision": True). Any env_* box that opts in lands here.
      #
      # 25/67, NOT the 40/90 self set, and the reason is measured. Over 1,075 poses
      # sampled from servo_log_20260906_131740 the closest arm link came to 35.7 mm of
      # the riser (left elbow, link3), so a 40 mm floor would clamp_hold on 1.1% of the
      # postures the cell already uses and put 21.4% of them inside the slow band. At
      # 25 mm nothing in that run violates and the margin to the closest approach is
      # 10.7 mm -- comfortably outside the box's own ~6 mm position uncertainty (2.50 mm
      # fit rms + 3.3 mm arm-to-arm bias). 25/67 is also not a new pair of numbers: it
      # is what this stack shipped as its SELF set until 2026-09-05, and gripper_gripper
      # still keeps it.
      #
      # The self set is wide because arm<->arm carries ~20 mm of dual-arm relative
      # error; a tape-and-contact measured box does not, so it does not need that
      # margin.
      #
      # a_brake and hyst are deliberately NOT pinned here: they inherit the self set,
      # so a retune of the shared ramp carries into this class instead of silently
      # leaving it behind. That inheritance is load-bearing for the braking invariant
      # d_slow >= d_hard + v^2/(2*a): at the current ceiling (0.60 m/s) and the shared
      # a_brake (4.5) the requirement is 0.025 + 0.60^2/9 = 0.065 <= 0.067. Pinning
      # a_brake at 3.0 would need 0.085 and the loader refuses to start -- which is how
      # this was caught. If a_brake is ever lowered, widen d_slow with it.
      environment:
        d_hard_m: 0.025
        d_slow_m: 0.067
        recover_speed_m_s: 0.0
      extra_collision: []
      #   - { name: left_wrist_camera,  shape: box, parent_frame: dual_rb3_730e_left_attachment_site,
      #       size_m: [0.07, 0.10, 0.04], xyz_m: [0.0, 0.05, 0.05], rpy: [0,0,0] }
      #   - { name: right_wrist_camera, shape: box, parent_frame: dual_rb3_730e_right_attachment_site,
      #       size_m: [0.07, 0.10, 0.04], xyz_m: [0.0, 0.05, 0.05], rpy: [0,0,0] }
      #   - { name: work_table, shape: box, parent_frame: stand,
      #       size_m: [1.2, 0.8, 0.04], xyz_m: [0.0, -0.2, 0.0], rpy: [0,0,0] }
      # WHOLE-ARM floor: a large thin static box (world frame) so the SAME mesh
      # barrier that guards arm<->arm / arm<->stand also keeps EVERY arm link above
      # the floor (floor_constraint above only checks the TCP + offset points, so an
      # elbow/wrist can dip below it). Top face at z_m; kept == floor_constraint.z_min_m
      # so the two floors agree. The InitMotion planner avoids this box too. Raise z_m
      # to exercise whole-arm floor braking more aggressively in sim.
      external_boxes:
        enable: true
        max_count: 2
        size_m: [0.380, 0.240, 0.105]
        margin_m: [0.000, 0.000, 0.020]   # per-axis [x,y,z] box-local; x,y=SIDE, z=HEIGHT.
                                          # side 0mm + d_hard 5mm = ~5mm side keep-out;
                                          # height 20mm + d_hard 5mm = ~25mm top/bottom keep-out.
        monitor_only: true    # ENFORCE (real): velocity-damper decel/hold at the box surface
        stale_timeout_s: 0.5
        stale_policy: hold
        # BOX-ONLY keep-out barrier (SEPARATE from the floor's `external:` set below).
        # 2026-07-02 TIGHTER keep-out: shrunk from the wide 2026-07-01 zone now that
        # box-position estimates are trusted closer — height margin 40→20mm, d_hard 10→5mm,
        # d_slow 80→20mm. Slow-zone width d_slow−d_hard = 15mm still satisfies the invariant
        # d_slow ≥ d_hard + v_max²/(2·a_brake): with a_brake=6, v_max(0.32–0.40) needs
        # ≤18.3mm, so it still brakes the command ceiling (√(2·6·0.015)=0.42 m/s).
        # TRADEOFF: this drops the extra teleop-overshoot margin the 80mm zone gave
        # (that braked ~0.92 m/s); recover>0 still ejects if a fast approach penetrates.
        barrier:
          d_hard_m: 0.005          # hard floor (never cross); + margin 20mm = ~25mm from real box
          d_slow_m: 0.045          # wider slow zone: softer approach to external boxes
          a_brake_m_s2: 2.5        # softer braking reduces limit-cycle vibration near boundary
          hyst_m: 0.010            # larger hysteresis suppresses brake/release toggling from noisy box estimates
          recover_speed_m_s: 0.000 # avoid active push-out limit cycles; command away from boundary instead
          latency_s: 0.015
      ground_plane:
        # 2026-09-03: DISABLED to match stack_real.yaml (real turned it off 2026-07-09,
        # FT sensor replaces the floor backstops). It was the one floor still on in this
        # profile after the floor_constraint went off this morning, and it broke the
        # rehearsal where real would not: the RB5 init pose puts the LEFT pika fingertip
        # at stand z ~ -0.037 m, i.e. 40.6 mm BELOW this plane's top face, so every
        # InitMotion that actually had to PLAN (after a hand-guide moved the reference)
        # failed goal validation ("goal config not collision/floor clear ... left
        # pika_finger_right <-> ground_plane -0.0405 m") and held fail-closed - and
        # dropped the auto-tare with it. The first press after boot only passed because
        # the arm was already at the pose (no-op, no plan). The runtime monitor parks
        # this box when both viser floors are off, but the InitMotion planner keeps its
        # own static copy, which is what bit. Measured: servo_log_20260903_174936.
        enable: false
        # z_m: 0.001             # startup/fallback top face (used until a floor drives it)
        z_m: 0.0005             # startup/fallback top face (used until a floor drives it)
        size_m: [4.0, 4.0]      # lateral extents [Lx, Ly]
        thickness_m: 0.10
        parent_frame: world
        follow_safety_floors: true
  # Collision-free InitMotion planner (requires self_collision.enable — the mesh
  # model is the planner's collision+floor oracle). A JointTarget init_motion profile command
  # plans a collision-free + floor-safe 12-DOF (both arms) RRT-Connect path to the
  # init pose and streams it through the safety gate, so InitMotion REACHES the pose
  # from any start without self-collision or dipping below the floor (overlapping arm
  # paths allowed). Fail-closed: planning failure holds. Disabled -> direct JointTarget.
  init_motion_planner:
    enable: true
    # *** THE BOX'S REFERENCE IS THE SIMULATED TRUTH HERE, NOT THE ENCODERS. ***
    # In pgmode the box runs the motion internally and the physical arm never
    # moves, so q_actual is frozen for the whole run. Execution tracks measured
    # joints by default (correct on real hardware: init must not complete while
    # the arm lags), and that made init_motion UNRUNNABLE in sim - measured
    # 2026-08-27: q_ref followed q_sent exactly while q_actual moved 0.000 deg,
    # actual_dist_to_goal stayed pinned at 26.2885 deg, the pursuit carrot never
    # advanced past its lookahead, and every attempt stalled out after 6 s.
    # This is the same actual->reference substitution this file already makes for
    # tracking error, servo state, and divergence. Structurally inert in real mode.
    controller_simulation_progress_uses_reference: true
    max_planning_time_sec: 5.0
    max_iterations: 20000
    step_size_rad: 0.20
    edge_resolution_rad: 0.02
    goal_bias: 0.25
    shortcut_passes: 200
    sample_margin_deg: 60.0        # tight band 기본 확대
    sample_margin_deg_per_joint: [45, 75, 75, 45, 75, 30]  # J2/J3/J5 넓게, J6 좁게(케이블)
    global_sample_fraction: 0.15   # 15% wide-band 글로벌 샘플
    global_sample_margin_deg: 150.0
    collision_margin_m: 0.005
    seed: 12345
    waypoint_tol_deg: 1.5
    # 2026-09-04: "done" waits for the SENT stream to settle to this speed inside the
    # tolerance. The arrival taper floor is 3 deg/s (joint_target_smd.arrival_min_speed_deg_s),
    # so 3.5 = "the taper reached its floor": the stop that remains is 3 deg/s at ddq_max
    # instead of the 10-11 deg/s one-tick stop measured on every InitMotion (5,150 deg/s^2).
    done_max_speed_deg_s: 3.5
    noop_tol_deg: 0.75              # 이미 init 자세 근처면 불필요한 escape wiggle 없이 no-op 완료
    max_segment_deg: 3.0
    execution_lookahead_deg: 6.0    # smaller = smoother/slower InitMotion streaming; done uses measured joints
    execution_timeout_sec: 45.0     # once started, drive to completion across command staleness (one click); give up after this
    # 2026-08-19 brake-before-plan: 정책 스트리밍 중(또는 a→c 연타로 실행 중인 init을 재계획할 때)
    # InitMotion이 들어오면 예전엔 송신 목표를 즉시 측정 관절로 스냅+Hold했다 → 추종 지연만큼
    # 0.2~0.7°를 한 틱(2ms)에 역행(송신속도 100~350°/s 스파이크, 손목 F/T 8~26N, 툴 9.5Hz 링잉;
    # servo_log_20260819_085404 t=130.94/152.28). 이제 선택된 팔이 움직이는 중이면 마지막 송신 목표에서
    # joint_target_smd 프로파일로 단조 감속(goal=q+dq/wn, 역행 없음)한 뒤 정지 상태에서 측정 재앵커+계획.
    # 정지 상태에서 누른 경우는 기존 경로 그대로. 끄려면 brake_before_plan: false.
    brake_before_plan: true
    brake_enter_deg_s: 1.0          # 선택 팔 중 한 관절이라도 송신속도가 이보다 크면 감속 먼저
    brake_exit_deg_s: 0.5           # 모든 선택 관절 송신속도가 이 아래면 감속 완료 → 계획
    brake_timeout_sec: 0.75         # 감속 상한(그래도 안 멈추면 그냥 계획; 정상은 ~0.2~0.3s)
    brake_max_travel_deg: 3.0       # 관절당 dq/wn 정지거리 상한
    # 2026-09-04: planning은 측정 관절에서 하되, 명령 스트림(prev_sent)은 측정과의
    # 차이가 이 값 이상일 때만 측정 관절로 스냅한다. 그 아래면 추종 잔차(정지 시
    # 0.02~0.03°)일 뿐이라 스트림을 잇고 joint_target SMD가 첫 웨이포인트로 가며
    # 흡수한다. 실측: 스냅 한 틱에 4.7~6.7k deg/s² (InitMotion 전체 최대 가속). 0 = 항상 스냅.
    command_reanchor_deg: 0.5

network:
  command_bind: "udp://127.0.0.1:50256"
  # Ruckig chunk-follower ingest (parity with stack_real; follower profiles are
  # enabled per-profile, so this alone changes nothing). 50263 belongs to the
  # scope dashboard (servo_scope_dashboard.py DEFAULT_CHUNK_LISTEN).
  chunk_frame_bind: "udp://127.0.0.1:50264"
  state_pub_endpoints:
    - "udp://127.0.0.1:50356"  # joint scope dashboard
    - "udp://127.0.0.1:50366"  # viser GUI
    - "udp://127.0.0.1:50376"  # make run teleop_mux policy_runner
    - "udp://127.0.0.1:50378"  # external flow-infer readback alongside make run
  state_pub_rate_hz: 100
  command_source_allowlist: ["127.0.0.1/32"]

# Forward arbitrated per-arm gripper setpoints (left/right.gripper in the command
# packet) to the out-of-process gripper_server, and stamp its gripper_state.v1
# feedback into the published state JSON (consumed by the viser gripper viz).
# Launched by tools/run_stack.sh (sim backend in MODE=sim).
gripper:
  enable: true
  command_endpoint: "udp://127.0.0.1:50410"   # -> gripper_server command bind
  feedback_bind: "udp://127.0.0.1:50420"       # <- gripper_server state publish
  forward_rate_hz: 50

command_source:
  enforce_lease: true
  lease_timeout_sec: 60.0

logging:
  enable: true
  directory: "./logs"
  flush_period_ms: 100
  queue_capacity: 4096

kinematics:
  enable: true
  provider: pinocchio
  urdf: "descriptions/urdf/rb5_850e.urdf"
  # sim: the URDF nominal, no box query (2026-09-05; the real stack reads the box DH).
  calibration:
    source: nominal
  base_link: "world"
  tip_link: "tcp"
  joint_names:
    - base_joint
    - shoulder_joint
    - elbow_joint
    - wrist1_joint
    - wrist2_joint
    - wrist3_joint
  q_units: deg
  publish_tcp: true
  ik:
    # MINIMUM SOLVER STEPS before the tolerance test may accept (2026-08-28). The
    # test sits at the TOP of the iteration, so 0 lets the solver return the SEED
    # whenever the new target is already inside position_tolerance_m of the pose the
    # previous sent joints reach. Streaming Cartesian control asks for less than that
    # on every slow tick, so the joint command came out as a staircase -- hold N
    # ticks, then one lump step, and that step always leaves from a standstill so it
    # trips the acceleration limiter at ddq_max*dt.
    # MEASURED (servo_log_20260827_234302.csv, 34 s of pi0.5 rollout): 4.3% of the
    # RIGHT arm's ticks returned 0 iterations, and on those the commanded second
    # difference was 13x the rest of the run (7554 vs 570 mm/s^2). Essentially all of
    # that arm's command roughness came from 4% of its ticks. The LEFT arm spent
    # 23.3% of ticks with a sub-tolerance reference step.
    # The dead zone was not filtering noise: across 3864 (left) / 655 (right)
    # consecutive sub-20 um reference steps, the cosine between one step and the next
    # was +1.00 on 100% of them -- the reference moves smoothly below the tolerance,
    # so the dead zone was quantizing a smooth signal rather than rejecting a rough
    # one. Cost of the extra step: 1.02 us -> 6.16 us on the affected ticks, against
    # a worst-case loop margin of 405 us in 2000 us.
    # Set 0 to restore the dead zone. The no-noise measurement above covers the chunk
    # follower path only; SpaceMouse / UMI teleop references were not re-measured.
    min_iterations: 1
    enable: true
    # UNIFIED-TO-REAL (2026-06-21): control/IK tuning matched to stack_real.yaml so
    # sim validates exactly what real runs. Real's values are the more conservative
    # (more DLS damping, wider singular region, more iterations, looser tol).
    max_iterations: 100
    timeout_ms: 20.0
    damping: 0.02
    # ANTI-TREMBLE (was 0.002 / 0.005): the tolerance is a DEAD ZONE for the
    # 500Hz streaming TcpPoseTarget path — solveIk returns the seed (q_actual)
    # unchanged whenever the tracking error is inside it. At teleop speeds
    # (10-25mm/s) the steady-state tracking error (speed x ~100ms servo lag)
    # sits exactly at the old 2mm boundary, producing a 3-5Hz relay limit
    # cycle (= 1/(2 x loop delay)). Tighter tolerance shrinks the dead zone
    # so the solver actually iterates each tick; typical cost 1-3 DLS steps.
    position_tolerance_m: 0.00002
    orientation_tolerance_rad: 0.0002
    max_step_deg: [2, 2, 2, 3, 3, 4]
    # Selective singularity-robust damping (shared by all position-IK
    # primitives). Keeps the solver on the seed branch near a singularity so a
    # near-zero Cartesian command can't trigger a multi-degree single-tick joint
    # flip; the arm keeps tracking with a small Cartesian lag, never holds.
    # DEFAULT OFF until tuned: sigma_min is ~0.004 even in healthy poses, so set
    # eps below that from the ik_sigma_min telemetry at an ik_branch_jump=1 tick.
    singular_region_eps: 0.1   # UNIFIED-TO-REAL (was 0.06 TUNE-3): wider singular region = earlier damping = safer
    damping_max: 0.08           # TUNE-4 reverted: 0.20 made it FAIL EARLIER (over-damped). exact wrist singularity (sigma_min=0) cannot be solved by damping at any strength.
    max_solution_jump_deg: 4.0
    # Branch-jump CLAMP (acts, not just observes). When a converged solve still
    # jumps > max_solution_jump_deg from the seed: re-solve the SAME tick at
    # branch_jump_damping_scale x damping (escalating per retry) to pull it back
    # onto the local branch; if it still jumps, hold the SEED (zero motion this
    # tick) instead of flipping to a distant branch. Telemetry ik_branch_jump_clamped
    # (state + twist_pipe.csv). Selective singular damping is OFF here (0/0), so the
    # re-solve scales the base damping only; clamp_to_seed is the final fallback.
    branch_jump_damping_scale: 10.0
    branch_jump_max_retries: 2
    branch_jump_clamp_to_seed: false
    branch_jump_rate_limit: true    # TUNE-2 (2026-06-20): was MISSING in sim (real has it). Scale seed->solution delta so largest joint step = max_solution_jump_deg; smooth advance toward solution instead of "plain allow" branch FLIP. The real lever for these jumps.

cartesian_control:
  # rad): the integrated goal may not lead the measured TCP by more than this,
  # bounding run-away when the arm stalls and the recovery lurch. Engages only on
  # Telemetry smd_goal_clamped (state + twist_pipe.csv).
  enable: true
  # 실기 CB pgmode simulation에서는 q_actual이 명령을 추종하지 않으므로(물리 무동작),
  # 스트리밍 Cartesian 적분 기준은 controller reference(jnt_ref)여야 함.
  # 기본값 actual이면 타깃이 매 틱 제자리에 고정되어 twist가 수 mm만 가다 멈춤.
  controller_simulation_servo_state_source: reference
  # divergence 가드도 reference 기준이어야 함 — actual 기준이면 적분 명령이
  controller_simulation_divergence_source: reference
  allow_in_simulation: true
  # This tracked launch config is controller-simulation-only. A mistaken switch
  # to operation_mode=real must not inherit Cartesian motion authority.
  allow_in_real: false
  allow_in_controller_simulation: true        # pgmode controller-simulation
  warn_ik_duration_us: 3000
  fail_ik_duration_us: 5000
  # runs the pose_track_smd feedforward chain (quintic profile, no measured-
  # state feedback), same as streaming TcpPoseTarget.
  path_kp_pos: 3.0                # anti-tremble (was 6.0): less reactive to tiny errors
  path_kp_ori: 3.0                # anti-tremble (was 6.0)
  velocity_damping: 0.08          # anti-tremble (was 0.01): damp IK velocity solution
  # Low-speed first-run Cartesian limits (sim profile used 0.2 / 0.4 / 0.002 / 0.02).
  # joint headroom checked (~15deg/s vs dq_max 120deg/s, 0.2mm/tick @500Hz).
  max_linear_move_speed_m_s: 0.05
  max_angular_move_speed_rad_s: 0.1
  max_cartesian_step_m: 0.01
  max_cartesian_step_rad: 0.1
  
  exceed_limit_policy: clamp
  # Keep the command-facing profiles identical to stack_real.yaml. The only
  # control difference is the pgmode feedback source above (tcp_ref/q_target),
