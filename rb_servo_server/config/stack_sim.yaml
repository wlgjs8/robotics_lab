# =============================================================================
# FORCE / TORQUE + FORCE CONTROL (pgmode controller-simulation)
# =============================================================================
# Copied from stack_real.yaml so the LAWS AND GAINS UNDER TEST ARE THE SHIPPED
# ONES. The F/T reading itself is REAL: the wrench arrives on the box's `eft`
# channel (RobotState::eft_wrench) from the physical sensor, and pgmode does not
# simulate it away.
#
# *** WHAT THIS LANE CAN AND CANNOT PROVE (read before trusting a green run). ***
# In pgmode the box runs the motion internally and the arm does NOT move, so the
# force loop's feedback path is OPEN: push by hand and the sensor answers, the
# overlay builds a deviation and the COMMAND moves, but the arm never moves, so
# the sensor never answers the arm's own motion. The 2026-08-27 runaway closed
# exactly that loop (command -> arm accelerates -> F/T reads the inertial
# reaction -> overlay -> command), so it is NOT reproducible here.
#
#   Provable here: the overlay math, coverage/refusal reasons, the flap
#     hysteresis, the load-aware Hold nominal refusal, the deactivated-box latch,
#     and what the COMMAND does under a real wrench.
#   NOT provable here: that the oscillation guard suppresses a real runaway.
#     That needs hardware, at low speed, with the guard armed.

force_torque:
  enable: true
  # Tell the control box the payload is ZERO so it subtracts NOTHING from the F/T
  # output, and compensate the tool here instead. Not sending leaves the box holding
  # whatever the pendant or CM last set — a compensation of unknown size that ours
  # would then run on top of. CM measured that double-compensation as ~20 N.
  #
  # THE COST, ACCEPTED: the box's own collision detection runs on this payload, so
  # with zero it sees the tool's weight as an external force.
  push_zero_payload_to_box: true

  # ---- TOOL-INERTIA COMPENSATION (2026-09-15) -----------------------------------
  # The sensor reads the tool's inertial reaction -m*a exactly as it reads its weight
  # m*g, and the box compensates neither. With the force law isotropic every axis now
  # sees it. MEASURED on the first policy run under the one law (servo_log_20260915_
  # 153420, 62.8-63.0 s): the compensated |F| tracked the tool's own TCP acceleration
  # with |F| / (m*|a|) = 1.0 and cos 0.85 on BOTH arms - 12 N at the policy's 12 m/s^2
  # start (0.81 kg) - which the law read as contact, yielded and gated against; the
  # executor answered with more acceleration, 30 N, 15,000 deg/s^2 and
  # accepted_deviation within 0.25 s. Gravity generalises to m*(g - a).
  # a is the COMMANDED tool-COM acceleration (the measured joints are too noisy to
  # differentiate: 27 N p99 from a 9-sample fit, 2026-09-11) read command_delay_ticks
  # back: the sent command reaches the sensor's flange ~28 ms later on this cell (lag
  # scan on the same run: cos peaks at 14-16 ticks; 22 ms wire + F/T sample). Above
  # max_accel_m_s2 the term is zeroed and flagged (*_ft_inertia_valid 0): a hold snap or
  # a resync jump, never a trajectory. Logged as *_ft_inertial_sensor_* beside gravity.
  inertia_compensation:
    enable: true
    command_delay_ticks: 14
    max_accel_m_s2: 30.0

  # ---- AUTOMATIC TARE ON InitMotion -----------------------------------------
  # Pressing InitMotion re-zeros that arm's sensor. The operator no longer has to
  # remember a separate tare, which is the failure that leaves force control refusing
  # to cover an arm (or worse, regulating against yesterday's zero).
  #
  # *** IT DOES NOT SAMPLE WHEN THE MOVE STARTS. *** A tare averages `raw - gravity`
  # over 250 ticks (0.5 s), and during the move the arm's own acceleration and the
  # tool's swing land in that average as force. The REQUEST arms it; the samples are
  # taken after the arm reaches the init pose and stands still. In the common case the
  # arm is already parked at the init pose, so the server's no-op path completes
  # instantly and the zero lands ~settle_sec later without any motion at all.
  #
  # THE OPERATOR'S CHECK IS UNCHANGED: whatever load stands at the init pose becomes
  # the new zero. Automatic means nobody pressed the button, not that anybody looked
  # in the gripper.
  auto_tare_after_init_motion:
    enable: true
    # Mechanical settle at the init pose before the first sample. The arrival taper
    # ends with the tool still ringing; 0.5 s is one full tare window of quiet ahead
    # of the tare itself.
    settle_sec: 0.5
    # ... and the command must actually be stopped. Read off the last SENT joint
    # velocity (the surface brake-before-plan uses), not the measured joints, which
    # keep jittering at rest. Same order as init_motion_planner.brake_exit_deg_s.
    max_sent_speed_deg_s: 0.5
    # Drop the old zero the instant InitMotion is requested, so an InitMotion that
    # fails or is cancelled leaves the arm with NO zero and force control refuses it,
    # rather than silently keeping a zero the operator believes was just refreshed.
    invalidate_on_request: true

  left:
    enable: true
    sensor_name: "RFT64-6A01-A"
    tool_name: "pika"

    # flange -> SENSING REFERENCE ORIGIN. Only relates the sensor origin to the
    # flange; it is NOT applied to the reading (the torque is referenced AT the SRO).
    # Matches the URDF ft chain: attachment_site +15 mm (ft_sensor_base) +30 mm
    # (ft_sensor_measurement) = 45 mm.
    sensor_offset_mm: [0.0, 0.0, 45.0]

    # *** THE MEASURED SENSOR AXES, AS BASIS COLUMNS IN THE FLANGE FRAME. ***
    # CM converged these on the cell (left arm, 2026-08-16, two hand-push rounds on
    # the raw wrench): round 1 pinned the permutation, round 2 caught the remaining
    # sign. det = -1 — the unit reports in a LEFT-HANDED axis set, and that is
    # CORRECT. Do not "fix" it, and do NOT copy the URDF's ft_sensor_base_joint yaw
    # (+90 deg, det +1): that is the nominal MECHANICAL placement and disagrees with
    # this measured electrical relabel by a sign flip.
    axes:
      fx: [ 0.0, -1.0,  0.0]
      fy: [ 1.0,  0.0,  0.0]
      fz: [ 0.0,  0.0, -1.0]

    # The sensor's own weight. Informational: the box compensates the sensor stack.
    sensor_mass_kg: 0.175
    sensor_com_mm: [0.0, 0.0, 21.5]

    # SOFT per-axis dead-band on the COMPENSATED outputs only. 2 N is ~204 g, which
    # is why the tool-load estimate exists to read below it.
    # 2.0 -> 3.0 N (2026-09-03): the raw stream's own p-p is 2.9 N (liveness check at
    # boot), so a 2 N band let noise through on 7.6 % of hand-off ticks (measured
    # above). 3 N is one full noise p-p; the tool-load estimate reads below it. The
    # torque band stays at 0.5 Nm - rotation is rigid on both laws now.
    deadzone_force_n:  [3.0, 3.0, 3.0]
    deadzone_torque_nm: [0.5, 0.5, 0.5]
    tool_load_tau_s: 1.0

    # SRO -> TCP. NOT flange-relative: the sensor stack already contributes its
    # 45 mm, so flange -> TCP = 45 + 202.642 = 247.642 mm — which is exactly the
    # URDF's tcp_joint origin (0.247642 m, rpy 0). The TCP is the pika FINGERTIP
    # CENTRE PLANE. Stating a flange-relative number here would put the TCP 45 mm
    # too far out, i.e. reaching past the workpiece, with nothing on screen to say why.
    tool_xyz_mm: [0.0, 0.0, 202.642]
    tool_rpy_deg: [0.0, 0.0, 0.0]      # flange-aligned; jaw axis = TCP +/-x

    # MEASURED, not CAD-nominal. CM `ft identify` 2026-08-17 14:08, residual 0.62 N.
    # The pika CAD's own +90 deg yaw is baked into the exported meshes, not the TCP
    # frame, so it does not appear here.
    # Parity with stack_real: re-identified 2026-09-06 (see the real file's note).
    tool_mass_kg: 0.8137
    tool_com_mm: [0.32, 1.88, 27.84]    # SENSOR frame, from the SRO

    # The point the applied-force torque is referenced to. A two-finger gripper
    # applies its force AT THE FINGERTIPS. It lands on the same 202.642 as the TCP
    # because robotics_lab DEFINES the TCP at the contact plane — it does not follow
    # the TCP, and would not move with it.
    applied_force_mm: [0.0, 0.0, 202.642]

    # No bias on file: the bias is a SENSOR ZERO and belongs to a tare, not to a
    # config. Force control REFUSES to cover an arm that has never been tared, so
    # send TareForceSensor with the arm still and carrying nothing but the tool.

  right:
    enable: true
    sensor_name: "RFT64-6A01-A"
    tool_name: "pika"
    sensor_offset_mm: [0.0, 0.0, 45.0]
    # The SAME product on the same flange design. The triad was converged on the LEFT
    # arm; if this arm's own 7-pose fit ever disagrees, that fit wins for this arm.
    axes:
      fx: [ 0.0, -1.0,  0.0]
      fy: [ 1.0,  0.0,  0.0]
      fz: [ 0.0,  0.0, -1.0]
    sensor_mass_kg: 0.175
    sensor_com_mm: [0.0, 0.0, 21.5]
    # 2.0 -> 3.0 N (2026-09-03): the raw stream's own p-p is 2.9 N (liveness check at
    # boot), so a 2 N band let noise through on 7.6 % of hand-off ticks (measured
    # above). 3 N is one full noise p-p; the tool-load estimate reads below it. The
    # torque band stays at 0.5 Nm - rotation is rigid on both laws now.
    deadzone_force_n:  [3.0, 3.0, 3.0]
    deadzone_torque_nm: [0.5, 0.5, 0.5]
    tool_load_tau_s: 1.0
    tool_xyz_mm: [0.0, 0.0, 202.642]
    tool_rpy_deg: [0.0, 0.0, 0.0]
    # CM `ft identify` 2026-08-17 14:10, residual 0.59 N. 1.1 % from the left arm's
    # mass and under 1.5 mm in CoM — two units of one product, measured separately
    # and kept separately, because each arm compensates with its OWN sensor.
    tool_mass_kg: 0.8139
    tool_com_mm: [-1.00, 3.02, 26.62]
    applied_force_mm: [0.0, 0.0, 202.642]

# =============================================================================
# FORCE CONTROL - ONE LAW, ONE STAGE, ANY SOURCE (2026-09-15, operator: "hold / stream
# 구분 없이, 더 범용적인 force control").
#
#     m*v' + b*v = (|F| - rest_force_n)+ * F_hat      translation VECTOR, stand frame, k = 0
#
# F is the compensated, PRE-deadzone physical force at the TCP (low-passed by
# wrench_filter_hz), F_hat its direction. |F| <= rest_force_n: nothing moves, in ANY
# direction (free space is never sought). Above it the arm yields ALONG the measured
# force at (|F| - rest)/b whatever the direction - 24 N -> 8 mm/s, 30 N -> 20 mm/s - and
# STAYS where it was dragged: every tick the deviation is folded into the source's
# plan (plan == arm, no standing offset, no spring-back). Rotation is RIGID.
#
# WHO DRIVES THE PLAN IS A SOURCE OF THIS STAGE, NOT A LAW:
#   chunk_follower  a policy plan; demand = its advance, the fold moves the plan.
#   hold            a Hold under force control is ALWAYS a zero-demand source: it yields
#                   to a hand above rest_force_n, stays, and its pose is walled at the
#                   ROI/floor. No latch, no relatch guard, no separate law.
#   absolute        an absolute TcpPoseTarget (UMI teleop): demand = the raw target's
#                   step rate, the fold is declined (the source re-issues its target)
#                   and max_deviation_m below is its dead backstop.
#
# THE GATE (CM 0049) cuts only the SOURCE's advance INTO F_hat, judged on |F|:
#   g = (v_cross/v_s)^((|F|/peak_force_n)^2), v_cross = (peak - rest)/b = peak_vel_mm_s,
# so the gate's speed at peak_force_n IS the law's yield there and a streamed contact
# converges at peak_force_n for every demand (verified 12.00 N at 30/60/150 mm/s in the
# closed-loop model, test_force_control). A Hold has demand 0 -> g = 1 by construction.
#
# KNOWN LIMIT: the projective cut leaves the advance perpendicular to F_hat alone, so
# under FRICTION the normal force settles above the declaration (mu 0.3: ~12.3 N at
# 30 mm/s, ~15.8 N at 150 mm/s). A deadlock ("gate shut, law at rest") is impossible:
# the law always has a yield direction. The impact PEAK is v*sqrt(k_env*m) and is not
# bounded by any number here (39.5 N measured at a 115 mm/s approach).
#
# WHAT WAS HERE BEFORE (a `stream` law + a `hold` law, per-axis {m,b,k,mode} triads,
# one declared tool-z press axis, the 5/2 N hand-guide latch, the 5 N relatch guard,
# `hold_compliance`, `fold_deviation`) is refused by the loader with a dated message.
# The measured history that justified each of those keys lives in git
# (rb_servo_server/config/stack_real.yaml before 2026-09-15) and in AGENTS.md.
# =============================================================================
force_control:
  enable: true

  law:
    # [kg] the virtual mass; tau = m/b = 40 ms. b is NOT typed - it is DERIVED below
    # ((24 - 20) N / 8 mm/s = 500 N*s/m). 20 kg since 2026-09-11 (m = 2*b*dt is the
    # loader's floor at this b: 2 kg).
    translation: {m: 20.0}
    rotation: rigid

  # THE CONVERGENCE PAIR (CM wiki/decisions/0049, adopted 2026-09-11).
  #   peak_force_n   the force a STREAMED contact converges to, at any demand.
  #   rest_force_n   the law's rest point: at or below it nothing moves, in any
  #                  direction; a hand or a stopped press rests here. OURS, not CM's
  #                  (CM runs rest = 0 and accepts F -> 0 when the plan stops).
  #   peak_vel_mm_s  the yield speed AT peak_force_n. It DERIVES the law's b:
  #                  b = (peak - rest)/peak_vel = 2 N / 4 mm/s = 500 N*s/m.
  # 10 N was this cell's threshold from 2026-07-24 to 2026-09-15; 20 N is the operating
  # value since 2026-09-15 (evening, operator). WHY IT MOVED: on the 15:57 policy run the
  # arm's OWN dynamic force - 15-24 Hz tool/servo ringing excited by the executor's
  # 12 m/s^2 re-plans, 68-78 % of the force energy, zero contact - sat at 5-15 N after the
  # inertial term, and at v_cross/v_s ~ 0.03 the curve reads g(5 N) = 0.55, g(8 N) = 0.22:
  # half the plan cut for a force that was the robot shaking. Doubling rest/peak puts
  # that residual at g(5 N) = 0.87 with the same b; peak_vel doubles with the span so b
  # stays 500 N*s/m (tau 40 ms) and v_cross doubles to 8 mm/s, which also moves the
  # operating point out of the curve's steepest tail. Paired with wrench_filter_hz 3.0
  # below (the other half of the same fix).
  # b is the only delay-margin knob (docs/reference/force_control_stability_margin.md):
  # at b 500 the loop is stable against contacts below ~15 kN/m (the TPU fingertips),
  # marginal against a rigid jig. To raise b, lower peak_vel_mm_s.
  force_gate:
    enable: true
    peak_force_n:   24.0
    rest_force_n:   20.0
    peak_vel_mm_s:   8.0
    close_tau_s: 0.10       # fast to close - protective
    # 0.40 s = CM's shipped value and 2x their measured ringing boundary (below 200 ms
    # the contact loop sustains a limit cycle). 0.15 s was tried on 2026-09-11 and rang:
    # the gate's median authority doubled and the 5-15 Hz ripple grew 50 %. Slower only
    # rectifies (1.0 s: 5.5x below the curve's own value).
    open_tau_s:  0.40

  # A DEAD BACKSTOP, not an operating limit: on a fold path (chunk_follower, hold) the
  # deviation is booked into the plan every tick and never accumulates here; only the
  # absolute-target source (fold declined) can reach it.
  max_deviation_m: 0.040
  max_deviation_rad: 0.2617993878     # 15 deg

  # How FAST the deviation may grow (norm caps on the vector law). NOT the fence:
  # deleting these would not be "no limit", it would be an unbounded per-tick jump.
  max_velocity_m_s: 0.50
  max_acceleration_m_s2: 5.0
  max_velocity_rad_s: 2.00
  max_acceleration_rad_s2: 20.0

  # CONTACT-BAND LOW-PASS ON THE WRENCH VECTOR THE GATE SEES (2026-08-27, corner moved
  # 2026-09-15; GATE-ONLY since the same night, see law_filter_hz below). Filters FORCE,
  # not motion; the servo command path keeps its own
  # filters off. The logged/published wrench stays the RAW measurement; the filtered one
  # is *_fc_wrench_filt_*. It is applied to the VECTOR before the magnitude, which is
  # what makes it work against ringing (a low-pass on |F| would rectify the ringing into
  # a DC offset instead).
  # 3 Hz (2026-09-15 evening, operator): the force the sensor reads while the arm MOVES
  # is the arm's own dynamics, not contact - measured on the 15:57 policy run 68-78 % of
  # the force-vector energy sat in 15-60 Hz (peaks 16-24 Hz: the 0.8 kg pika on its
  # 200 mm lever ringing to the executor's 12 m/s^2 re-plans), 0 % below 4 Hz, |F| p50
  # 20-27 N with nothing touched, and the law + gate answered it as contact (the loop
  # closed in ~80 ms, 6-12 Hz). Replayed through this filter the same vector reads p50
  # 4 N / p90 7-11 N (5 Hz: 6 N / 12-17 N). Contact is DC to a few Hz and passes with
  # ~50 ms of lag, which the gate's own 100 ms close_tau already dwarfs; the impact peak
  # was never the gate's to catch. 0 = raw wrench (the 2026-09-07 A/B posture).
  wrench_filter_hz: 3.0
  # THE LAW'S OWN INPUT (2026-09-15 night). Fed the 3 Hz vector above, the law saw
  # 2-14 N of a 40-84 N intermittent contact (a few-ms spikes, 22 % of ticks < 2 N) and
  # never yielded while the preview executor plowed the left tool 40 mm into the objects
  # position-controlled (servo_log_20260915_161234, 11.0-11.85 s; gate >= 0.87, yield 0).
  # The yield must answer a real impact within milliseconds, so the law reads its own
  # pole: 25 Hz is the 2026-08-27 shock filter (takes the single-tick 53.8 N burst out,
  # ~6 ms lag). What keeps the arm's own 5-15 N ringing out of the yield is rest_force_n
  # (20 N), not this filter. The loader refuses law_filter_hz below wrench_filter_hz;
  # 0 = raw wrench to the law.
  law_filter_hz: 25.0

  # OSCILLATION GUARD (2026-08-27 incident, servo_log_20260827_101144.csv): >= 4
  # velocity-direction reversals at >= 35 % of the cap within 0.75 s freezes compliance
  # until the PHYSICAL wrench stays below the release thresholds for 0.5 s. The rate
  # caps bound amplitude per tick; they cannot see a limit cycle. This can.
  oscillation_guard_enable: true
  oscillation_min_reversals: 4
  oscillation_window_sec: 0.75
  oscillation_min_velocity_frac: 0.35
  oscillation_release_force_n: 5.0
  oscillation_release_torque_nm: 0.5
  oscillation_release_quiet_sec: 0.5

  # Coverage flap hysteresis (2026-08-27): after ANY uncovered tick the raw verdict
  # must hold this long before compliance re-covers (measured 226 flaps in 10 s
  # against E-stopped boxes without it).
  coverage_recover_sec: 0.5
  # The Hold source's pose is latched at the last COMMANDED TCP (FK of the previous
  # sent joints, deviation stripped), not the measured TCP, which trails the stream by
  # the box's ~22 ms and re-targeted the arm backwards on every pedal release
  # (2026-09-04). Above this command/measured gap the measured pose is latched instead.
  hold_latch_max_command_gap_m: 0.020

  # THE OVERLAY MAY NOT INTEGRATE AGAINST A COMMAND THAT IS NOT REACHING THE ROBOT
  # (2026-08-26: a queue-sync deadlock wound the command 54 deg out). The test is
  # RATE, not distance: the box's own reference must advance at >= min_ratio x our
  # rate while we move faster than min_rate_dps. 0.05 is three times below the
  # measured healthy floor (0.156) and far above a dead link (0.000).
  command_execution_tau_sec: 0.20
  command_execution_min_rate_dps: 5.0
  command_execution_min_ratio: 0.05

  # Refuse to compose onto a nominal older than this - a deviation composed onto a
  # stale pose is a command nobody authored.
  max_state_age_sec: 0.05
