experiments:
  - name: gene_4s_tau_004
    profile: gene_15cm_4s
    allow_fast_stress: true
    controller: twist_stand
    arm: left
    command_rate_hz: 500
    repeat: 5
    server_config: rb_servo_server/config/dual_simulator_circle_stress_15cm4s.yaml
    left_config_overrides:
      simulator.motion_time_constant_sec: 0.04
    right_config_overrides:
      simulator.motion_time_constant_sec: 0.04

