# tcp_tuning A-stage command-conditioning config (Patch 2).
# savgol window 15 = wider Savitzky-Golay -> more aggressive >~3-4 Hz attenuation,
# the A-stage lever for the ep0008 ~5-6 Hz command-origin tremor (REAL_ANALYSIS.md).
conditioning:
  servo_rate_hz: 500.0
  nominal_source_rate_hz: 30.0
  gap_median_multiplier: 3.0
  gap_absolute_threshold_sec: 0.100
  reanchor_after_gap: true
  hold_on_dropout: true

smoothing:
  method: savgol
  window_samples: 15
  polyorder: 3
  lowpass_cutoff_hz: 5.0
  cubic_smoothing: 0.0
  segment_min_samples: 5
