# tcp_tuning A-stage command-conditioning config (Patch 2).
# Use with: replay_episode_tcp_pose_target.py --conditioning-config <this>
#           batch_replay_episodes.py        --conditioning-config <this>
#           generate_replay_target.py       --config <this>
# CLI flags (--smoothing-* / --gap-*) override these values.
#
# savgol window 7 = the current default (light smoothing).
conditioning:
  servo_rate_hz: 500.0
  nominal_source_rate_hz: 30.0
  gap_median_multiplier: 3.0
  gap_absolute_threshold_sec: 0.100
  reanchor_after_gap: true
  hold_on_dropout: true

smoothing:
  method: savgol
  window_samples: 7
  polyorder: 3
  lowpass_cutoff_hz: 5.0
  cubic_smoothing: 0.0
  segment_min_samples: 5
