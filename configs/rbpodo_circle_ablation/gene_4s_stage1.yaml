experiments:
  # Open-loop diagnostic baseline.
  - name: open_loop_pub50_speed01
    config: rb_servo_server/config/local/rbpodo_ablation/gene_pub50_speed01.yaml
    profile: gene_15cm_4s
    controller: twist_stand
    arm: left
    command_rate_hz: 500
    repeat: 5
    tracking_source: tcp_ref_stand

  # Gain sweep at current baseline pub/speed.
  - name: fb_kp05_ori05_pub50_speed01
    config: rb_servo_server/config/local/rbpodo_ablation/gene_pub50_speed01.yaml
    profile: gene_15cm_4s
    controller: twist_stand_feedback
    arm: left
    command_rate_hz: 500
    repeat: 5
    tracking_source: tcp_ref_stand
    feedback_kp_pos: 0.5
    feedback_kp_ori: 0.5
    feedback_max_linear_m_s: 0.15
    feedback_max_angular_rad_s: 0.4

