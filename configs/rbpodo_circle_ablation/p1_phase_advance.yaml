# P1-CIRCLE-FACTOR-MATRIX-01 dead-time phase-advance matrix.
#
# Purpose:
# - Separate dead-time/phase-lag compensation from feedback gain, speed_bar,
#   state publication, twist-cap, and Servo J parameter factors.
# - Use the low-gain candidate pos=0.5, ori=0.2 first.
#
# Dependency:
# - Live execution requires P1-DEADTIME-PHASE-ADVANCE-01 benchmark support for
#   --phase-advance-sec. This matrix is safe to parse and dry-run before that
#   support lands; do not remove the dependency note from run reports.
#
# Safety intent:
# - rbpodo controller pgmode simulation only.
# - Physical robot should not move.
# - Results are controller-reference lower-bound evidence only.
# - GENE 15 cm / 4 s remains stress evidence and is not IL-ready or real-ready.

experiments:
  - name: fb_pos05_ori02_phase000
    config: rb_servo_server/config/dual_real_rbpodo_circle_15cm4s.example.yaml
    profile: gene_15cm_4s
    controller: twist_stand_feedback
    arm: left
    command_rate_hz: 500
    repeat: 5
    tracking_source: tcp_ref_stand
    feedback_kp_pos: 0.5
    feedback_kp_ori: 0.2
    feedback_max_linear_m_s: 0.15
    feedback_max_angular_rad_s: 0.4
    phase_advance_sec: 0.00
    config_overrides:
      network.state_pub_rate_hz: 50
      left_robot.speed_bar: 0.1
      right_robot.speed_bar: 0.1
      cartesian_control.max_twist_linear_m_s: 0.15
      cartesian_control.max_twist_angular_rad_s: 0.4

