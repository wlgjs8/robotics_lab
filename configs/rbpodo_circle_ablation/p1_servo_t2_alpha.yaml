# P1-CIRCLE-FACTOR-MATRIX-01 Servo J t2/alpha matrix.
#
# Purpose:
# - Separate Rainbow Servo J hold/filter factors from feedback gain changes.
# - Use the stable low-gain candidate pos=0.5, ori=0.2.
# - Hold state publication, speed_bar, and twist caps fixed.
#
# Safety intent:
# - rbpodo controller pgmode simulation only.
# - Physical robot should not move.
# - Results are controller-reference lower-bound evidence only.
# - GENE 15 cm / 4 s remains stress evidence and is not IL-ready or real-ready.

experiments:
  - name: fb_pos05_ori02_t2_003_alpha03
    config: rb_servo_server/config/dual_real_rbpodo_circle_15cm4s.example.yaml
    profile: gene_15cm_4s
    controller: twist_stand_feedback
    arm: left
    command_rate_hz: 100
    repeat: 5
    tracking_source: tcp_ref_stand
    feedback_kp_pos: 0.5
    feedback_kp_ori: 0.2
    feedback_max_linear_m_s: 0.15
    feedback_max_angular_rad_s: 0.4
    config_overrides:
      network.state_pub_rate_hz: 50
      left_robot.speed_bar: 0.1
      right_robot.speed_bar: 0.1
      cartesian_control.max_twist_linear_m_s: 0.15
      cartesian_control.max_twist_angular_rad_s: 0.4
      left_robot.servo_t2_sec: 0.03
      right_robot.servo_t2_sec: 0.03
      left_robot.servo_alpha: 0.3
      right_robot.servo_alpha: 0.3

