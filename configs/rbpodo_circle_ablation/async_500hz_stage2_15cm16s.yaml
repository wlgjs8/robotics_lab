# RBPODO-ASYNC-CIRCLE-MATRIX-01 stage 2.
#
# Stable 15 cm / 16 s controller-simulation matrix. Run only after stage 1
# has clean timing, reference telemetry, and no physical-motion warning.
# Socket-send rows are socket_send_only evidence and must not be reported as
# controller_ack_observed.

experiments:
  - name: 15cm16s_500hz_ack_on_pos05_ori02_t2_008
    config: rb_servo_server/config/dual_real_rbpodo_circle_15cm16s.example.yaml
    profile: circle_15cm_16s
    controller: twist_stand_feedback
    arm: left
    command_rate_hz: 500
    repeat: 3
    tracking_source: tcp_ref_stand
    feedback_kp_pos: 0.5
    feedback_kp_ori: 0.2
    feedback_max_linear_m_s: 0.03
    feedback_max_angular_rad_s: 0.2
    config_overrides:
      network.state_pub_rate_hz: 100
      left_robot.speed_bar: 0.2
      right_robot.speed_bar: 0.2
      servo.rate_hz: 500
      left_robot.servo_t1_sec: 0.002
      right_robot.servo_t1_sec: 0.002
      left_robot.disable_waiting_ack: false
      right_robot.disable_waiting_ack: false
      left_robot.command_timeout_sec: 0.05
      right_robot.command_timeout_sec: 0.05
      left_robot.servo_t2_sec: 0.08
      right_robot.servo_t2_sec: 0.08
      left_robot.servo_alpha: 0.8
      right_robot.servo_alpha: 0.8
      servo.rbpodo_async_streaming.enable: false
      servo.rbpodo_async_streaming.mode: disabled
      servo.rbpodo_async_streaming.rate_hz: 500
      servo.rbpodo_async_streaming.queue_policy: latest_wins
      servo.rbpodo_async_streaming.max_pending_age_ms: 10
      servo.rbpodo_async_streaming.ack_supervision.enable: true
      servo.rbpodo_async_streaming.ack_supervision.expected_ack_timeout_ms: 50
      servo.rbpodo_async_streaming.ack_supervision.missing_ack_fault_after_ms: 100
      servo.rbpodo_async_streaming.ack_supervision.max_consecutive_missing_ack: 10
      servo.rbpodo_async_streaming.reference_supervision.enable: false
      servo.rbpodo_async_streaming.reference_supervision.q_ref_update_timeout_ms: 50
      servo.rbpodo_async_streaming.reference_supervision.q_ref_target_tolerance_deg: 1.0
      servo.rbpodo_async_streaming.reference_supervision.q_ref_target_fault_after_ms: 100
      servo.rbpodo_async_streaming.reference_supervision.tcp_ref_update_timeout_ms: 50
      servo.rbpodo_async_streaming.reference_supervision.tcp_ref_target_tolerance_m: 0.02
      servo.rbpodo_async_streaming.reference_supervision.tcp_ref_target_fault_after_ms: 100
      servo.rbpodo_async_streaming.reference_supervision.policy: fault_latch
      servo.rbpodo_async_streaming.diagnostics.publish_per_command_jsonl: false

