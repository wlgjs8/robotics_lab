# P1-CIRCLE-FACTOR-MATRIX-01 twist-cap matrix.
#
# Purpose:
# - Separate feedback saturation from gain quality by sweeping server-side and
#   feedback-side twist caps after the gain/pub/speed stages.
# - Linear cap rows hold angular cap at 0.4 rad/s.
# - The 0.2 rad/s angular-cap rows are separate checks at the middle linear
#   cap; compare them against the matching 0.4 rad/s rows.
#
# Candidate placeholders:
# - candidate A: pos=0.5, ori=0.2 until p1_gain_split/p1_pub_speed picks a
#   better low-drift candidate.
# - candidate B: pos=0.5, ori=0.5 until p1_gain_split/p1_pub_speed picks the
#   second best low-drift candidate.
#
# Safety intent:
# - rbpodo controller pgmode simulation only.
# - Physical robot should not move.
# - Results are controller-reference lower-bound evidence only.
# - GENE 15 cm / 4 s remains stress evidence and is not IL-ready or real-ready.

experiments:
  - name: cand_a_pos05_ori02_lin015_ang04
    config: rb_servo_server/config/dual_real_rbpodo_circle_15cm4s.example.yaml
    profile: gene_15cm_4s
    controller: twist_stand_feedback
    arm: left
    command_rate_hz: 100
    repeat: 5
    tracking_source: tcp_ref_stand
    feedback_kp_pos: 0.5
    feedback_kp_ori: 0.2
    feedback_max_linear_m_s: 0.15
    feedback_max_angular_rad_s: 0.4
    config_overrides:
      network.state_pub_rate_hz: 50
      left_robot.speed_bar: 0.1
      right_robot.speed_bar: 0.1
      cartesian_control.max_twist_linear_m_s: 0.15
      cartesian_control.max_twist_angular_rad_s: 0.4

