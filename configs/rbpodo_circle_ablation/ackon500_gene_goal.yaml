# ACKON500-GENE-GOAL-01 official 500 Hz ACK-observed GENE matrix.
#
# Safety intent:
# - rbpodo controller pgmode simulation only.
# - Physical robot motion is not expected or approved.
# - ACK-off/socket-send-only rows are intentionally absent from this official
#   goal matrix because socket-send evidence cannot satisfy GOAL.md.
# - The async SDK worker rows preserve controller ACK observation while moving
#   ACK waits out of the servo tick.

experiments:
  - name: ackon500_gene_server_circle_phase005_t2_080_alpha08_path06_ori06
    config: rb_servo_server/config/dual_real_rbpodo_circle_15cm4s_500hz.example.yaml
    profile: gene_15cm_4s
    controller: server_circle
    arm: left
    command_rate_hz: 500
    repeat: 5
    tracking_source: tcp_ref_stand
    feedback_kp_pos: 0.0
    feedback_kp_ori: 0.0
    feedback_max_linear_m_s: 0.2
    feedback_max_angular_rad_s: 0.4
    phase_advance_sec: 0.005
    max_state_age_us: 5000
    max_allowed_rms_error_m: 0.003
    max_allowed_p95_error_m: 0.006
    max_allowed_orientation_drift_rad: 0.02
    max_allowed_latency_ms: 5
    env_requirements: RB_ALLOW_RBPODO_ASYNC_STREAMING,RB_ALLOW_RBPODO_DIAGNOSTICS_SUSPECT_CONTROLLER_SIM
    config_overrides:
      network.state_pub_rate_hz: 100
      left_robot.speed_bar: 0.2
      right_robot.speed_bar: 0.2
      servo.rate_hz: 500
      servo.worker_read_period_sec: 0.002
      left_robot.servo_t1_sec: 0.002
      right_robot.servo_t1_sec: 0.002
      left_robot.disable_waiting_ack: false
      right_robot.disable_waiting_ack: false
      left_robot.command_timeout_sec: 0.2
      right_robot.command_timeout_sec: 0.2
      left_robot.servo_t2_sec: 0.08
      right_robot.servo_t2_sec: 0.08
      left_robot.servo_alpha: 0.8
      right_robot.servo_alpha: 0.8
      cartesian_control.enable_benchmark_primitives: true
      cartesian_control.max_twist_linear_m_s: 0.2
      cartesian_control.max_twist_angular_rad_s: 0.4
      cartesian_control.max_linear_move_speed_m_s: 0.2
      cartesian_control.path_kp_pos: 6.0
      cartesian_control.path_kp_ori: 6.0
      cartesian_control.velocity_target_integration: previous_command
      servo.rbpodo_async_streaming.enable: true
      servo.rbpodo_async_streaming.mode: sdk_ack_worker
      servo.rbpodo_async_streaming.rate_hz: 500
      servo.rbpodo_async_streaming.queue_policy: latest_wins
      servo.rbpodo_async_streaming.max_pending_age_ms: 10
      servo.rbpodo_async_streaming.ack_supervision.enable: true
      servo.rbpodo_async_streaming.ack_supervision.expected_ack_timeout_ms: 50
      servo.rbpodo_async_streaming.ack_supervision.missing_ack_fault_after_ms: 100
      servo.rbpodo_async_streaming.ack_supervision.max_consecutive_missing_ack: 10
      servo.rbpodo_async_streaming.reference_supervision.enable: true
      servo.rbpodo_async_streaming.reference_supervision.q_ref_update_timeout_ms: 50
      servo.rbpodo_async_streaming.reference_supervision.q_ref_target_tolerance_deg: 1.0
      servo.rbpodo_async_streaming.reference_supervision.q_ref_target_fault_after_ms: 100
      servo.rbpodo_async_streaming.reference_supervision.tcp_ref_update_timeout_ms: 50
      servo.rbpodo_async_streaming.reference_supervision.tcp_ref_target_tolerance_m: 0.02
      servo.rbpodo_async_streaming.reference_supervision.tcp_ref_target_fault_after_ms: 100
      servo.rbpodo_async_streaming.reference_supervision.policy: fault_latch
      servo.rbpodo_async_streaming.diagnostics.publish_per_command_jsonl: true

