# Stage-2 rbpodo controller-simulation gain-separation matrix for the
# GENE-style 15 cm / 4 s stress profile.
#
# Purpose:
# - Separate position and orientation feedback gains.
# - Keep network.state_pub_rate_hz=50 and speed_bar=0.1 first.
# - Center the sweep around the best current low-gain candidate.
#
# Safety intent:
# - rbpodo controller pgmode simulation only.
# - Physical robot should not move.
# - Requires run_rbpodo_circle_ablation.py confirmation flags and env gates.
# - GENE 15 cm / 4 s remains stress evidence, not real-ready evidence.

experiments:
  - name: open_loop_pub50_speed01
    config: rb_servo_server/config/local/dual_real_rbpodo_circle_15cm4s.yaml
    profile: gene_15cm_4s
    controller: twist_stand
    arm: left
    command_rate_hz: 100
    repeat: 5
    tracking_source: tcp_ref_stand
    config_overrides:
      network.state_pub_rate_hz: 50
      left_robot.speed_bar: 0.1
      right_robot.speed_bar: 0.1

  - name: fb_pos03_ori00_pub50_speed01
    config: rb_servo_server/config/local/dual_real_rbpodo_circle_15cm4s.yaml
    profile: gene_15cm_4s
    controller: twist_stand_feedback
    arm: left
    command_rate_hz: 100
    repeat: 5
    tracking_source: tcp_ref_stand
    feedback_kp_pos: 0.3
    feedback_kp_ori: 0.0
    feedback_max_linear_m_s: 0.15
    feedback_max_angular_rad_s: 0.4
    config_overrides:
      network.state_pub_rate_hz: 50
      left_robot.speed_bar: 0.1
      right_robot.speed_bar: 0.1

