# RBPODO-500HZ-CIRCLE-MATRIX-01 stage 3 matrix.
#
# Purpose:
# - Run the 15 cm / 8 s middle profile before the 15 cm / 4 s stress profile.
# - Compare 500 Hz and 500 Hz with low feedback gains.
# - Keep speed_bar 0.2 enabled first; speed_bar 0.5 rows are optional and
#   disabled until the 0.2 rows are reviewed.
#
# Safety intent:
# - rbpodo controller pgmode simulation only.
# - Physical robot should not move.
# - Requires run_rbpodo_circle_ablation.py confirmation flags and env gates.
# - The 15 cm / 4 s rows remain stress evidence, not real-ready evidence.

experiments:
  - name: 15cm8s_fb_pos05_ori02_500hz_speed02
    config: rb_servo_server/config/dual_real_rbpodo_circle_15cm4s.example.yaml
    profile: circle_15cm_8s
    controller: twist_stand_feedback
    arm: left
    command_rate_hz: 500
    repeat: 3
    tracking_source: tcp_ref_stand
    feedback_kp_pos: 0.5
    feedback_kp_ori: 0.2
    feedback_max_linear_m_s: 0.08
    feedback_max_angular_rad_s: 0.3
    config_overrides:
      network.state_pub_rate_hz: 100
      left_robot.speed_bar: 0.2
      right_robot.speed_bar: 0.2
      servo.rate_hz: 500
      left_robot.servo_t1_sec: 0.002
      right_robot.servo_t1_sec: 0.002
      left_robot.command_timeout_sec: 0.05
      right_robot.command_timeout_sec: 0.05
      cartesian_control.max_twist_linear_m_s: 0.08
      cartesian_control.max_twist_angular_rad_s: 0.3
      cartesian_control.max_linear_move_speed_m_s: 0.08

