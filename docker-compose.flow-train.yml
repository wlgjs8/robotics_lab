x-policy-flow-train-base: &policy-flow-train-base
  profiles: ["flow-train"]
  build:
    context: .
    dockerfile: policy_runner/docker/policy_runner.Dockerfile
    target: cuda-ml
  image: robotics_lab/policy_runner:cuda-ml
  init: true
  shm_size: "8gb"
  user: "${FLOW_RUN_UID:-1001}:${FLOW_RUN_GID:-1001}"
  environment:
    HOME: "/tmp"
    PYTHONUNBUFFERED: "1"
    TORCHINDUCTOR_CACHE_DIR: "/tmp/torchinductor"
    XDG_CACHE_HOME: "/tmp/.cache"
  entrypoint:
    - "policy-runner"
    - "flow-train"
    - "--episodes-dir"
    - "/data/policy_episodes"
    - "--camera-names"
    - "left_realsense_color,right_realsense_color"
    - "--exclude-camera-names"
    - "left_realsense_depth,right_realsense_depth"
    - "--val-split"
    - "0.2"
    - "--sample-steps"
    - "16"
    - "--device"
    - "auto"
  volumes:
    - ./data:/data/policy_episodes:ro
    - ./outputs/flow_runs:/outputs/flow_runs
  labels:
    rb-servo.role: "hardware-free-policy-flow-train"
    rb-servo.hardware: "gpu"
    rb-servo.motion: "none"

x-gpu0: &gpu0
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: ["gpu"]

x-gpu1: &gpu1
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["1"]
            capabilities: ["gpu"]

x-gpu2: &gpu2
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["2"]
            capabilities: ["gpu"]

x-gpu3: &gpu3
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["3"]
            capabilities: ["gpu"]

x-gpu4: &gpu4
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["4"]
            capabilities: ["gpu"]

x-gpu5: &gpu5
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["5"]
            capabilities: ["gpu"]

x-gpu6: &gpu6
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["6"]
            capabilities: ["gpu"]

x-gpu7: &gpu7
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["7"]
            capabilities: ["gpu"]

x-all-gpus: &all-gpus
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: ["gpu"]

services:
  policy_flow_gpu_smoke:
    <<: [*policy-flow-train-base, *all-gpus]
    entrypoint:
      - "policy-runner"
    command:
      - "ml-preflight"
      - "--vision-backbone"
      - "tiny_cnn"
      - "--require-cuda"
      - "--expect-cuda-device-count"
      - "${FLOW_EXPECTED_GPU_COUNT:-8}"

  policy_flow_train_gpu0:
    <<: [*policy-flow-train-base, *gpu0]
    command:
      - "--checkpoint"
      - "/outputs/flow_runs/gpu0_resnet18_transformer_h16/flow_policy.pt"
      - "--write-eval-report"
      - "/outputs/flow_runs/gpu0_resnet18_transformer_h16/flow_eval_report.md"
      - "--vision-backbone"
      - "resnet18"
      - "--condition-encoder"
      - "transformer"
      - "--action-horizon"
      - "16"
      - "--hidden-dim"
      - "128"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "32"
      - "--epochs"
      - "100"

  policy_flow_train_gpu1:
    <<: [*policy-flow-train-base, *gpu1]
    command:
      - "--checkpoint"
      - "/outputs/flow_runs/gpu1_resnet18_mlp_h16/flow_policy.pt"
      - "--write-eval-report"
