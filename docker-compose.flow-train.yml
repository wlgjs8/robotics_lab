x-policy-flow-train-base: &policy-flow-train-base
  profiles: ["flow-train"]
  build:
    context: .
    dockerfile: policy_runner/docker/policy_runner.Dockerfile
    target: cuda-ml
  image: robotics_lab/policy_runner:cuda-ml
  init: true
  shm_size: "8gb"
  user: "${FLOW_RUN_UID:-1001}:${FLOW_RUN_GID:-1001}"
  environment:
    HOME: "/tmp"
    PYTHONUNBUFFERED: "1"
    POLICY_RUNNER_DINOV3_DIR: "/app/policy_runner/dinov3"
    TORCHINDUCTOR_CACHE_DIR: "/tmp/torchinductor"
    XDG_CACHE_HOME: "/tmp/.cache"
  entrypoint:
    - "policy-runner"
    - "imitation-experiment"
    - "--data-dir"
    - "/data/policy_episodes"
    - "--snapshot"
    - "/outputs/flow_runs/imitation_official/dataset_snapshot.json"
    - "--split"
    - "/outputs/flow_runs/imitation_official/split_manifest.json"
    - "--camera-names"
    - "left_realsense_color,right_realsense_color"
    - "--exclude-camera-names"
    - "left_realsense_depth,right_realsense_depth"
    - "--action-horizon"
    - "16"
    - "--image-size"
    - "128"
    - "--device"
    - "auto"
  volumes:
    - ./data:/data/policy_episodes:ro
    - ./policy_runner/dinov3:/app/policy_runner/dinov3:ro
    - ./outputs/flow_runs:/outputs/flow_runs
  labels:
    rb-servo.role: "hardware-free-policy-flow-train"
    rb-servo.hardware: "gpu"
    rb-servo.motion: "none"

x-gpu0: &gpu0
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: ["gpu"]

x-gpu1: &gpu1
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["1"]
            capabilities: ["gpu"]

x-gpu2: &gpu2
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["2"]
            capabilities: ["gpu"]

x-gpu3: &gpu3
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["3"]
            capabilities: ["gpu"]

x-gpu4: &gpu4
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["4"]
            capabilities: ["gpu"]

x-gpu5: &gpu5
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["5"]
            capabilities: ["gpu"]

x-gpu6: &gpu6
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["6"]
            capabilities: ["gpu"]

x-gpu7: &gpu7
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["7"]
            capabilities: ["gpu"]

x-all-gpus: &all-gpus
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: ["gpu"]

services:
  policy_flow_gpu_smoke:
    <<: [*policy-flow-train-base, *all-gpus]
    entrypoint:
      - "policy-runner"
    command:
      - "ml-preflight"
      - "--vision-backbone"
      - "tiny_cnn"
      - "--require-cuda"
      - "--expect-cuda-device-count"
      - "${FLOW_EXPECTED_GPU_COUNT:-8}"

  policy_imitation_snapshot:
    <<: [*policy-flow-train-base, *all-gpus]
    entrypoint:
      - "policy-runner"
    command:
      - "imitation-snapshot"
      - "--data-dir"
      - "/data/policy_episodes"
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official"
      - "--action-horizon"
      - "16"

  policy_imitation_split:
    <<: [*policy-flow-train-base, *all-gpus]
    entrypoint:
      - "policy-runner"
    command:
      - "imitation-split"
      - "--snapshot"
      - "/outputs/flow_runs/imitation_official/dataset_snapshot.json"
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official"
      - "--val-ratio"
      - "0.2"
      - "--seed"
      - "0"

  policy_flow_train_gpu0:
    <<: [*policy-flow-train-base, *gpu0]
    command:
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official/gpu0_baselines"
      - "--models"
      - "zero,train_mean,state_mlp"
      - "--hidden-dim"
      - "256"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "128"
      - "--epochs"
      - "${FLOW_EPOCHS:-20}"

  policy_flow_train_gpu1:
    <<: [*policy-flow-train-base, *gpu1]
    command:
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official/gpu1_act_resnet18_h16"
      - "--models"
      - "act_resnet18"
      - "--hidden-dim"
      - "256"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "32"
      - "--epochs"
      - "${FLOW_EPOCHS:-20}"

  policy_flow_train_gpu2:
    <<: [*policy-flow-train-base, *gpu2]
    command:
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official/gpu2_structured_resnet18"
      - "--models"
      - "structured_resnet18"
      - "--hidden-dim"
      - "256"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "32"
      - "--epochs"
      - "${FLOW_EPOCHS:-20}"

  policy_flow_train_gpu3:
    <<: [*policy-flow-train-base, *gpu3]
    command:
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official/gpu3_direct_resnet18_huber"
      - "--models"
      - "direct_bc_resnet18_huber"
      - "--hidden-dim"
      - "256"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "32"
      - "--epochs"
      - "${FLOW_EPOCHS:-20}"

  policy_flow_train_gpu4:
    <<: [*policy-flow-train-base, *gpu4]
    command:
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official/gpu4_diffusion_resnet18"
      - "--models"
      - "diffusion_resnet18"
      - "--hidden-dim"
      - "256"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "32"
      - "--epochs"
      - "${FLOW_EPOCHS:-20}"
      - "--diffusion-sample-steps"
      - "16"

  policy_flow_train_gpu5:
    <<: [*policy-flow-train-base, *gpu5]
    command:
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official/gpu5_flow_resnet50"
      - "--models"
      - "flow_resnet50"
      - "--hidden-dim"
      - "128"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "32"
      - "--epochs"
      - "${FLOW_EPOCHS:-20}"
      - "--flow-sample-steps"
      - "8"

  policy_flow_train_gpu6:
    <<: [*policy-flow-train-base, *gpu6]
    command:
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official/gpu6_act_resnet18_h32"
      - "--models"
      - "act_resnet18"
      - "--action-horizon"
      - "32"
      - "--hidden-dim"
      - "256"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "24"
      - "--epochs"
      - "${FLOW_EPOCHS:-20}"

  policy_flow_train_gpu7:
    <<: [*policy-flow-train-base, *gpu7]
    command:
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official/gpu7_act_resnet50"
      - "--models"
      - "act_resnet50"
      - "--hidden-dim"
      - "128"
      - "--lr"
      - "1e-4"
      - "--batch-size"
      - "24"
      - "--epochs"
      - "${FLOW_EPOCHS:-20}"

  policy_imitation_aggregate:
    <<: [*policy-flow-train-base, *all-gpus]
    entrypoint:
      - "policy-runner"
    command:
      - "imitation-aggregate"
      - "--input"
      - "/outputs/flow_runs/imitation_official"
      - "--output-dir"
      - "/outputs/flow_runs/imitation_official"
      - "--label"
      - "imitation_official"
