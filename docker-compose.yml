services:
  # camera_server 단일 컨테이너: C++ 캡처(librealsense) + GPU 스테레오 추론(Fast-FoundationStereo).
  camera_server:
    profiles: ["real_camera"]
    build:
      context: ./camera_server
      dockerfile: Dockerfile
    image: robotics_lab/camera_server:dev
    container_name: camera_server
    ipc: host
    shm_size: "2gb"
    network_mode: host
    privileged: true
    # GPU (스테레오 추론용; Blackwell)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./camera_server/config:/app/config:ro
      - ./camera_server/episodes:/data/episodes
      # 스테레오 모델 코드/가중치(큰 파일)는 이미지에 굽지 않고 마운트
      - ./submodules/Fast-FoundationStereo:/app/Fast-FoundationStereo
      - ./camera_server/stereo_worker:/app/stereo_worker
      # 박스 검출용: T_stand_cam(캘리브) + rb_gui settings(depth 범위) 읽기 전용
      - ${RB_T_STAND_CAM:-/home/plaif/workspace/T_stand_cam.npy}:/app/state/T_stand_cam.npy:ro
      - ${RB_GUI_STATE_DIR:-/home/plaif/.rb_servo_gui}:/app/rb_gui_state:ro
      # 손목 핸드아이 T_tcp_cam (rb_gui 기즈모가 갱신) — 아이디어2 손목 클라우드 병합용
      - ./calibration:/calibration:ro
    environment:
      # Container path; override with CAMERA_CONFIG (see Makefile cam-up).
      CAMERA_SERVER_CONFIG: ${CAMERA_CONFIG:-/app/config/triple_realsense.yaml}
      # rs400 advanced-mode JSON applied per device before streaming, so the
      # capture PC (.40) and this inference PC share identical camera settings.
      # Empty value disables it (falls back to driver defaults).
      CAMERA_SERVER_REALSENSE_JSON: ${CAMERA_REALSENSE_JSON:-/app/config/realsense_d405_advanced.json}
      FFS_DIR: /app/Fast-FoundationStereo
      STEREO_WEIGHTS: /app/Fast-FoundationStereo/weights/23-36-37/model_best_bp2_serialize.pth
      # stereo_worker가 읽는 FoundationStereo K.txt(intrinsics+baseline). 1280x720 헤드는
      # camera_server가 기동 시 디바이스 값을 /app/stereo_worker/d435_ir_1280x720_K.txt 로
      # 덤프하므로 그 경로로 주입한다(640x480 기본값은 정적 손파일).
      STEREO_INTRINSICS: ${STEREO_INTRINSICS:-/app/config/d435_ir_640x480_K.txt}
      # 캡처+워커 동시 기동 런처가 사용. 0이면 캡처만(워커 수동).
      STEREO_WORKER_AUTOSTART: ${STEREO_WORKER_AUTOSTART:-1}
      # 검출된 박스 2개를 rb_servo_server CollisionMonitor에 keep-out 으로 전송
      # (UDP SetExternalBoxes, net=host). 0이면 송신 안 함.
      STEREO_SEND_EXTERNAL_BOXES: ${STEREO_SEND_EXTERNAL_BOXES:-1}
      # 반드시 servo의 network.command_bind 포트와 일치해야 함. 이 사이트 stack_real.yaml은
      # 50256을 쓴다(문서 기본값 50010 아님 → 안 맞추면 박스 패킷이 버려짐).
      STEREO_COMMAND_ENDPOINT: ${STEREO_COMMAND_ENDPOINT:-127.0.0.1:50256}
    # 한 컨테이너에서 camera_server(C++) + stereo_worker 동시 기동 (docker compose up/start 한 번에 둘 다)
    entrypoint: ["bash", "/app/stereo_worker/run_all.sh"]
    command: []
    labels:
      rb-servo.role: "real-camera"
      rb-servo.hardware: "realsense+gpu"
