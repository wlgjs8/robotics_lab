services:
  # camera_server 단일 컨테이너: C++ 캡처(librealsense) + stereo_worker(손목 클라우드 발행).
  camera_server:
    profiles: ["real_camera"]
    build:
      context: ./camera_server
      dockerfile: Dockerfile
      args:
        LIBREALSENSE_VERSION: ${LIBREALSENSE_VERSION:-2.58.1}
        LIBREALSENSE_REF: ${LIBREALSENSE_REF:-bf2778061d5dd29776e9aca8765f75852671760b}
        LIBREALSENSE_BACKEND: ${LIBREALSENSE_BACKEND:-native}
    image: robotics_lab/camera_server:dev
    container_name: camera_server
    ipc: host
    shm_size: "2gb"
    network_mode: host
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./camera_server/config:/app/config:ro
      - ./camera_server/episodes:/data/episodes
      - ./camera_server/stereo_worker:/app/stereo_worker
    # 호스트 데스크톱/입력 응답성 보호: 캡처+워커를 코어 4/5/6에 격리(0/1/2/7은
    # GNOME/Xorg/USB-IRQ용, 3은 서보 RT isolcpus 격리).
    # live 조정은 `docker update --cpuset-cpus=... camera_server`.
    cpuset: "4,5,6"
    environment:
      # Container path; override with CAMERA_CONFIG (see Makefile cam-up).
      CAMERA_SERVER_CONFIG: ${CAMERA_CONFIG:-/app/config/triple_realsense.yaml}
      # rs400 advanced-mode JSON applied per device before streaming, so the
      # capture PC (.40) and this inference PC share identical camera settings.
      # Empty value disables it (falls back to driver defaults).
      CAMERA_SERVER_REALSENSE_JSON: ${CAMERA_REALSENSE_JSON:-/app/config/realsense_d405_advanced.json}
      # 좌/우 독립 wrist 그룹 구독이 worker 기본값. 한쪽 손목 카메라가 죽어도 건강한
      # 쪽 클라우드는 계속 흐른다. 단일 토픽으로 되돌리려면 이 env를 명시.
      STEREO_WRIST_BUNDLE_TOPIC: ${STEREO_WRIST_BUNDLE_TOPIC:-}
      # 캡처+워커 동시 기동 런처가 사용. 0이면 캡처만(워커 수동).
      STEREO_WORKER_AUTOSTART: ${STEREO_WORKER_AUTOSTART:-1}
      # 손목 클라우드 발행 주기(N프레임마다 1회)와 프레임당 viz 점수 상한.
      STEREO_WRIST_EVERY: ${STEREO_WRIST_EVERY:-3}
      STEREO_VIZ_MAX_PTS: ${STEREO_VIZ_MAX_PTS:-30000}
      # numpy/OpenBLAS/OMP 스레드 상한(deprojection의 코어 확산 억제). 0/빈값=제한 없음.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
    # 한 컨테이너에서 camera_server(C++) + stereo_worker 동시 기동 (docker compose up/start 한 번에 둘 다)
    entrypoint: ["bash", "/app/stereo_worker/run_all.sh"]
    command: []
    labels:
      rb-servo.role: "real-camera"
      rb-servo.hardware: "realsense"
