schema: robotics_lab.policy_runner.v1
# External OpenPI flow-infer against `make run MODE=sim` with recorded images.
# The camera endpoint is isolated on :5700; the physical camera_server on :5600
# is neither required nor touched. Pairs only with the tracked server
# rb_servo_server/config/stack_sim.yaml.
mode: real
action_source: teleop_mux
teleop_mux:
  tie_break: umi
runtime:
  startup_timeout_sec: 5.0
geometry:
  path: "calibration/active_calibration.yaml"
recording:
  output_dir: "policy_runner/episodes"
  rate_hz: 30.0
  format: hdf5
  control_enabled: false
  dataset_metadata:
    schema: robotics_lab.policy_runner.dataset_metadata.v1
    backend_type: rbpodo
    run_mode: real
    operation_mode: simulation
    physical_motion_expected: false
    controller_pgmode: simulation
    calibration_status: configured_estimate
    camera_status: offline_replay
    command_source_id: policy_runner
robot_state:
  bind: "udp://0.0.0.0:50378"
  stale_timeout_sec: 0.5
servo_command:
  endpoint: "udp://127.0.0.1:50256"
  timeout_sec: 0.05
  acquire_lease: true
  lease_readback_timeout_sec: 2.0
camera:
  enable: true
  zmq_endpoint: "tcp://127.0.0.1:5700"
  bundle_topic: "camera.bundle"
  max_age_ms: 500.0
  readiness_bundle_count: 5
  readiness_timeout_sec: 3.0
  stale_timeout_sec: 2.0
  record_zero_on_missing: true
  wrist_source: realsense
  wrist_crop_frac: 0.0
  expected_cameras:
    - left_realsense_color
    - left_realsense_depth
    - right_realsense_color
    - right_realsense_depth
safety:
  allow_real_motion: false
  allow_rbpodo_controller_simulation_cartesian: true
  allow_configured_estimate_geometry_in_controller_simulation: true
  allow_configured_estimate_geometry_in_real: true
  require_valid_joint_state: true
  camera_available: true
  camera_stale: false
  retarget_status: accepted
  measured_retarget_available: true
  collision_model_status: validated
  measured_collision_model_available: true
  workspace_envelope_status: validated
  measured_gripper_available: false
  allow_real_gripper_motion: false
  selected_arms: [left, right]
  minimum_inter_arm_distance_m: 0.05
gripper:
  backend: none
  startup_open: false
command_rate_hz: 500
