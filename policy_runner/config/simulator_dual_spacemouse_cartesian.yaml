schema: robotics_lab.policy_runner.v1
mode: simulation
action_source: dual_spacemouse_cartesian
runtime:
  startup_timeout_sec: 5.0
geometry:
  path: "calibration/active_calibration.yaml"
robot_state:
  bind: "udp://127.0.0.1:50120"
  stale_timeout_sec: 0.5
servo_command:
  endpoint: "udp://127.0.0.1:50010"
  timeout_sec: 0.2
safety:
  allow_real_motion: false
  require_valid_joint_state: true
  allow_configured_estimate_geometry_in_simulation: true
  allow_configured_estimate_geometry_in_real: false
command_rate_hz: 30
spacemouse_cartesian_dual:
  frame: local
  max_linear_velocity_m_s: 0.03
  max_angular_velocity_rad_s: 0.2
  deadband: 0.08
  left:
    device: null
    path: null
    device_number: 0
    deadman_button: 0
  right:
    device: null
    path: null
    device_number: 1
    deadman_button: 0
