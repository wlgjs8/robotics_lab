schema: robotics_lab.policy_runner.v1
mode: real
action_source: dual_spacemouse_cartesian
runtime:
  startup_timeout_sec: 5.0
geometry:
  path: "calibration/active_calibration.yaml"
recording:
  output_dir: "policy_runner/episodes"
  rate_hz: 100.0
  format: hdf5
  dataset_metadata:
    schema: robotics_lab.policy_runner.dataset_metadata.v1
    backend_type: rbpodo
    run_mode: real
    operation_mode: simulation
    physical_motion_expected: false
    controller_pgmode: simulation
    calibration_status: configured_estimate
    camera_status: disabled
    command_source_id: policy_runner
robot_state:
  bind: "udp://0.0.0.0:50376"
  stale_timeout_sec: 0.5
servo_command:
  endpoint: "udp://127.0.0.1:50256"
  timeout_sec: 0.05
  acquire_lease: true
  lease_readback_timeout_sec: 2.0
safety:
  # allow_real_motion=false is intentional; rbpodo pgmode simulation uses controller-simulation carve-out only.
  allow_real_motion: false
  allow_rbpodo_controller_simulation_cartesian: true
  allow_configured_estimate_geometry_in_controller_simulation: true
  allow_configured_estimate_geometry_in_real: false
  require_valid_joint_state: true
command_rate_hz: 500
spacemouse_cartesian_dual:
  frame: local
  max_linear_velocity_m_s: 0.2
  max_angular_velocity_rad_s: 0.4
  deadband: 0.08
  response_curve_gamma: 3.0
  # Operator axis remap (applied to raw cap axes before deadband/gamma):
  # translation x/z mirrored; rot_x and rot_y swapped (output rx reads cap ry).
  # angular_axis_signs flips the OUTPUT axes after the swap if needed.
  linear_axis_signs: [1.0, -1.0, -1.0]
  angular_axis_signs: [-1.0, -1.0, 1.0]
  angular_axis_order: [ry, rx, rz]
  sample_hold_timeout_sec: 0.05
  left:
    device: null
    path: /dev/hidraw5
    device_number: 0
    deadman_button: 0
  right:
    device: null
    path: /dev/hidraw10
    device_number: 0
    deadman_button: 0
