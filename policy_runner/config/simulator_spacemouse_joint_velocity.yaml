schema: robotics_lab.policy_runner.v1
mode: simulation
action_source: spacemouse_joint_velocity
runtime:
  startup_timeout_sec: 5.0
geometry:
  path: "calibration/active_calibration.yaml"
robot_state:
  bind: "udp://127.0.0.1:50120"
  stale_timeout_sec: 0.5
servo_command:
  endpoint: "udp://127.0.0.1:50010"
  timeout_sec: 0.2
safety:
  allow_real_motion: false
  require_valid_joint_state: true
command_rate_hz: 30
spacemouse:
  selected_arm: left
  max_joint_velocity_deg_s: [5, 5, 5, 8, 8, 10]
  deadband: 0.08
  smoothing_alpha: 0.2
  require_deadman: true
  deadman_button: 0
