[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-lab-policy-runner"
version = "0.1.0"
description = "Python action-source runner for robotics_lab servo commands"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
spacemouse = ["hidapi", "pyspacemouse"]
gripper = ["pyzmq>=25.0.0", "PyYAML>=6.0"]
recording = ["h5py>=3.10.0", "numpy>=1.24.0"]
camera = ["pyzmq>=25.0.0", "numpy>=1.24.0", "opencv-python>=4.8"]
ml = ["torch>=2.0", "torchvision>=0.15", "h5py>=3.10.0", "numpy>=1.24.0", "Pillow>=10.0.0"]
umi = ["h5py>=3.10.0", "numpy>=1.24.0", "Pillow>=10.0.0"]

[project.scripts]
policy-runner = "policy_runner.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["policy_runner*"]
