[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rb-servo-gui"
version = "0.1.0"
description = "Viser operator console for rb_servo_server"
requires-python = ">=3.10"
dependencies = ["viser>=0.2.0", "numpy>=1.26", "trimesh>=4.0", "yourdfpy>=0.0.56"]

[tool.setuptools.packages.find]
include = ["rb_servo_gui*"]

[tool.setuptools.package-data]
rb_servo_gui = ["static/scope/*"]

[project.scripts]
rb-servo-gui = "rb_servo_gui.app:main"
