schema: robotics_lab.calibration.v1
calibration_id: "CONFIG_ESTIMATE_001"
# Robot mounts (T_stand_*_base) are mechanically measured (see per-transform status
# below). Overall status stays "configured_estimate" and geometry_valid_for_real_policy
# stays false because camera hand-eye is still unmeasured. Camera-inclusive real policy
# remains blocked; robot-only / TCP-frame Cartesian does not depend on camera geometry.
status: configured_estimate
geometry_valid_for_real_policy: false

robot:
  T_stand_left_base:
    parent: stand
    child: left_base
    # Rotation is canonical URDF/ROS RPY converted from MJCF euler xyz.
    xyz_rpy: [0.1601, -0.1725, 0.5825, 2.186649, 0.523831, 2.526296]
    units:
      translation: m
      rotation: rad
    status: measured
    source: mechanical measurement
    # TODO(operator): record measurement_date / method / tool / robot_serial for the audit.
  T_stand_right_base:
    parent: stand
    child: right_base
    # Rotation is canonical URDF/ROS RPY converted from MJCF euler xyz.
    xyz_rpy: [-0.1601, -0.1725, 0.5825, 2.186649, -0.523831, -2.526296]
    units:
      translation: m
      rotation: rad
    status: measured
    source: mechanical measurement
    # TODO(operator): record measurement_date / method / tool / robot_serial for the audit.

cameras:
  head:
    frame: head_camera
    serial: "REPLACE_HEAD_SERIAL"
    intrinsics_status: unknown
    extrinsics_status: unmeasured
  left_wrist:
    frame: left_wrist_camera
    serial: "REPLACE_LEFT_SERIAL"
    hand_eye_status: unmeasured
  right_wrist:
    frame: right_wrist_camera
    serial: "REPLACE_RIGHT_SERIAL"
    hand_eye_status: unmeasured
