# -----------------------------
# Options affecting listfile parsing
# -----------------------------
parse:
  # Specify structure for custom cmake functions
  additional_commands:
    foo:
      flags: ["BAR", "BAZ"]
      kwargs:
        DEPENDS: "*"
        HEADERS: "*"
        SOURCES: "*"

  # Override configurations per-command where available
  override_spec: {}

  # Specify variable tags.
  vartags: []

  # Specify property tags.
  proptags: []


# -----------------------------
# Options affecting formatting
# -----------------------------
format:
  # Disable formatting entirely
  disable: false

  # How wide to allow formatted cmake files
  line_width: 100

  # How many spaces to tab for indent
  tab_size: 2

  # If true, use tab characters instead of spaces
  use_tabchars: false

  # Behavior of fractional indentation with tab characters
  fractional_tab_policy: "use-space"

  # Number of sub-groups before forcing a vertical layout
  max_subgroups_hwrap: 2

  # Maximum positional arguments before forcing a vertical layout
  max_pargs_hwrap: 6

  # Maximum lines for a command-line group before nesting
  max_rows_cmdline: 2

  # If true, separate flow control names from their parentheses with a space
  separate_ctrl_name_with_space: false

  # If true, separate function names from parentheses with a space
  separate_fn_name_with_space: false

  # If true, dangle closing parentheses on their own line
  dangle_parens: true

  # Align closing parentheses with the start of the statement
  dangle_align: "prefix"

  # Minimum length before rejecting nested layouts
  min_prefix_chars: 4

  # Maximum length before forcing a nested layout
  max_prefix_chars: 10

  # Maximum number of lines before rejecting horizontal wrapping
  max_lines_hwrap: 2

  # What style line endings to use in the output
  line_ending: "unix"

  # Format command names consistently
  command_case: "lower"

  # Format keywords consistently
  keyword_case: "upper"

  # A list of command names which should always be wrapped
  always_wrap: [
    "add_library",
    "add_executable",
    "set_target_properties"
  ]

  # If true, automatically sort known sortable argument lists
  enable_sort: true

  # If true, allow automatic inference of sortable argument lists
  autosort: false

  # If true, require a valid layout; otherwise, use best attempt
  require_valid_layout: false

  # Custom layout pass decisions
  layout_passes: {}


# ------------------------------------------------
# Options affecting comment reflow and formatting
# ------------------------------------------------
markup:
  # Character used for bulleted lists
  bullet_char: "*"

  # Character used for enumerated lists
  enum_char: "."

  # If true, do not reflow the first comment block in each file
  first_comment_is_literal: false

  # Regex pattern to identify literal comment blocks
  literal_comment_pattern: null

  # Regex pattern to match preformatted text fences in comments
  fence_pattern: "^\\s*([`~]{3}[`~]*)(.*)$"

  # Regex pattern to match rulers in comments
  ruler_pattern: "^\\s*[^\\w\\s]{3}.*[^\\w\\s]{3}$"

  # Pattern for explicitly trailing comments
  explicit_trailing_pattern: "#<"

  # Minimum length of hash ruler comments
  hashruler_min_length: 10

  # Normalize hash rulers by inserting a space and normalizing length
  canonicalize_hashrulers: true

  # If true, enable comment markup parsing and reflow
  enable_markup: true


# ----------------------------
# Options affecting the linter
# ----------------------------
lint:
  # List of lint codes to disable
  disabled_codes: []

  # Regular expression pattern for function names
  function_pattern: "[0-9a-z_]+"

  # Regular expression pattern for macro names
  macro_pattern: "[0-9A-Z_]+"

  # Regular expression pattern for global variable names
  global_var_pattern: "[A-Z][0-9A-Z_]+"

  # Regular expression pattern for internal global variable names
  internal_var_pattern: "_[A-Z][0-9A-Z_]+"

  # Regular expression pattern for local variable names
  local_var_pattern: "[a-z][a-z0-9_]+"

  # Regular expression pattern for private directory variables
  private_var_pattern: "_[0-9a-z_]+"

  # Regular expression pattern for public directory variables
  public_var_pattern: "[A-Z][0-9A-Z_]+"

  # Regular expression pattern for function/macro arguments and loop variables
  argument_var_pattern: "[a-z][a-z0-9_]+"

  # Regular expression pattern for keywords used in functions or macros
  keyword_pattern: "[A-Z][0-9A-Z_]+"

  # Maximum number of conditionals before considering a loop a parser
  max_conditionals_custom_parser: 2

  # Minimum required newlines between statements
  min_statement_spacing: 1

  # Maximum allowed newlines between statements
  max_statement_spacing: 2

  # Maximum number of return statements allowed in a function
  max_returns: 6

  # Maximum number of branches allowed in a function
  max_branches: 12

  # Maximum number of arguments allowed in a function
  max_arguments: 5

  # Maximum number of local variables allowed in a function
  max_localvars: 15

  # Maximum number of statements allowed in a function
  max_statements: 50


# -------------------------------
# Options affecting file encoding
# -------------------------------
encode:
  # If true, emit the Unicode byte-order mark (BOM) at the start of the file
  emit_byteorder_mark: false

  # Specify the input file encoding (default: utf-8)
  input_encoding: "utf-8"

  # Specify the output file encoding (default: utf-8)
  output_encoding: "utf-8"


# -------------------------------------
# Miscellaneous configurations options
# -------------------------------------
misc:
  # Per-command configuration overrides (currently supports only `command_case`)
  per_command: {}
